<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ARES STATION // Mars Colony</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  canvas { display: block; }

  /* Атмосферный UI оверлей */
  .ui-layer {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 10;
  }

  /* Угловая плашка с названием */
  .location-tag {
    position: absolute; top: 32px; left: 32px;
    color: #ff8a5c;
    text-shadow: 0 0 12px rgba(255,120,60,0.8), 0 0 2px #fff;
    letter-spacing: 4px;
  }
  .location-tag .top {
    font-size: 11px; opacity: 0.7; letter-spacing: 6px;
    border-left: 2px solid #ff8a5c; padding-left: 10px;
  }
  .location-tag .title {
    font-size: 34px; font-weight: bold; margin-top: 4px;
    letter-spacing: 8px;
  }
  .location-tag .sub {
    font-size: 12px; opacity: 0.85; margin-top: 6px;
    letter-spacing: 3px; color: #ffd0a8;
  }
  .location-tag .line {
    width: 220px; height: 1px;
    background: linear-gradient(90deg, #ff8a5c, transparent);
    margin-top: 10px;
  }

  /* Правый верхний HUD */
  .hud-right {
    position: absolute; top: 32px; right: 32px;
    color: #ff8a5c; font-size: 11px; letter-spacing: 2px;
    text-align: right;
    text-shadow: 0 0 8px rgba(255,120,60,0.6);
  }
  .hud-right .blink { animation: blink 1.4s infinite; }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0.2} }

  /* Нижняя полоса телеметрии */
  .telemetry {
    position: absolute; bottom: 28px; left: 32px; right: 32px;
    display: flex; justify-content: space-between;
    color: #ffb48a; font-size: 11px; letter-spacing: 3px;
    opacity: 0.85;
    text-shadow: 0 0 6px rgba(255,120,60,0.5);
  }
  .telemetry .bar {
    display: inline-block; width: 60px; height: 4px;
    background: rgba(255,138,92,0.2); margin-left: 8px;
    position: relative; overflow: hidden; vertical-align: middle;
  }
  .telemetry .bar::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, #ff8a5c, #ffd0a8);
    animation: barMove 2.5s infinite ease-in-out;
  }
  @keyframes barMove { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

  /* Угловые рамки (скобки) */
  .corner { position: absolute; width: 40px; height: 40px; border: 1px solid rgba(255,138,92,0.5); }
  .corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  /* Сканирующая линия */
  .scanline {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,138,92,0.4), transparent);
    animation: scan 6s linear infinite;
  }
  @keyframes scan { 0%{top:0} 100%{top:100%} }

  /* Виньетка */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  }

  /* Загрузочный экран */
  .loader {
    position: fixed; inset: 0; background: #1a0806;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #ff8a5c; z-index: 100;
    transition: opacity 1.2s ease; letter-spacing: 6px;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .loader .dot { animation: dot 1.4s infinite; }
  .loader .dot:nth-child(2){ animation-delay: .2s }
  .loader .dot:nth-child(3){ animation-delay: .4s }
  @keyframes dot { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  .hint {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    color: #ff8a5c; font-size: 10px; letter-spacing: 4px; opacity: 0.6;
    animation: fadeHint 4s ease-in-out infinite;
  }
  @keyframes fadeHint { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div>INITIALIZING COLONY LINK</div>
  <div style="margin-top:14px;">
    <span class="dot">●</span>
    <span class="dot">●</span>
    <span class="dot">●</span>
  </div>
</div>

<div class="ui-layer">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="scanline"></div>
  <div class="vignette"></div>

  <div class="location-tag">
    <div class="top">SECTOR 07 // OLYMPUS REGION</div>
    <div class="title">ARES STATION</div>
    <div class="sub">MARS COLONY · SOL 247 · 14:32 UTC</div>
    <div class="line"></div>
  </div>

  <div class="hud-right">
    <div>SYS <span class="blink">●</span> ONLINE</div>
    <div style="margin-top:4px;">TEMP −63°C</div>
    <div style="margin-top:4px;">PRESS 0.636 KPA</div>
    <div style="margin-top:4px;">WIND 24 M/S</div>
    <div style="margin-top:4px;">CREW 12 / 12</div>
  </div>

  <div class="telemetry">
    <div>O₂ <span class="bar"></span> 98%</div>
    <div>PWR <span class="bar"></span> 87%</div>
    <div>COM <span class="bar"></span> 100%</div>
    <div>HULL <span class="bar"></span> 94%</div>
  </div>

  <div class="hint">◂ DRAG TO ORBIT · SCROLL TO ZOOM ▸</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === БАЗОВАЯ СЦЕНА ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a0d08);
scene.fog = new THREE.Fog(0x5a1f10, 25, 120);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(60, 28, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// === ГРАДИЕНТНОЕ НЕБО ===
const skyGeo = new THREE.SphereGeometry(200, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x1a0503) },
    midColor: { value: new THREE.Color(0x8a3418) },
    bottomColor: { value: new THREE.Color(0xd46a3a) },
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 bottomColor;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos).y;
      vec3 col = mix(bottomColor, midColor, smoothstep(-0.1, 0.2, h));
      col = mix(col, topColor, smoothstep(0.2, 0.9, h));
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// === ОСВЕЩЕНИЕ ===
const ambient = new THREE.AmbientLight(0xffaa77, 0.35);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffb080, 1.4);
sun.position.set(40, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0005;
sun.shadow.radius = 4;
scene.add(sun);

const rimLight = new THREE.DirectionalLight(0xff5533, 0.4);
rimLight.position.set(-30, 20, -40);
scene.add(rimLight);

// === МАРСИАНСКАЯ ПОВЕРХНОСТЬ ===
const groundGeo = new THREE.PlaneGeometry(300, 300, 120, 120);
const pos = groundGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), y = pos.getY(i);
  const d = Math.sqrt(x*x + y*y);
  // Холмы + шум + кратер вокруг станции
  let h = Math.sin(x*0.1)*0.8 + Math.cos(y*0.13)*0.7
        + Math.sin(x*0.3 + y*0.2)*0.3
        + Math.sin(x*0.05)*2.5;
  if (d < 18) h *= (d/18); // выравнивание под станцию
  pos.setZ(i, h);
}
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({
  color: 0xb85a30,
  roughness: 0.95,
  metalness: 0.05,
  flatShading: true,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Камни разбросанные
const rockGeo = new THREE.DodecahedronGeometry(1, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x7a3a1f, roughness: 1, flatShading: true });
for (let i = 0; i < 60; i++) {
  const r = new THREE.Mesh(rockGeo, rockMat);
  const a = Math.random()*Math.PI*2;
  const d = 20 + Math.random()*80;
  r.position.set(Math.cos(a)*d, 0, Math.sin(a)*d);
  const s = 0.3 + Math.random()*1.8;
  r.scale.set(s, s*0.7, s);
  r.rotation.set(Math.random(), Math.random(), Math.random());
  r.castShadow = true;
  r.receiveShadow = true;
  scene.add(r);
}

// === СТАНЦИЯ ===
const station = new THREE.Group();
scene.add(station);

// Главный светящийся купол
const domeGeo = new THREE.SphereGeometry(6, 48, 32, 0, Math.PI*2, 0, Math.PI/2);
const domeMat = new THREE.MeshPhysicalMaterial({
  color: 0xffd9a8,
  emissive: 0xff7a3a,
  emissiveIntensity: 0.5,
  transparent: true,
  opacity: 0.55,
  roughness: 0.1,
  metalness: 0.2,
  transmission: 0.6,
  thickness: 0.5,
});
const dome = new THREE.Mesh(domeGeo, domeMat);
dome.position.y = 0.01;
dome.castShadow = true;
station.add(dome);

// Основание купола
const baseGeo = new THREE.CylinderGeometry(6.3, 6.8, 1.2, 32);
const baseMat = new THREE.MeshStandardMaterial({ color: 0xd8d0c4, roughness: 0.6, metalness: 0.4 });
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = 0.6;
base.castShadow = true;
base.receiveShadow = true;
station.add(base);

// Внутренний светящийся стержень (ядро станции)
const coreGeo = new THREE.CylinderGeometry(0.4, 0.4, 5, 16);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0xffaa66, emissive: 0xff5522, emissiveIntensity: 2
});
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.y = 3;
station.add(core);

// Точечный свет внутри купола
const coreLight = new THREE.PointLight(0xff8844, 3, 25, 2);
coreLight.position.set(0, 3, 0);
station.add(coreLight);

// Жилые модули (цилиндры по кругу)
const moduleMat = new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.5, metalness: 0.5 });
for (let i = 0; i < 4; i++) {
  const a = (i/4)*Math.PI*2 + Math.PI/4;
  const mod = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 3, 16), moduleMat);
  mod.position.set(Math.cos(a)*11, 1.5, Math.sin(a)*11);
  mod.rotation.z = Math.PI/2;
  mod.rotation.y = -a;
  mod.castShadow = true;
  mod.receiveShadow = true;
  station.add(mod);

  // Окна модулей (светящиеся)
  const winMat = new THREE.MeshStandardMaterial({ color: 0xffcc88, emissive: 0xffaa44, emissiveIntensity: 1.5 });
  for (let j = 0; j < 3; j++) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.1), winMat);
    const off = (j-1)*0.8;
    win.position.set(
      Math.cos(a)*(11 + off*0) + Math.cos(a+Math.PI/2)*0,
      1.5 + 0.4,
      Math.sin(a)*(11 + off*0)
    );
    // Разместим окна на верхней стороне
    const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
    win.position.set(
      Math.cos(a)*(11) + Math.cos(a+Math.PI/2)*off*0.3,
      2.3,
      Math.sin(a)*(11) + Math.sin(a+Math.PI/2)*off*0.3
    );
    station.add(win);
  }
}

// Соединительные коридоры
for (let i = 0; i < 4; i++) {
  const a = (i/4)*Math.PI*2 + Math.PI/4;
  const corr = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 5),
    new THREE.MeshStandardMaterial({ color: 0xc8c0b0, roughness: 0.7, metalness: 0.3 })
  );
  corr.position.set(Math.cos(a)*7.5, 0.8, Math.sin(a)*7.5);
  corr.rotation.y = -a + Math.PI/2;
  corr.castShadow = true;
  corr.receiveShadow = true;
  station.add(corr);
}

// Антенны (покачиваются)
const antennas = [];
for (let i = 0; i < 3; i++) {
  const a = (i/3)*Math.PI*2;
  const ant = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.3 })
  );
  pole.position.y = 4;
  ant.add(pole);
  const dish = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 16, 8, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.4, side: THREE.DoubleSide })
  );
  dish.position.y = 8;
  dish.rotation.x = Math.PI;
  ant.add(dish);
  // Красный маяк
  const beacon = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff0000, emissiveIntensity: 2 })
  );
  beacon.position.y = 8.2;
  ant.add(beacon);
  ant.position.set(Math.cos(a)*16, 0, Math.sin(a)*16);
  ant.userData = { phase: i*1.3, beacon };
  station.add(ant);
  antennas.push(ant);
}

// Солнечные панели
for (let i = 0; i < 2; i++) {
  const side = i === 0 ? 1 : -1;
  const panel = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.15, 3, 8),
    new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7 })
  );
  pole.position.y = 1.5;
  panel.add(pole);
  const panelSurface = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.1, 2.5),
    new THREE.MeshStandardMaterial({ color: 0x1a2a55, metalness: 0.6, roughness: 0.3, emissive: 0x0a1530, emissiveIntensity: 0.3 })
  );
  panelSurface.position.y = 3;
  panel.add(panelSurface);
  panel.position.set(side*20, 0, side*5);
  panel.rotation.y = side*0.3;
  panel.castShadow = true;
  station.add(panel);
}

// Посадочная платформа
const padGeo = new THREE.CylinderGeometry(4, 4, 0.3, 32);
const padMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8, metalness: 0.3 });
const pad = new THREE.Mesh(padGeo, padMat);
pad.position.set(-18, 0.15, 12);
pad.receiveShadow = true;
station.add(pad);
// Разметка
const ringMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff8800, emissiveIntensity: 0.8 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(3, 0.08, 8, 32), ringMat);
ring.rotation.x = -Math.PI/2;
ring.position.set(-18, 0.35, 12);
station.add(ring);

// === ДРОНЫ (пролетающие) ===
const drones = [];
for (let i = 0; i < 5; i++) {
  const drone = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.2, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.7, roughness: 0.3 })
  );
  drone.add(body);
  const light = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x66ffff, emissive: 0x44ffff, emissiveIntensity: 2 })
  );
  light.position.y = -0.15;
  drone.add(light);
  const dLight = new THREE.PointLight(0x66ffff, 0.5, 4);
  dLight.position.y = -0.15;
  drone.add(dLight);

  drone.userData = {
    radius: 15 + Math.random()*25,
    height: 5 + Math.random()*10,
    speed: 0.15 + Math.random()*0.25,
    phase: Math.random()*Math.PI*2,
    tilt: (Math.random()-0.5)*0.3,
  };
  scene.add(drone);
  drones.push(drone);
}

// === ПЫЛЕВЫЕ ЧАСТИЦЫ ===
const dustCount = 800;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount*3);
const dustVel = [];
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3]   = (Math.random()-0.5)*150;
  dustPos[i*3+1] = Math.random()*25;
  dustPos[i*3+2] = (Math.random()-0.5)*150;
  dustVel.push({
    x: (Math.random()-0.5)*0.02,
    y: (Math.random()-0.5)*0.005,
    z: (Math.random()-0.5)*0.02,
  });
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xffaa77, size: 0.15, transparent: true, opacity: 0.5,
  depthWrite: false, blending: THREE.AdditiveBlending
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

// === ORBIT CONTROLS (включатся после подлёта) ===
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 3, 0);
controls.minDistance = 15;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI/2 - 0.05;
controls.enabled = false;

// === КИНЕМАТОГРАФИЧНЫЙ ПОДЛЁТ КАМЕРЫ ===
const camStart = new THREE.Vector3(70, 30, 70);
const camEnd = new THREE.Vector3(22, 12, 22);
const introDuration = 4.5; // секунды
let introTime = 0;
let introComplete = false;
camera.position.copy(camStart);

// Скрываем лоадер
setTimeout(() => document.getElementById('loader').classList.add('hide'), 400);

// === АНИМАЦИЯ ===
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // Подлёт камеры
  if (!introComplete) {
    introTime += dt;
    const p = Math.min(introTime / introDuration, 1);
    // easeInOutCubic
    const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;
    camera.position.lerpVectors(camStart, camEnd, e);
    camera.lookAt(0, 3, 0);
    if (p >= 1) {
      introComplete = true;
      controls.enabled = true;
    }
  }

  // Пульсация купола (главный светящийся объект)
  const pulse = 0.4 + Math.sin(t*1.5)*0.25;
  domeMat.emissiveIntensity = pulse;
  coreLight.intensity = 2 + Math.sin(t*1.5)*1.2;
  coreMat.emissiveIntensity = 1.5 + Math.sin(t*2)*0.8;

  // Покачивание антенн
  antennas.forEach((ant, i) => {
    const ph = ant.userData.phase;
    ant.rotation.z = Math.sin(t*0.8 + ph)*0.04;
    ant.rotation.x = Math.cos(t*0.7 + ph)*0.03;
    // Мигание маяка
    ant.userData.beacon.material.emissiveIntensity = (Math.sin(t*3 + ph) > 0.5) ? 3 : 0.3;
  });

  // Дроны по орбитам
  drones.forEach(d => {
    const u = d.userData;
    const ang = t*u.speed + u.phase;
    d.position.set(
      Math.cos(ang)*u.radius,
      u.height + Math.sin(t*0.8 + u.phase)*0.8,
      Math.sin(ang)*u.radius
    );
    d.rotation.y = -ang + Math.PI/2;
    d.rotation.x = u.tilt + Math.sin(t*2 + u.phase)*0.1;
  });

  // Пылевые частицы
  const dp = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    dp[i*3]   += dustVel[i].x + Math.sin(t*0.3 + i)*0.003;
    dp[i*3+1] += dustVel[i].y;
    dp[i*3+2] += dustVel[i].z;
    if (Math.abs(dp[i*3]) > 75) dp[i*3] *= -0.9;
    if (dp[i*3+1] > 25 || dp[i*3+1] < 0) dustVel[i].y *= -1;
    if (Math.abs(dp[i*3+2]) > 75) dp[i*3+2] *= -0.9;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Обновление телеметрии (время SOL)
  if (Math.floor(t*2) % 2 === 0) {
    const sub = document.querySelector('.location-tag .sub');
    if (sub) {
      const h = 14 + Math.floor(t/10)%10;
      const m = Math.floor(t*3)%60;
      sub.textContent = `MARS COLONY · SOL 247 · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} UTC`;
    }
  }

  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
}
animate();

// === RESIZE ===
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
