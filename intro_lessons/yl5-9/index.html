<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>4 игры</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10111a; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .game-switcher {
      position: relative;
      z-index: 10;
      height: 54px;
      padding: 8px max(10px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      background: rgba(13, 14, 23, .98);
      border-bottom: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 5px 18px rgba(0, 0, 0, .25);
    }
    .game-tab {
      flex: 1 1 0;
      min-width: 155px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, .07);
      color: #e9eaf1;
      font: 700 13px/1.1 Arial, Helvetica, sans-serif;
      white-space: nowrap;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .game-tab:hover { background: rgba(255, 255, 255, .12); transform: translateY(-1px); }
    .game-tab:focus-visible { outline: 3px solid #9f8cff; outline-offset: 1px; }
    .game-tab.active {
      background: #6d50e6;
      border-color: #9d8aff;
      color: #fff;
      box-shadow: 0 4px 14px rgba(109, 80, 230, .35);
    }
    .game-number {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .15);
      font-size: 12px;
    }
    .game-tab.active .game-number { background: rgba(255, 255, 255, .23); }
    .game-stage { position: relative; width: 100%; height: calc(100% - 54px); }
    .game-frame { display: none; width: 100%; height: 100%; border: 0; background: #fff; }
    .game-frame.active { display: block; }
    @media (max-width: 900px) {
      .game-switcher { height: 52px; padding-block: 7px; justify-content: flex-start; }
      .game-tab { flex: 0 0 auto; min-width: 0; padding-inline: 11px; }
      .game-stage { height: calc(100% - 52px); }
    }
  </style>
</head>

  </nav>

    const tabs = [...document.querySelectorAll('.game-tab')];
    const frames = [...document.querySelectorAll('.game-frame')];

    function decodeHtml(base64) {
      const bytes = Uint8Array.from(atob(base64), character => character.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    }

    frames.forEach((frame, index) => {
      frame.srcdoc = decodeHtml(gameSources[index]);
    });

    function openGame(index) {
      tabs.forEach((tab, tabIndex) => {
        const active = tabIndex === index;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      frames.forEach((frame, frameIndex) => frame.classList.toggle('active', frameIndex === index));
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => openGame(index));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        let target = index;
        if (event.key === 'ArrowLeft') target = (index - 1 + tabs.length) % tabs.length;
        if (event.key === 'ArrowRight') target = (index + 1) % tabs.length;
        if (event.key === 'Home') target = 0;
        if (event.key === 'End') target = tabs.length - 1;
        openGame(target);
        tabs[target].focus();
      });
    });

    openGame(0);
  </script>
