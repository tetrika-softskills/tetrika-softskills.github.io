<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100a1b">
  <title>Диагностические игры</title>
  <style>
    :root{--bg:#0d0915;--text:#fff9ff;--muted:#c8b9d3}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}body{display:grid;grid-template-rows:auto minmax(0,1fr)}
    .game-bar{position:relative;z-index:10;display:flex;align-items:center;gap:7px;min-width:0;height:46px;padding:5px 8px;border-bottom:1px solid #4a3560;background:#120c1df5;box-shadow:0 5px 18px #0008;backdrop-filter:blur(14px)}
    .game-tabs{display:flex;gap:6px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}.game-tabs::-webkit-scrollbar{display:none}.game-tab{display:flex;align-items:center;gap:7px;min-width:max-content;height:34px;padding:5px 11px;border:1px solid #49345d;border-radius:10px;background:#20152d;color:var(--muted);cursor:pointer;transition:.18s}.game-tab span{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:#312040;color:#cbb5dc;font-size:11px;font-weight:900}.game-tab strong{font-size:12px;white-space:nowrap}.game-tab:hover{border-color:#8e66b9;color:#fff}.game-tab.active{border-color:#b98df4;background:linear-gradient(135deg,#623bb9,#8d287f);color:#fff;box-shadow:0 5px 16px #7c3aed44}.game-tab.active span{background:#fff;color:#6e38b8}
    .fullscreen{width:34px;height:34px;flex:0 0 auto;border:1px solid #543d69;border-radius:10px;background:#21162f;color:#fff;font-size:16px;cursor:pointer}.fullscreen:hover{border-color:#b98df4}
    .game-stage{position:relative;min-height:0}.game-view{position:absolute;inset:0;display:none;background:#0b0713}.game-view.active{display:block}.game-view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0713;opacity:0;transition:opacity .2s}.game-view.loaded iframe{opacity:1}.loader{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px}.game-view.loaded .loader{display:none}
    @media(max-width:620px){.game-bar{height:42px;padding:4px 6px}.game-tab{height:32px;padding:4px 9px}.game-tab strong{font-size:11px}.fullscreen{width:32px;height:32px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="game-bar">
    <nav class="game-tabs" role="tablist" aria-label="Выбор игры">
      <button class="game-tab active" type="button" role="tab" aria-selected="true" data-game="0">
        <span>1</span><strong>Мои навыки</strong>
      </button>
      <button class="game-tab" type="button" role="tab" aria-selected="false" data-game="1">
        <span>2</span><strong>Выбор сюжета</strong>
      </button>
      <button class="game-tab" type="button" role="tab" aria-selected="false" data-game="2">
        <span>3</span><strong>Сложный разговор</strong>
      </button>
      <button class="game-tab" type="button" role="tab" aria-selected="false" data-game="3">
        <span>4</span><strong>Выскажи свое мнение</strong>
      </button>
    </nav>
    <button class="fullscreen" id="fullscreen" type="button" aria-label="Открыть на весь экран">⛶</button>
  </header>
  <main class="game-stage">
    <section class="game-view active" id="game-0" role="tabpanel" aria-label="Мои навыки">
      <div class="loader">Загружаем игру...</div>
      <iframe title="Мои навыки" data-src="games/game-1.html" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
    </section>
    <section class="game-view" id="game-1" role="tabpanel" aria-label="Выбор сюжета">
      <div class="loader">Загружаем игру...</div>
      <iframe title="Выбор сюжета" data-src="games/game-2.html" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
    </section>
    <section class="game-view" id="game-2" role="tabpanel" aria-label="Сложный разговор">
      <div class="loader">Загружаем игру...</div>
      <iframe title="Сложный разговор" data-src="games/game-3.html" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
    </section>
    <section class="game-view" id="game-3" role="tabpanel" aria-label="Выскажи свое мнение">
      <div class="loader">Загружаем игру...</div>
      <iframe title="Выскажи свое мнение" data-src="games/game-4.html" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
    </section>
  </main>
  <script>
    (() => {
      const tabs = [...document.querySelectorAll('.game-tab')];
      const views = [...document.querySelectorAll('.game-view')];

      function loadGame(index) {
        const view = views[index];
        const frame = view.querySelector('iframe');
        if (frame.dataset.loaded) return;
        frame.dataset.loaded = 'true';
        frame.addEventListener('load', () => view.classList.add('loaded'), { once: true });
        frame.src = frame.dataset.src;
      }

      function activate(index) {
        tabs.forEach((tab, i) => {
          const active = i === index;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex = active ? 0 : -1;
          views[i].classList.toggle('active', active);
        });
        loadGame(index);
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => activate(index));
        tab.addEventListener('keydown', event => {
          if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
          event.preventDefault();
          const next = (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
          tabs[next].focus();
          activate(next);
        });
      });

      document.getElementById('fullscreen').addEventListener('click', () => {
        if (document.fullscreenElement) document.exitFullscreen?.();
        else document.documentElement.requestFullscreen?.();
      });

      activate(0);
    })();
  </script>
</body>
</html>
