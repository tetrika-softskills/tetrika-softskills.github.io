  <script>
  (function(){
    var cases=[
      {
        title:"ИИ в учебе",

          {nick:"@yandex.go",logo:"../assets/g4-2ce2c2513c6c.jpg",

    var geoCases=[
      {
        id:"brands",
        title:"Нужны ли брендовые вещи?",

          {id:"sonya",author:"@соня.корн",likes:"1,2 тыс.",avatar:personAvatar,text:"Почему сразу выпендреж? Может, дизайн реально классный и человек копил именно на них."},
          {id:"yandex",author:"@яндекс.го",likes:"846",avatar:yandexLogo,text:"Три цены за галочку на кроссах - реклама на вас работает"}
        ]
      },
      {
        id:"geo",
        title:"Стоит ли включать геолокацию?",
        image:"../assets/g4-d56da04115d0.webp",
        alt:"Подросток рассуждает о постоянной геолокации",
        description:"Нет ничего страшного в том, что родители постоянно видят твою геолокацию. Они просто переживают за твою безопасность.",
        comments:[
          {id:"yandex",author:"яндекс.го",likes:"623",avatar:yandexLogo,text:"«Нечего скрывать» — вообще не аргумент. Личные границы куда делись?"},

        ]
      }
    ];
    var geoState={stage:"choose",caseId:null,selected:null,dragging:null,placements:{weak:null,agree:null}};
    var geoApp=document.getElementById("app");
    document.title="Выскажи свое мнение и беги";
    function geoEsc(value){return String(value).replace(/[&<>\"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];});}
    function currentCase(){return geoCases.filter(function(item){return item.id===geoState.caseId;})[0]||geoCases[0];}
    function currentComments(){return currentCase().comments;}
    function geoTop(progress,label,back){return '<div class="geo-top">'+(back?'<button class="back" id="geo-back" type="button" aria-label="Назад">←</button>':'<span style="width:42px"></span>')+'<div class="progress"><i style="width:'+progress+'%"></i></div><span class="geo-case-count">'+geoEsc(label)+'</span></div>';}
    function geoComment(id,location){var item=currentComments().filter(function(comment){return comment.id===id;})[0];return '<button class="drag-comment '+(geoState.selected===id?'selected':'')+'" draggable="true" data-geo-comment="'+id+'" data-location="'+location+'" type="button"><span class="drag-head"><span class="drag-avatar"><img src="'+item.avatar+'" alt="Аватар '+geoEsc(item.author)+'"></span><span class="drag-author">'+geoEsc(item.author)+'</span><span class="drag-likes">♥ '+geoEsc(item.likes)+'</span></span><p>'+geoEsc(item.text)+'</p></button>';}
    function geoLocation(id){if(geoState.placements.weak===id)return "weak";if(geoState.placements.agree===id)return "agree";return "pool";}
    function geoChoose(){return '<section class="geo-game"><div class="geo-shell">'+geoTop(12,"Шаг 1 из 3",false)+'<main class="geo-panel case-choice-screen"><article class="case-choice-panel"><h1>Выбери кейс</h1><div class="case-choice-grid">'+geoCases.map(function(item){return '<button class="case-choice" data-case-id="'+item.id+'" type="button"><img src="'+item.image+'" alt="'+geoEsc(item.alt)+'"><strong>'+geoEsc(item.title)+'</strong></button>';}).join("")+'</div></article></main></div></section>';}
    function geoCase(){var item=currentCase();return '<section class="geo-game"><div class="geo-shell">'+geoTop(45,"Шаг 2 из 3",true)+'<article class="geo-panel geo-case"><div class="geo-visual"><img src="'+item.image+'" alt="'+geoEsc(item.alt)+'"></div><div class="geo-case-copy"><p class="geo-case-name">'+geoEsc(item.title)+'</p><p class="geo-case-text"><strong>'+geoEsc(item.description)+'</strong></p><div class="geo-opinion"><h2>А какое у тебя мнение?</h2><button class="primary" id="geo-next" type="button">Дальше</button></div></div></article></div></section>';}
    function geoZone(key,title){var id=geoState.placements[key];return '<section class="drop-zone" data-geo-zone="'+key+'" tabindex="0" role="button" aria-label="'+geoEsc(title)+'"><h2>'+geoEsc(title)+'</h2>'+(id?geoComment(id,key):'<div class="drop-placeholder">Перетащи сюда комментарий</div>')+'</section>';}
    function geoSort(){var remaining=currentComments().filter(function(comment){return geoLocation(comment.id)==="pool";});var complete=Boolean(geoState.placements.weak&&geoState.placements.agree);return '<section class="geo-game"><div class="geo-shell">'+geoTop(78,"Шаг 3 из 3",true)+'<main class="geo-panel geo-sort"><div class="geo-sort-head"><h1>Разбери аргументы</h1></div><div class="geo-workspace"><section><h2 class="geo-column-title">Комментарии</h2><div class="comment-pool" id="geo-pool">'+(remaining.length?remaining.map(function(comment){return geoComment(comment.id,"pool");}).join(""):'<div class="drop-placeholder">Все комментарии распределены</div>')+'</div></section><section><h2 class="geo-column-title">Твой выбор</h2><div class="question-zones">'+geoZone("weak","Какой аргумент тебе кажется слабым?")+geoZone("agree","С какой мыслью ты согласен?")+'</div></section></div><div class="geo-sort-actions"><button class="primary" id="geo-result" type="button" '+(complete?'':'disabled')+'>Показать результат</button></div></main></div></section>';}
    function geoResult(){var skills=["способность формулировать собственную позицию","навыки аргументации","умеет ли отделять факт и оценку","замечает слабые и сильные утверждения","допускает ли исключения — гибкость мышления"];return '<section class="geo-game"><div class="geo-shell">'+geoTop(100,"Результат",true)+'<main class="geo-result"><article class="geo-panel geo-result-card"><p class="geo-eyebrow">Результат</p><h1>Что проверял этот кейс у ребенка:</h1><ul class="diagnostic-list">'+skills.map(function(skill){return '<li>'+geoEsc(skill)+'</li>';}).join("")+'</ul><div class="geo-result-actions"><button class="primary" id="geo-restart" type="button">Выбрать другой кейс</button></div></article></main></div></section>';}
    function geoPlace(id,zone){if(!id)return;Object.keys(geoState.placements).forEach(function(key){if(geoState.placements[key]===id)geoState.placements[key]=null;});geoState.placements[zone]=id;geoState.selected=null;geoRender();}
    function geoBind(){Array.prototype.forEach.call(document.querySelectorAll("[data-case-id]"),function(card){card.onclick=function(){geoState={stage:"case",caseId:card.getAttribute("data-case-id"),selected:null,dragging:null,placements:{weak:null,agree:null}};geoRender();};});var element=document.getElementById("geo-next");if(element)element.onclick=function(){geoState.stage="sort";geoRender();};element=document.getElementById("geo-back");if(element)element.onclick=function(){geoState.stage=geoState.stage==="result"?"sort":geoState.stage==="sort"?"case":"choose";geoRender();};element=document.getElementById("geo-result");if(element)element.onclick=function(){if(!this.disabled){geoState.stage="result";geoRender();}};element=document.getElementById("geo-restart");if(element)element.onclick=function(){geoState={stage:"choose",caseId:null,selected:null,dragging:null,placements:{weak:null,agree:null}};geoRender();};Array.prototype.forEach.call(document.querySelectorAll("[data-geo-comment]"),function(card){card.onclick=function(event){event.stopPropagation();var id=card.getAttribute("data-geo-comment"),location=card.getAttribute("data-location");if(location!=="pool")geoState.placements[location]=null;geoState.selected=geoState.selected===id?null:id;geoRender();};card.ondragstart=function(event){geoState.dragging=card.getAttribute("data-geo-comment");card.classList.add("dragging");if(event.dataTransfer)event.dataTransfer.setData("text/plain",geoState.dragging);};card.ondragend=function(){geoState.dragging=null;card.classList.remove("dragging");};});Array.prototype.forEach.call(document.querySelectorAll("[data-geo-zone]"),function(zone){zone.onclick=function(){if(geoState.selected)geoPlace(geoState.selected,zone.getAttribute("data-geo-zone"));};zone.onkeydown=function(event){if((event.key==="Enter"||event.key===" ")&&geoState.selected){event.preventDefault();geoPlace(geoState.selected,zone.getAttribute("data-geo-zone"));}};zone.ondragover=function(event){event.preventDefault();zone.classList.add("drag-over");};zone.ondragleave=function(){zone.classList.remove("drag-over");};zone.ondrop=function(event){event.preventDefault();zone.classList.remove("drag-over");var id=geoState.dragging||(event.dataTransfer&&event.dataTransfer.getData("text/plain"));geoPlace(id,zone.getAttribute("data-geo-zone"));};});element=document.getElementById("geo-pool");if(element){element.ondragover=function(event){event.preventDefault();};element.ondrop=function(event){event.preventDefault();var id=geoState.dragging||(event.dataTransfer&&event.dataTransfer.getData("text/plain"));Object.keys(geoState.placements).forEach(function(key){if(geoState.placements[key]===id)geoState.placements[key]=null;});geoState.selected=null;geoRender();};}}
    function geoRender(){geoApp.innerHTML=geoState.stage==="choose"?geoChoose():geoState.stage==="case"?geoCase():geoState.stage==="sort"?geoSort():geoResult();geoBind();window.scrollTo(0,0);}
    geoRender();
    return;

    var index=0,stage="start",answers=[];
    var app=document.getElementById("app");
    function blankAnswers(){return cases.map(function(){return {reactions:[null,null,null],opinion:"",oral:false};});}
    answers=blankAnswers();
    function esc(value){return String(value).replace(/[&<>\"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];});}
    function topbar(){return '<div class="top"><button class="back" id="back" type="button" aria-label="Назад">←</button><div class="progress"><i style="width:'+(((index+(stage==="opinion"?1:.35))/cases.length)*100)+'%"></i></div><span class="case-count">Кейс '+(index+1)+' из '+cases.length+'</span></div>';}
    function avatar(comment){if(comment.logo)return '<span class="avatar logo"><img src="'+comment.logo+'" alt="Логотип '+esc(comment.nick)+'"></span>';return '<span class="avatar">'+esc(comment.icon)+'</span>';}
    function commentCard(comment,i){var choice=answers[index].reactions[i],count=comment.likes+(choice==="like"?' +1':'');return '<article class="comment '+(choice?"chosen-"+choice:"")+'"><div class="comment-head">'+avatar(comment)+'<div><strong>'+esc(comment.nick)+'</strong> <span class="verified">●</span></div></div><p>'+esc(comment.text)+'</p><div class="reactions"><button class="reaction like '+(choice==="like"?"active-like":"")+'" data-reaction="like" data-comment="'+i+'" type="button" aria-label="Палец вверх" aria-pressed="'+(choice==="like")+'">👍 '+esc(count)+'</button><button class="reaction '+(choice==="dislike"?"active-dislike":"")+'" data-reaction="dislike" data-comment="'+i+'" type="button" aria-label="Палец вниз" aria-pressed="'+(choice==="dislike")+'">👎</button></div></article>';}
    function reactionsComplete(reactions){var likeIndex=reactions.indexOf("like"),dislikeIndex=reactions.indexOf("dislike"),selectedCount=reactions.filter(function(value){return value!==null;}).length;return selectedCount===2&&likeIndex!==-1&&dislikeIndex!==-1&&likeIndex!==dislikeIndex;}
    function caseScreen(){var c=cases[index],reactions=answers[index].reactions,complete=reactionsComplete(reactions);return '<section class="screen"><div class="shell">'+topbar()+'<div class="feed"><article class="post"><img src="'+c.image+'" alt="Иллюстрация к теме '+esc(c.title)+'"><div class="post-frame"><div class="blogger"><span class="blogger-avatar">'+esc(c.avatar)+'</span><strong>'+esc(c.nick)+'</strong></div><p>'+esc(c.text)+'</p></div></article><aside class="comments"><h2>Комментарии</h2><div class="comment-list">'+c.comments.map(commentCard).join("")+'</div><div class="opinion-trigger '+(complete?"":"hidden")+'"><button class="primary" id="opinion-button" type="button">Высказать свое мнение</button></div></aside></div></div></section>';}
    function opinionScreen(){var a=answers[index],answered=a.oral||a.opinion.trim().length>0;return '<section class="screen"><div class="shell">'+topbar()+'<article class="opinion-card"><span class="eyebrow">ТВОЯ ПОЗИЦИЯ</span><h2>А что думаешь ты?</h2><p>Ответь устно или напиши свое мнение.</p><div class="answer-mode"><button class="ghost oral-button '+(a.oral?"active":"")+'" id="oral-answer" type="button" aria-pressed="'+a.oral+'">Ответить устно</button></div><textarea id="opinion-text" maxlength="500" placeholder="Я думаю, что...">'+esc(a.opinion)+'</textarea><div class="counter"><span id="count">'+a.opinion.length+'</span> / 500</div><button class="primary next-case-button" id="next-case" type="button" '+(answered?"":"disabled")+'>'+(index===cases.length-1?"Завершить игру":"Следующий кейс")+'</button></article></div></section>';}
    function finishScreen(){return '<section class="screen center"><div class="card"><div class="mark">✓</div><h1>Готово</h1><p>Ты прочитал разные позиции, оценил комментарии и сформулировал свое мнение по трем темам.</p><div class="actions"><button class="primary" id="review-button" type="button">Посмотреть ответы</button><button class="ghost" id="restart-button" type="button">Пройти заново</button></div></div></section>';}
    function reviewCard(c,i){var a=answers[i];return '<article class="review-card"><img src="'+c.image+'" alt="'+esc(c.title)+'"><div class="review-copy"><small>Кейс '+(i+1)+'</small><h2>'+esc(c.title)+'</h2>'+c.comments.map(function(x,j){var reaction=a.reactions[j];return '<p class="review-comment"><strong>'+(reaction==="like"?"👍":reaction==="dislike"?"👎":"Без реакции")+' '+esc(x.nick)+':</strong> '+esc(x.text)+'</p>';}).join("")+'<p class="answer"><strong>Мое мнение:</strong> '+(a.opinion.trim()?esc(a.opinion):"Ответ дан устно")+'</p></div></article>';}
    function reviewScreen(){return '<section class="screen"><div class="shell review"><h1>Твои ответы</h1><div class="review-list">'+cases.map(reviewCard).join("")+'</div><div class="review-actions"><button class="ghost" id="finish-back" type="button">Назад</button><button class="primary" id="restart-button" type="button">Пройти заново</button></div></div></section>';}
    function bind(){var el=document.getElementById("start-button");if(el)el.onclick=function(){stage="case";render();};el=document.getElementById("back");if(el)el.onclick=function(){if(stage==="opinion")stage="case";else if(index===0)stage="start";else{index--;stage="opinion";}render();};Array.prototype.forEach.call(document.querySelectorAll("[data-reaction]"),function(btn){btn.onclick=function(){var i=Number(btn.getAttribute("data-comment")),reaction=btn.getAttribute("data-reaction"),current=answers[index].reactions[i];if(current===reaction){answers[index].reactions[i]=null;}else{answers[index].reactions=answers[index].reactions.map(function(value,j){return value===reaction||j===i?null:value;});answers[index].reactions[i]=reaction;}render();};});el=document.getElementById("opinion-button");if(el)el.onclick=function(){stage="opinion";render();};el=document.getElementById("oral-answer");if(el)el.onclick=function(){answers[index].oral=!answers[index].oral;render();};el=document.getElementById("opinion-text");if(el)el.oninput=function(){answers[index].opinion=this.value;document.getElementById("count").textContent=this.value.length;document.getElementById("next-case").disabled=!answers[index].oral&&!this.value.trim();};el=document.getElementById("next-case");if(el)el.onclick=function(){if(this.disabled)return;if(index===cases.length-1)stage="finish";else{index++;stage="case";}render();};el=document.getElementById("review-button");if(el)el.onclick=function(){stage="review";render();};el=document.getElementById("finish-back");if(el)el.onclick=function(){stage="finish";render();};Array.prototype.forEach.call(document.querySelectorAll("#restart-button"),function(btn){btn.onclick=function(){index=0;stage="start";answers=blankAnswers();render();};});}
    function render(){if(stage==="start")app.innerHTML='<section class="screen center"><div class="card"><div class="mark">👍 👎</div><h1>Выскажи свое мнение и беги</h1><p>В ленте снова спорят. Прочитай три поста, оцени комментарии и сформулируй свою позицию.</p><button class="primary" id="start-button" type="button">Открыть ленту</button></div></section>';else if(stage==="case")app.innerHTML=caseScreen();else if(stage==="opinion")app.innerHTML=opinionScreen();else if(stage==="finish")app.innerHTML=finishScreen();else app.innerHTML=reviewScreen();bind();window.scrollTo(0,0);}
    render();
  })();
  </script>
</body>
</html>
