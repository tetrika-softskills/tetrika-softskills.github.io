<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOUNTAIN RUSH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial Black', system-ui, sans-serif;
            background: #b0d4f1;
            touch-action: none;
        }

        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 16px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 10px 22px;
            box-shadow: 0 4px 24px rgba(0, 40, 80, 0.12), inset 0 1px 0 rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
            min-width: 100px;
        }

        .hud-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #3a6a8a;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(40, 90, 130, 0.4);
            line-height: 1.1;
        }

        #coinsPanel .hud-value {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .coin-icon {
            display: inline-block;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff7a0, #ffd700 50%, #e6a800);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6), inset 0 -2px 4px rgba(180, 120, 0, 0.4);
            border: 1px solid rgba(255, 255, 200, 0.8);
        }

        #speedPanel .hud-value {
            font-size: 22px;
        }

        #speedPanel .hud-value small {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #loadingOverlay {
            background: linear-gradient(160deg, #b0d4f1 0%, #e8f4ff 50%, #b0d4f1 100%);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.4);
            border-top-color: #66ccff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 30px rgba(102, 204, 255, 0.5);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loadingOverlay p {
            color: #3a6a8a;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }

        .game-overlay {
            background: linear-gradient(160deg, rgba(255, 210, 100, 0.82) 0%, rgba(255, 150, 50, 0.78) 50%, rgba(255, 190, 80, 0.82) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
        }

        .game-title {
            font-size: clamp(38px, 9vw, 72px);
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 6px 0 rgba(180, 100, 20, 0.5), 0 10px 30px rgba(120, 60, 0, 0.4);
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.05;
        }

        .game-subtitle {
            font-size: clamp(14px, 3vw, 20px);
            font-weight: 700;
            color: #fff8e0;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 36px;
            text-shadow: 0 2px 8px rgba(150, 80, 0, 0.4);
            text-align: center;
        }

        .final-score-box {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 22px;
            padding: 18px 48px;
            margin-bottom: 34px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 8px 32px rgba(140, 80, 0, 0.2);
            text-align: center;
        }

        .final-score-label {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #7a4a10;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .final-score-value {
            font-size: clamp(36px, 7vw, 56px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 0 rgba(180, 100, 20, 0.45), 0 6px 20px rgba(120, 60, 0, 0.3);
            line-height: 1.1;
        }

        .blink-text {
            font-size: clamp(15px, 3.5vw, 22px);
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(150, 80, 0, 0.5);
            animation: blink 1.1s ease-in-out infinite;
            text-align: center;
            padding: 10px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        #startOverlay .game-title {
            font-size: clamp(42px, 10vw, 80px);
        }

        @media (max-width: 600px) {
            .hud-panel {
                padding: 8px 14px;
                border-radius: 14px;
                min-width: 72px;
            }
            .hud-value { font-size: 20px; }
            #speedPanel .hud-value { font-size: 17px; }
            .hud-label { font-size: 9px; letter-spacing: 1.5px; }
            .coin-icon { width: 16px; height: 16px; }
            #hud { padding: 0 10px; top: 10px; }
            .final-score-box { padding: 14px 28px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-panel" id="scorePanel">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="scoreValue">0</div>
        </div>
        <div class="hud-panel" id="coinsPanel">
            <div class="hud-label">Coins</div>
            <div class="hud-value"><span class="coin-icon"></span><span id="coinValue">0</span></div>
        </div>
        <div class="hud-panel" id="speedPanel">
            <div class="hud-label">Speed</div>
            <div class="hud-value"><span id="speedValue">0</span><small> km/h</small></div>
        </div>
    </div>

    <!-- Loading -->
    <div class="overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading Mountain Rush…</p>
    </div>

    <!-- Start -->
    <div class="overlay hidden" id="startOverlay">
        <div class="game-title">MOUNTAIN RUSH</div>
        <div class="game-subtitle">Snowy Slopes • Endless Run</div>
        <div class="blink-text">Нажми ПРОБЕЛ или тапни для старта</div>
    </div>

    <!-- Game Over -->
    <div class="overlay hidden" id="gameOverOverlay">
        <div class="game-title">GAME OVER</div>
        <div class="final-score-box">
            <div class="final-score-label">Итоговый счёт</div>
            <div class="final-score-value" id="finalScoreValue">0</div>
        </div>
        <div class="blink-text">Нажми ПРОБЕЛ или тапни для рестарта</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ============================================================
        // CONSTANTS
        // ============================================================
        const LANE_WIDTH = 3.2;
        const LANE_COUNT = 3;
        const ROAD_WIDTH = LANE_WIDTH * LANE_COUNT;
        const SEGMENT_LENGTH = 40;
        const SEGMENT_COUNT = 8;
        const TOTAL_DISTANCE = SEGMENT_LENGTH * SEGMENT_COUNT;
        const FOG_COLOR = 0xe8f4ff;
        const FOG_NEAR = 30;
        const FOG_FAR = 180;
        const BASE_SPEED = 22;
        const MAX_SPEED = 55;
        const SPEED_ACCEL = 0.35;
        const GRAVITY = -55;
        const JUMP_VELOCITY = 18;
        const PLAYER_TARGET_HEIGHT = 2.0;
        const START_POSITION_Z = 8;

        // ============================================================
        // SCENE / RENDERER / CAMERA
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb0d4f1);
        scene.fog = new THREE.Fog(FOG_COLOR, FOG_NEAR, FOG_FAR);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(0, 6, 14);
        camera.lookAt(0, 2, -10);

        // ============================================================
        // LIGHTS
        // ============================================================
        const hemiLight = new THREE.HemisphereLight(0xb0d4f1, 0xffffff, 1.6);
        scene.add(hemiLight);

        const ambientLight = new THREE.AmbientLight(0xcceeff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.4);
        dirLight.position.set(-20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 120;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);
        scene.add(dirLight.target);

        // ============================================================
        // PROCEDURAL TEXTURES
        // ============================================================
        function createSnowTexture() {
            const size = 512;
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            // Base snow
            ctx.fillStyle = '#f0f8ff';
            ctx.fillRect(0, 0, size, size);
            // Subtle noise
            for (let i = 0; i < 4000; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = Math.random() * 2 + 0.5;
                const bright = Math.random() * 30;
                const shade = 235 + Math.floor(bright);
                ctx.fillStyle = `rgba(${shade - 10}, ${shade}, 255, ${Math.random() * 0.25})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            // Subtle ski track lines
            ctx.strokeStyle = 'rgba(180, 210, 240, 0.12)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                const x = 60 + i * 70 + Math.random() * 20;
                ctx.moveTo(x, 0);
                ctx.bezierCurveTo(x + 10, size * 0.3, x - 10, size * 0.7, x + 5, size);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 6);
            tex.anisotropy = 4;
            return tex;
        }

        function createWoodTexture() {
            const size = 64;
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 20; i++) {
                ctx.strokeStyle = `rgba(60, 30, 10, ${Math.random() * 0.3})`;
                ctx.lineWidth = Math.random() * 2 + 0.5;
                ctx.beginPath();
                ctx.moveTo(0, Math.random() * size);
                ctx.bezierCurveTo(size * 0.3, Math.random() * size, size * 0.7, Math.random() * size, size, Math.random() * size);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const snowTexture = createSnowTexture();
        const woodTexture = createWoodTexture();

        // ============================================================
        // MATERIALS (shared for performance)
        // ============================================================
        const roadMat = new THREE.MeshStandardMaterial({
            map: snowTexture,
            color: 0xffffff,
            roughness: 0.85,
            metalness: 0.0
        });

        const edgeSnowMat = new THREE.MeshStandardMaterial({
            color: 0xf0f8ff,
            roughness: 0.9,
            metalness: 0.0
        });

        const woodMat = new THREE.MeshStandardMaterial({
            map: woodTexture,
            color: 0xffffff,
            roughness: 0.8,
            metalness: 0.0
        });

        const redFlagMat = new THREE.MeshStandardMaterial({
            color: 0xe03030,
            roughness: 0.6,
            metalness: 0.0,
            side: THREE.DoubleSide
        });

        const treeGreenMat = new THREE.MeshStandardMaterial({
            color: 0x2d5016,
            roughness: 0.85,
            metalness: 0.0
        });

        const treeDarkGreenMat = new THREE.MeshStandardMaterial({
            color: 0x1e3a0e,
            roughness: 0.9,
            metalness: 0.0
        });

        const snowCapMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.7,
            metalness: 0.0
        });

        const rockMat = new THREE.MeshStandardMaterial({
            color: 0x8a8a8a,
            roughness: 0.95,
            metalness: 0.0,
            flatShading: true
        });

        const iceMat = new THREE.MeshStandardMaterial({
            color: 0x88ddff,
            roughness: 0.15,
            metalness: 0.1,
            transparent: true,
            opacity: 0.65,
            emissive: 0x66ccff,
            emissiveIntensity: 0.4
        });

        const coinMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.25,
            metalness: 0.9,
            emissive: 0xffaa00,
            emissiveIntensity: 0.35
        });

        // ============================================================
        // PLAYER STATE
        // ============================================================
        const state = {
            player: null,
            mixer: null,
            runAction: null,
            playerBaseY: 0,
            playerReady: false,
            currentLane: 1, // 0,1,2
            targetX: 0,
            velocityY: 0,
            isJumping: false,
            speed: BASE_SPEED,
            score: 0,
            coins: 0,
            distance: 0,
            gameActive: false,
            gameOver: false,
            gameStarted: false,
            obstacles: [],
            coinObjects: [],
            roadSegments: [],
            decorations: [],
            particleBursts: [],
            clock: new THREE.Clock(),
            laneLean: 0,
            lastObstacleZ: -40,
            lastCoinZ: -30
        };

        // ============================================================
        // ROAD / ENVIRONMENT CREATION
        // ============================================================
        const roadGroup = new THREE.Group();
        scene.add(roadGroup);

        function createRoadSegment() {
            const group = new THREE.Group();

            // Main road surface
            const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH, 1, 1);
            roadGeo.rotateX(-Math.PI / 2);
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.position.y = 0;
            road.receiveShadow = true;
            group.add(road);

            // Lane divider tracks (subtle)
            for (let i = 0; i < 2; i++) {
                const laneX = -LANE_WIDTH + (i + 1) * LANE_WIDTH;
                const trackGeo = new THREE.PlaneGeometry(0.08, SEGMENT_LENGTH);
                trackGeo.rotateX(-Math.PI / 2);
                const track = new THREE.Mesh(trackGeo, new THREE.MeshStandardMaterial({
                    color: 0xc8dce8,
                    roughness: 0.9
                }));
                track.position.set(laneX, 0.01, 0);
                group.add(track);
            }

            // Edge snow banks
            for (const side of [-1, 1]) {
                const bankGeo = new THREE.BoxGeometry(1.6, 0.45, SEGMENT_LENGTH);
                const bank = new THREE.Mesh(bankGeo, edgeSnowMat);
                bank.position.set(side * (ROAD_WIDTH / 2 + 0.8), 0.1, 0);
                bank.receiveShadow = true;
                bank.castShadow = true;
                group.add(bank);

                // Wooden fence posts along the edge
                const postCount = 5;
                for (let p = 0; p < postCount; p++) {
                    const pz = -SEGMENT_LENGTH / 2 + (p + 0.5) * (SEGMENT_LENGTH / postCount);
                    const postGeo = new THREE.CylinderGeometry(0.1, 0.12, 1.6, 6);
                    const post = new THREE.Mesh(postGeo, woodMat);
                    post.position.set(side * (ROAD_WIDTH / 2 + 1.4), 0.8, pz);
                    post.castShadow = true;
                    post.receiveShadow = true;
                    group.add(post);

                    // Red flag on top
                    const flagGeo = new THREE.PlaneGeometry(0.7, 0.35);
                    const flag = new THREE.Mesh(flagGeo, redFlagMat);
                    flag.position.set(side * (ROAD_WIDTH / 2 + 1.4 + 0.4), 1.45, pz);
                    flag.castShadow = true;
                    flag.userData.isFlag = true;
                    flag.userData.flagPhase = Math.random() * Math.PI * 2;
                    flag.userData.flagBaseX = side * (ROAD_WIDTH / 2 + 1.4 + 0.4);
                    group.add(flag);
                    // Store flags for animation
                    if (!state.flags) state.flags = [];
                    state.flags.push(flag);
                }
            }

            return group;
        }

        // Pre-create road segments
        for (let i = 0; i < SEGMENT_COUNT; i++) {
            const seg = createRoadSegment();
            seg.position.z = -i * SEGMENT_LENGTH + START_POSITION_Z;
            roadGroup.add(seg);
            state.roadSegments.push(seg);
        }

        // ============================================================
        // TREES (procedural, grouped)
        // ============================================================
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);

        function createTree() {
            const group = new THREE.Group();
            const height = 2.5 + Math.random() * 5;
            const radius = height * (0.22 + Math.random() * 0.12);
            const layers = 3 + Math.floor(Math.random() * 3);

            for (let l = 0; l < layers; l++) {
                const t = l / layers;
                const layerRadius = radius * (1 - t * 0.55);
                const layerHeight = height * 0.45;
                const coneGeo = new THREE.ConeGeometry(layerRadius, layerHeight, 7);
                const mat = Math.random() > 0.5 ? treeGreenMat : treeDarkGreenMat;
                const cone = new THREE.Mesh(coneGeo, mat);
                cone.position.y = height * 0.15 + t * height * 0.75;
                cone.castShadow = true;
                cone.receiveShadow = true;
                group.add(cone);

                // Snow cap on top of each layer
                const capGeo = new THREE.ConeGeometry(layerRadius * 0.85, layerHeight * 0.35, 7);
                const cap = new THREE.Mesh(capGeo, snowCapMat);
                cap.position.y = cone.position.y + layerHeight * 0.38;
                cap.castShadow = true;
                group.add(cap);
            }

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(radius * 0.15, radius * 0.22, height * 0.25, 5);
            const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({
                color: 0x5a3a1a,
                roughness: 0.95
            }));
            trunk.position.y = height * 0.12;
            trunk.castShadow = true;
            group.add(trunk);

            return group;
        }

        // Place tree clusters along the sides
        const TREE_SPACING = 6;
        const TREE_Z_RANGE = SEGMENT_COUNT * SEGMENT_LENGTH;
        for (let z = 10; z > -TREE_Z_RANGE - 20; z -= TREE_SPACING) {
            for (const side of [-1, 1]) {
                const clusterCount = 1 + Math.floor(Math.random() * 3);
                for (let c = 0; c < clusterCount; c++) {
                    const tree = createTree();
                    const offsetX = side * (ROAD_WIDTH / 2 + 3 + Math.random() * 12);
                    const offsetZ = z + (Math.random() - 0.5) * TREE_SPACING * 0.8;
                    tree.position.set(offsetX, 0, offsetZ);
                    tree.rotation.y = Math.random() * Math.PI * 2;
                    tree.rotation.z = (Math.random() - 0.5) * 0.12;
                    tree.userData.side = side;
                    treeGroup.add(tree);
                    state.decorations.push(tree);
                }
            }
        }

        // ============================================================
        // OBSTACLES POOL
        // ============================================================
        function createRock() {
            const group = new THREE.Group();
            const geo = new THREE.DodecahedronGeometry(0.7 + Math.random() * 0.5, 0);
            const rock = new THREE.Mesh(geo, rockMat);
            rock.castShadow = true;
            rock.receiveShadow = true;
            rock.scale.set(1, 0.8 + Math.random() * 0.4, 1);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            group.add(rock);

            // Snow cap
            const capGeo = new THREE.ConeGeometry(0.75, 0.35, 6);
            const cap = new THREE.Mesh(capGeo, snowCapMat);
            cap.position.y = 0.75;
            cap.rotation.y = Math.random() * Math.PI;
            cap.castShadow = true;
            group.add(cap);

            return group;
        }

        function createIceBlock() {
            const group = new THREE.Group();
            const w = 0.9 + Math.random() * 0.4;
            const h = 1.2 + Math.random() * 0.8;
            const d = 0.9 + Math.random() * 0.4;
            const geo = new THREE.BoxGeometry(w, h, d);
            const ice = new THREE.Mesh(geo, iceMat);
            ice.castShadow = true;
            ice.receiveShadow = true;
            ice.position.y = h / 2;
            group.add(ice);

            // Snow cap
            const capGeo = new THREE.BoxGeometry(w * 0.95, 0.15, d * 0.95);
            const cap = new THREE.Mesh(capGeo, snowCapMat);
            cap.position.y = h + 0.08;
            cap.castShadow = true;
            group.add(cap);

            return group;
        }

        function createSmallTree() {
            const group = new THREE.Group();
            const height = 1.2 + Math.random() * 0.8;
            const coneGeo = new THREE.ConeGeometry(0.5, height, 6);
            const cone = new THREE.Mesh(coneGeo, treeGreenMat);
            cone.position.y = height / 2;
            cone.castShadow = true;
            cone.receiveShadow = true;
            group.add(cone);

            const capGeo = new THREE.ConeGeometry(0.4, height * 0.35, 6);
            const cap = new THREE.Mesh(capGeo, snowCapMat);
            cap.position.y = height * 0.85;
            cap.castShadow = true;
            group.add(cap);

            return group;
        }

        function createObstacle() {
            const r = Math.random();
            if (r < 0.4) return createRock();
            if (r < 0.7) return createIceBlock();
            return createSmallTree();
        }

        function createCoin() {
            const group = new THREE.Group();
            const geo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            geo.rotateX(Math.PI / 2);
            const coin = new THREE.Mesh(geo, coinMat);
            coin.castShadow = true;
            group.add(coin);
            group.userData.isCoin = true;
            return group;
        }

        // ============================================================
        // PLAYER LOADING
        // ============================================================
        const playerContainer = new THREE.Group();
        scene.add(playerContainer);

        function createFallbackPlayer() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2266cc, roughness: 0.6 });
            const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.0, 8, 16);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.7 }));
            head.position.y = 1.75;
            head.castShadow = true;
            group.add(head);

            // Hat
            const hatGeo = new THREE.ConeGeometry(0.4, 0.5, 12);
            const hat = new THREE.Mesh(hatGeo, new THREE.MeshStandardMaterial({ color: 0xff3300, roughness: 0.6 }));
            hat.position.y = 2.15;
            hat.castShadow = true;
            group.add(hat);

            state.playerBaseY = 0;
            return group;
        }

        const loader = new GLTFLoader();
        loader.load(
            'player_game.glb',
            (gltf) => {
                const model = gltf.scene;

                // Compute bounding box
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);
                const targetHeight = PLAYER_TARGET_HEIGHT;
                const scale = targetHeight / Math.max(size.y, 0.01);
                model.scale.setScalar(scale);

                // Recompute after scale
                const scaledBox = new THREE.Box3().setFromObject(model);
                const center = new THREE.Vector3();
                scaledBox.getCenter(center);

                // Position so bottom is at y=0 and centered on X/Z
                model.position.x = -center.x;
                model.position.z = -center.z;
                model.position.y = -scaledBox.min.y;

                // Face forward (-Z)
                model.rotation.y = Math.PI;

                // Shadows
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                playerContainer.add(model);
                state.player = model;
                state.playerBaseY = model.position.y;

                // Animation
                if (gltf.animations && gltf.animations.length > 0) {
                    state.mixer = new THREE.AnimationMixer(model);
                    let clip = gltf.animations.find(a => /run/i.test(a.name));
                    if (!clip) clip = gltf.animations.find(a => /walk/i.test(a.name));
                    if (!clip) clip = gltf.animations[0];
                    state.runAction = state.mixer.clipAction(clip);
                    state.runAction.play();
                }

                state.playerReady = true;
                onPlayerLoaded();
            },
            undefined,
            (err) => {
                console.warn('Failed to load player_game.glb, using fallback', err);
                const fallback = createFallbackPlayer();
                playerContainer.add(fallback);
                state.player = fallback;
                state.playerBaseY = 0;
                state.playerReady = true;
                onPlayerLoaded();
            }
        );

        function onPlayerLoaded() {
            // Hide loading, show start
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('startOverlay').classList.remove('hidden');
        }

        // ============================================================
        // PARTICLES
        // ============================================================
        function spawnParticles(position, count = 35) {
            const group = new THREE.Group();
            const particles = [];
            const colors = [0xffffff, 0xddeeff, 0x88ddff, 0xffffff, 0xbbeeff];
            for (let i = 0; i < count; i++) {
                const size = 0.08 + Math.random() * 0.22;
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: 0xaaddff,
                    emissiveIntensity: 0.3,
                    roughness: 0.4,
                    transparent: true,
                    opacity: 1
                });
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(position);
                p.position.x += (Math.random() - 0.5) * 1.2;
                p.position.y += Math.random() * 1.5;
                p.position.z += (Math.random() - 0.5) * 0.8;
                p.castShadow = true;
                p.userData.vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 12,
                    Math.random() * 10 + 4,
                    (Math.random() - 0.5) * 8 - 3
                );
                p.userData.life = 0.9 + Math.random() * 0.6;
                p.userData.maxLife = p.userData.life;
                group.add(p);
                particles.push(p);
            }
            scene.add(group);
            state.particleBursts.push({ group, particles });
        }

        function updateParticles(dt) {
            for (let i = state.particleBursts.length - 1; i >= 0; i--) {
                const burst = state.particleBursts[i];
                let allDead = true;
                for (const p of burst.particles) {
                    p.userData.life -= dt;
                    if (p.userData.life <= 0) {
                        p.visible = false;
                        continue;
                    }
                    allDead = false;
                    p.userData.vel.y += GRAVITY * 0.6 * dt;
                    p.position.x += p.userData.vel.x * dt;
                    p.position.y += p.userData.vel.y * dt;
                    p.position.z += p.userData.vel.z * dt;
                    p.rotation.x += dt * 8;
                    p.rotation.z += dt * 6;
                    const lifeRatio = p.userData.life / p.userData.maxLife;
                    p.material.opacity = lifeRatio;
                    p.scale.setScalar(0.5 + lifeRatio * 0.5);
                }
                if (allDead) {
                    scene.remove(burst.group);
                    burst.group.traverse(c => { if (c.isMesh) c.geometry.dispose(); });
                    state.particleBursts.splice(i, 1);
                }
            }
        }

        // ============================================================
        // GAME LOGIC
        // ============================================================
        function laneToX(lane) {
            return (lane - 1) * LANE_WIDTH;
        }

        function resetGame() {
            // Clear obstacles & coins
            for (const o of state.obstacles) scene.remove(o);
            for (const c of state.coinObjects) scene.remove(c);
            state.obstacles = [];
            state.coinObjects = [];

            // Reset player
            state.currentLane = 1;
            state.targetX = 0;
            state.velocityY = 0;
            state.isJumping = false;
            state.speed = BASE_SPEED;
            state.score = 0;
            state.coins = 0;
            state.distance = 0;
            state.gameActive = false;
            state.gameOver = false;
            state.lastObstacleZ = -40;
            state.lastCoinZ = -30;
            state.laneLean = 0;

            if (state.player) {
                playerContainer.position.set(0, state.playerBaseY, 0);
                playerContainer.rotation.set(0, 0, 0);
            }

            // Reset road segments
            roadGroup.position.z = 0;
            for (let i = 0; i < state.roadSegments.length; i++) {
                state.roadSegments[i].position.z = -i * SEGMENT_LENGTH + START_POSITION_Z;
            }

            // Reset decorations z
            for (const d of state.decorations) {
                if (d.userData.originalZ === undefined) d.userData.originalZ = d.position.z;
                d.position.z = d.userData.originalZ;
            }

            // Camera
            camera.position.set(0, 6, 14);
            camera.lookAt(0, 2, -10);

            // Particles
            for (const b of state.particleBursts) {
                scene.remove(b.group);
            }
            state.particleBursts = [];

            updateHUD();
        }

        function startGame() {
            resetGame();
            state.gameActive = true;
            state.gameStarted = true;
            state.gameOver = false;
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
        }

        function triggerGameOver() {
            if (state.gameOver) return;
            state.gameOver = true;
            state.gameActive = false;

            // Explosion particles at player
            spawnParticles(playerContainer.position.clone().add(new THREE.Vector3(0, 1, 0)), 50);

            document.getElementById('finalScoreValue').textContent = Math.floor(state.score);
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function updateHUD() {
            document.getElementById('scoreValue').textContent = Math.floor(state.score);
            document.getElementById('coinValue').textContent = state.coins;
            document.getElementById('speedValue').textContent = Math.floor(state.speed * 2.2);
        }

        // ============================================================
        // SPAWNING
        // ============================================================
        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const obstacle = createObstacle();
            obstacle.position.set(laneToX(lane), 0, state.lastObstacleZ);
            obstacle.userData.lane = lane;
            obstacle.userData.type = 'obstacle';
            scene.add(obstacle);
            state.obstacles.push(obstacle);
            state.lastObstacleZ -= 6 + Math.random() * 8;
        }

        function spawnCoinLine() {
            const lane = Math.floor(Math.random() * 3);
            const count = 2 + Math.floor(Math.random() * 4);
            for (let i = 0; i < count; i++) {
                const coin = createCoin();
                coin.position.set(laneToX(lane), 0.8, state.lastCoinZ - i * 1.8);
                coin.userData.lane = lane;
                scene.add(coin);
                state.coinObjects.push(coin);
            }
            state.lastCoinZ -= count * 1.8 + 8 + Math.random() * 10;
        }

        // ============================================================
        // INPUT
        // ============================================================
        const keys = {};

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                if (!state.gameStarted || state.gameOver) {
                    startGame();
                } else if (state.gameActive && !state.isJumping) {
                    jump();
                }
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                if (state.gameActive) moveLane(-1);
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                e.preventDefault();
                if (state.gameActive) moveLane(1);
            }
        });

        // Touch / swipe
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (!state.gameStarted || state.gameOver) {
                startGame();
                return;
            }
            if (!state.gameActive) return;
            if (!e.changedTouches || e.changedTouches.length === 0) {
                // Simple tap = jump
                if (!state.isJumping) jump();
                return;
            }
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const dt = Date.now() - touchStartTime;

            if (dt < 400) {
                if (Math.abs(dx) < 25 && Math.abs(dy) < 25) {
                    // Tap = jump
                    if (!state.isJumping) jump();
                } else if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 35) {
                    if (dx > 0) moveLane(1);
                    else moveLane(-1);
                } else if (dy < -35) {
                    if (!state.isJumping) jump();
                }
            }
        }, { passive: false });

        // Click to start / restart
        document.getElementById('startOverlay').addEventListener('click', startGame);
        document.getElementById('gameOverOverlay').addEventListener('click', startGame);
        window.addEventListener('click', (e) => {
            if (!state.gameStarted || state.gameOver) {
                startGame();
            }
        });

        function moveLane(dir) {
            const newLane = Math.max(0, Math.min(2, state.currentLane + dir));
            if (newLane !== state.currentLane) {
                state.currentLane = newLane;
                state.targetX = laneToX(state.currentLane);
                state.laneLean = dir * 0.25;
            }
        }

        function jump() {
            if (state.isJumping) return;
            state.isJumping = true;
            state.velocityY = JUMP_VELOCITY;
        }

        // ============================================================
        // MAIN UPDATE
        // ============================================================
        function updateGame(dt) {
            if (!state.playerReady) return;

            // Animate flags
            if (state.flags) {
                const t = state.clock.elapsedTime;
                for (const flag of state.flags) {
                    flag.rotation.y = Math.sin(t * 2.5 + flag.userData.flagPhase) * 0.25;
                }
            }

            if (!state.gameActive) {
                // Idle camera orbit
                if (state.mixer) state.mixer.update(dt);
                // Rotate coins
                for (const c of state.coinObjects) {
                    c.children[0].rotation.z += dt * 2;
                }
                return;
            }

            // --- Speed increase ---
            state.speed = Math.min(MAX_SPEED, state.speed + SPEED_ACCEL * dt);
            const moveSpeed = state.speed * dt;
            state.distance += moveSpeed;
            state.score += moveSpeed * 0.6;

            // --- Player lane movement ---
            const targetX = laneToX(state.currentLane);
            const xDiff = targetX - playerContainer.position.x;
            const lerpFactor = 1 - Math.pow(0.001, dt);
            playerContainer.position.x += xDiff * lerpFactor;

            // Lean
            state.laneLean *= Math.pow(0.001, dt);
            playerContainer.rotation.z = -state.laneLean * (xDiff > 0.5 ? 1 : xDiff < -0.5 ? 1 : 0);
            // Smooth better:
            const leanTarget = THREE.MathUtils.clamp(-xDiff * 0.6, -0.3, 0.3);
            playerContainer.rotation.z += (leanTarget - playerContainer.rotation.z) * 8 * dt;

            // --- Jump physics ---
            if (state.isJumping) {
                state.velocityY += GRAVITY * dt;
                playerContainer.position.y += state.velocityY * dt;
                if (playerContainer.position.y <= state.playerBaseY) {
                    playerContainer.position.y = state.playerBaseY;
                    state.velocityY = 0;
                    state.isJumping = false;
                }
            } else {
                playerContainer.position.y = state.playerBaseY;
            }

            // --- Animation ---
            if (state.mixer) {
                state.mixer.update(dt * (state.speed / BASE_SPEED) * 0.8);
            }

            // --- Move world (road segments) ---
            roadGroup.position.z += moveSpeed;

            // Recycle road segments
            for (const seg of state.roadSegments) {
                const worldZ = seg.position.z + roadGroup.position.z;
                if (worldZ > SEGMENT_LENGTH) {
                    seg.position.z -= SEGMENT_COUNT * SEGMENT_LENGTH;
                }
            }

            // Recycle decorations
            for (const d of state.decorations) {
                if (d.position.z + roadGroup.position.z > 20) {
                    d.position.z -= TREE_Z_RANGE;
                    // Randomize slightly
                    d.position.x = d.userData.side * (ROAD_WIDTH / 2 + 3 + Math.random() * 12);
                    d.rotation.y = Math.random() * Math.PI * 2;
                }
            }

            // --- Spawn obstacles and coins ---
            // Convert world Z tracking: spawn ahead
            const playerWorldZ = -state.distance + START_POSITION_Z;

            // We track lastObstacleZ in world coords; spawn if far enough ahead of player
            while (state.lastObstacleZ > playerWorldZ - 220) {
                spawnObstacle();
            }
            while (state.lastCoinZ > playerWorldZ - 200) {
                spawnCoinLine();
            }

            // --- Move obstacles & coins (they stay at fixed world coords, but we move them toward player) ---
            // Since we move roadGroup forward, obstacles should be positioned in world (not child of roadGroup)
            // We'll move them by moveSpeed toward +Z so they approach the player
            for (let i = state.obstacles.length - 1; i >= 0; i--) {
                const obs = state.obstacles[i];
                obs.position.z += moveSpeed;

                // Rotate ice/coins slightly? Rock already static
                // Remove if behind player
                if (obs.position.z > playerContainer.position.z + 15) {
                    scene.remove(obs);
                    state.obstacles.splice(i, 1);
                    continue;
                }

                // Collision check
                if (!state.gameOver) {
                    const dx = Math.abs(obs.position.x - playerContainer.position.x);
                    const dz = Math.abs(obs.position.z - playerContainer.position.z);
                    const playerY = playerContainer.position.y - state.playerBaseY;

                    if (dx < 1.0 && dz < 1.2) {
                        // Check vertical overlap - jump over if high enough
                        const obsHeight = 1.4;
                        const playerBottom = playerY;
                        const playerTop = playerY + 1.8;

                        // Player must be above obstacle to avoid
                        if (playerBottom < obsHeight * 0.7) {
                            triggerGameOver();
                        }
                    }
                }
            }

            // Coins
            for (let i = state.coinObjects.length - 1; i >= 0; i--) {
                const coin = state.coinObjects[i];
                coin.position.z += moveSpeed;
                coin.children[0].rotation.z += dt * 3;

                if (coin.position.z > playerContainer.position.z + 15) {
                    scene.remove(coin);
                    state.coinObjects.splice(i, 1);
                    continue;
                }

                // Collect
                if (!state.gameOver) {
                    const dx = Math.abs(coin.position.x - playerContainer.position.x);
                    const dz = Math.abs(coin.position.z - playerContainer.position.z);
                    const dy = Math.abs(coin.position.y - (playerContainer.position.y + 0.9));
                    if (dx < 1.0 && dz < 1.2 && dy < 1.5) {
                        state.coins++;
                        state.score += 10;
                        spawnParticles(coin.position.clone(), 8);
                        scene.remove(coin);
                        state.coinObjects.splice(i, 1);
                    }
                }
            }

            // --- Camera follow ---
            const camTargetX = playerContainer.position.x * 0.6;
            const camTargetY = playerContainer.position.y + 6;
            camera.position.x += (camTargetX - camera.position.x) * 4 * dt;
            camera.position.y += (camTargetY - camera.position.y) * 6 * dt;
            const lookTarget = new THREE.Vector3(
                playerContainer.position.x * 0.4,
                playerContainer.position.y + 2,
                playerContainer.position.z - 10
            );
            camera.lookAt(lookTarget);

            // --- Sun follows player ---
            dirLight.position.set(
                playerContainer.position.x - 20,
                40,
                playerContainer.position.z + 20
            );
            dirLight.target.position.set(
                playerContainer.position.x,
                0,
                playerContainer.position.z - 10
            );
            dirLight.target.updateMatrixWorld();

            // --- Update HUD ---
            updateHUD();

            // Particles
            updateParticles(dt);
        }

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(state.clock.getDelta(), 0.05);
            updateGame(dt);
            renderer.render(scene, camera);
        }

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // ============================================================
        // START
        // ============================================================
        updateHUD();
        animate();

        // If player fails to load in 8 seconds, force fallback to not block
        setTimeout(() => {
            if (!state.playerReady) {
                console.warn('Player load timeout, using fallback');
                if (!state.player) {
                    const fallback = createFallbackPlayer();
                    playerContainer.add(fallback);
                    state.player = fallback;
                    state.playerBaseY = 0;
                    state.playerReady = true;
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    document.getElementById('startOverlay').classList.remove('hidden');
                }
            }
        }, 8000);
    </script>
</body>
</html>
