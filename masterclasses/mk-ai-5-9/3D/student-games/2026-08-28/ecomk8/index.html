<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NULL.EXE — Neon Runner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a2e;font-family:'Courier New',monospace;color:#e0e0ff}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;width:100%;padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;text-shadow:0 0 8px #cc44ff,0 0 2px #fff}
  .hud-box{background:rgba(10,10,46,.55);border:1px solid #cc44ff;box-shadow:0 0 12px rgba(204,68,255,.5),inset 0 0 12px rgba(0,255,204,.15);padding:8px 14px;border-radius:4px;backdrop-filter:blur(4px)}
  .hud-label{font-size:10px;letter-spacing:3px;color:#00ffcc;text-transform:uppercase;opacity:.85}
  .hud-value{font-size:22px;color:#fff;font-weight:bold;letter-spacing:2px}
  #score .hud-value{color:#fff;text-shadow:0 0 10px #cc44ff}
  #chips .hud-value{color:#00ffcc;text-shadow:0 0 10px #00ffcc}
  #speed .hud-value{color:#cc44ff;text-shadow:0 0 10px #cc44ff}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,rgba(20,10,60,.85),rgba(5,5,20,.98));z-index:20;text-align:center;padding:20px}
  .overlay.hidden{display:none}
  .title{font-size:clamp(40px,9vw,90px);font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 20px #cc44ff,0 0 40px #cc44ff,0 0 4px #fff;margin-bottom:10px;animation:glitch 3s infinite}
  .subtitle{font-size:clamp(12px,2vw,16px);letter-spacing:6px;color:#00ffcc;text-shadow:0 0 10px #00ffcc;margin-bottom:40px;opacity:.9}
  .btn{background:transparent;border:2px solid #cc44ff;color:#fff;padding:14px 40px;font-family:inherit;font-size:16px;letter-spacing:4px;cursor:pointer;text-transform:uppercase;transition:all .25s;box-shadow:0 0 15px rgba(204,68,255,.5),inset 0 0 15px rgba(204,68,255,.2);border-radius:2px}
  .btn:hover,.btn:active{background:rgba(204,68,255,.2);box-shadow:0 0 25px #cc44ff,inset 0 0 25px rgba(204,68,255,.4);transform:scale(1.05)}
  .info{margin-top:30px;font-size:12px;letter-spacing:2px;color:#8a8ac0;line-height:1.8}
  .info span{color:#00ffcc}
  .go-title{color:#ff3366;text-shadow:0 0 20px #ff3366,0 0 40px #ff3366}
  .final-stats{display:flex;gap:30px;margin:20px 0 30px;flex-wrap:wrap;justify-content:center}
  .stat{background:rgba(10,10,46,.6);border:1px solid #cc44ff;padding:12px 20px;border-radius:4px;min-width:120px}
  .stat .hud-label{font-size:9px}
  .stat .hud-value{font-size:24px}
  @keyframes glitch{0%,100%{text-shadow:0 0 20px #cc44ff,0 0 40px #cc44ff}50%{text-shadow:2px 0 #00ffcc,-2px 0 #ff3366,0 0 20px #cc44ff}}
  .corner{position:fixed;width:40px;height:40px;border:2px solid #00ffcc;z-index:5;opacity:.6}
  .c1{top:10px;left:10px;border-right:none;border-bottom:none}
  .c2{top:10px;right:10px;border-left:none;border-bottom:none}
  .c3{bottom:10px;left:10px;border-right:none;border-top:none}
  .c4{bottom:10px;right:10px;border-left:none;border-top:none}
  #loading{position:fixed;inset:0;background:#0a0a2e;display:flex;justify-content:center;align-items:center;z-index:100;font-size:14px;letter-spacing:4px;color:#cc44ff;text-shadow:0 0 10px #cc44ff}
  .blink{animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>
<div id="loading">INITIALIZING <span class="blink">_</span></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>

<div id="hud">
  <div class="hud-box" id="score"><div class="hud-label">DISTANCE</div><div class="hud-value" id="scoreVal">0</div></div>
  <div class="hud-box" id="chips"><div class="hud-label">CHIPS</div><div class="hud-value" id="chipsVal">0</div></div>
  <div class="hud-box" id="speed"><div class="hud-label">SPEED</div><div class="hud-value" id="speedVal">1.0x</div></div>
</div>

<div class="overlay" id="startScreen">
  <div class="title">NULL.EXE</div>
  <div class="subtitle">// NEON_RUNNER v1.0 //</div>
  <button class="btn" id="startBtn">EXECUTE</button>
  <div class="info">
    <div><span>A/D</span> or <span>←/→</span> — change lane</div>
    <div><span>SPACE</span> or <span>↑</span> — jump</div>
    <div>SWIPE — mobile controls</div>
  </div>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="title go-title">SYSTEM CRASH</div>
  <div class="subtitle">// CONNECTION TERMINATED //</div>
  <div class="final-stats">
    <div class="stat"><div class="hud-label">DISTANCE</div><div class="hud-value" id="finalScore">0</div></div>
    <div class="stat"><div class="hud-label">CHIPS</div><div class="hud-value" id="finalChips">0</div></div>
    <div class="stat"><div class="hud-label">BEST</div><div class="hud-value" id="bestScore">0</div></div>
  </div>
  <button class="btn" id="restartBtn">REBOOT</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================== CORE ==================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a2e);
scene.fog = new THREE.FogExp2(0x0a0a2e, 0.025);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 4.2, 7);
camera.lookAt(0, 1.5, -5);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ================== LIGHTS ==================
const ambient = new THREE.AmbientLight(0x3344aa, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xcc44ff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);
const hemi = new THREE.HemisphereLight(0x00ffcc, 0x0a0a2e, 0.3);
scene.add(hemi);

// ================== CONSTANTS ==================
const LANES = [-2.2, 0, 2.2];
const ROAD_W = 7;
const SEG_LEN = 20;
const VISIBLE_SEGS = 8;
const GRAVITY = 35;
const JUMP_V = 12;
const BASE_SPEED = 18;
const MAX_SPEED = 55;
const SPEED_GROW = 0.35;

// ================== STATE ==================
const state = {
  running:false,
  lane:1, targetLane:1,
  vy:0, onGround:true,
  speed:BASE_SPEED,
  distance:0, chips:0,
  playerZ:0,
  best: +localStorage.getItem('null_exe_best') || 0
};

// ================== ROAD ==================
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadMat = new THREE.MeshStandardMaterial({color:0x0c0c2a, roughness:0.7, metalness:0.3, emissive:0x110022, emissiveIntensity:0.3});
const lineMat = new THREE.MeshBasicMaterial({color:0xcc44ff});
const lineMatCyan = new THREE.MeshBasicMaterial({color:0x00ffcc});
const wallMat = new THREE.MeshStandardMaterial({color:0x0a0a2e, emissive:0x220044, emissiveIntensity:0.4, roughness:0.6});

function buildSegment(z){
  const g = new THREE.Group();
  // road
  const road = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W, 0.1, SEG_LEN), roadMat);
  road.position.set(0, -0.05, z);
  g.add(road);
  // lane lines (dashed)
  for(let i=0;i<4;i++){
    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 1.5), lineMat);
    dash.position.set(-ROAD_W/3, 0.01, z - SEG_LEN/2 + 2 + i*5);
    g.add(dash);
    const dash2 = dash.clone();
    dash2.position.x = ROAD_W/3;
    g.add(dash2);
  }
  // side neon strips
  const stripL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, SEG_LEN), lineMat);
  stripL.position.set(-ROAD_W/2, 0.03, z);
  g.add(stripL);
  const stripR = stripL.clone();
  stripR.position.x = ROAD_W/2;
  g.add(stripR);
  // walls
  const wallH = 4;
  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.5, wallH, SEG_LEN), wallMat);
  wallL.position.set(-ROAD_W/2 - 0.5, wallH/2, z);
  g.add(wallL);
  const wallR = wallL.clone();
  wallR.position.x = ROAD_W/2 + 0.5;
  g.add(wallR);
  // neon barriers on walls
  for(let i=0;i<3;i++){
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 3), i%2?lineMatCyan:lineMat);
    bar.position.set(-ROAD_W/2 - 0.3, 1 + (i%2)*1.5, z - SEG_LEN/2 + 3 + i*7);
    g.add(bar);
    const bar2 = bar.clone();
    bar2.position.x = ROAD_W/2 + 0.3;
    g.add(bar2);
  }
  g.userData.z = z;
  return g;
}

const segments = [];
for(let i=0;i<VISIBLE_SEGS;i++){
  const s = buildSegment(-i*SEG_LEN);
  roadGroup.add(s);
  segments.push(s);
}

// ================== BACKGROUND STARS / GRID ==================
const grid = new THREE.GridHelper(200, 80, 0x220044, 0x110033);
grid.position.y = -0.2;
scene.add(grid);

// distant buildings silhouettes
const buildGroup = new THREE.Group();
for(let i=0;i<40;i++){
  const h = 5 + Math.random()*20;
  const w = 2 + Math.random()*4;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, w),
    new THREE.MeshStandardMaterial({color:0x08081e, emissive:0x220044, emissiveIntensity:0.2})
  );
  const side = Math.random()<0.5?-1:1;
  m.position.set(side*(15 + Math.random()*30), h/2, -Math.random()*200);
  buildGroup.add(m);
  // neon windows
  if(Math.random()<0.7){
    const win = new THREE.Mesh(new THREE.BoxGeometry(w*0.8, 0.15, 0.05), Math.random()<0.5?lineMat:lineMatCyan);
    win.position.set(m.position.x, h*0.6, m.position.z + (side>0?-w/2-0.01:w/2+0.01));
    buildGroup.add(win);
  }
}
scene.add(buildGroup);

// ================== PLAYER ==================
const player = new THREE.Group();
player.position.set(0, 0, 0);
scene.add(player);

// hoverboard
const board = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 0.12, 2.2),
  new THREE.MeshStandardMaterial({color:0x0a0a2e, emissive:0xcc44ff, emissiveIntensity:0.8, metalness:0.8, roughness:0.3})
);
board.position.y = 0.3;
player.add(board);
// board glow strip
const boardStrip = new THREE.Mesh(
  new THREE.BoxGeometry(1.0, 0.05, 2.0),
  new THREE.MeshBasicMaterial({color:0xcc44ff})
);
boardStrip.position.y = 0.38;
player.add(boardStrip);

// pointlight under board
const boardLight = new THREE.PointLight(0xcc44ff, 2, 6, 2);
boardLight.position.set(0, 0.2, 0);
player.add(boardLight);

// trail particles (simple)
const trailGeo = new THREE.BufferGeometry();
const TRAIL_N = 40;
const trailPos = new Float32Array(TRAIL_N*3);
const trailCol = new Float32Array(TRAIL_N*3);
for(let i=0;i<TRAIL_N;i++){
  trailPos[i*3] = 0; trailPos[i*3+1]=-10; trailPos[i*3+2]=0;
  trailCol[i*3]=0.8; trailCol[i*3+1]=0.27; trailCol[i*3+2]=1;
}
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol,3));
const trailMat = new THREE.PointsMaterial({size:0.15, vertexColors:true, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false});
const trail = new THREE.Points(trailGeo, trailMat);
scene.add(trail);
let trailIdx = 0;

// model fallback
const playerBaseY = 0;
let playerModel = null;
let modelReady = false;

function createFallback(){
  const cap = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.4, 1.0, 4, 8),
    new THREE.MeshStandardMaterial({color:0x1a1a3e, emissive:0x00ffcc, emissiveIntensity:0.4, metalness:0.6, roughness:0.4})
  );
  cap.position.y = 1.0;
  player.add(cap);
  // visor
  const visor = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.15, 0.1),
    new THREE.MeshBasicMaterial({color:0x00ffcc})
  );
  visor.position.set(0, 1.35, 0.35);
  player.add(visor);
}

try{
  const loader = new GLTFLoader();
  loader.load('player_game.glb',
    (gltf)=>{
      playerModel = gltf.scene;
      const box = new THREE.Box3().setFromObject(playerModel);
      const h = box.max.y - box.min.y;
      const scale = 2.0 / h;
      playerModel.scale.setScalar(scale);
      playerModel.traverse(c=>{
        if(c.isMesh){
          c.material = new THREE.MeshStandardMaterial({
            color: c.material.color || 0x2a1a4e,
            emissive: 0xcc44ff,
            emissiveIntensity: 0.3,
            metalness: 0.5,
            roughness: 0.5
          });
        }
      });
      const newBox = new THREE.Box3().setFromObject(playerModel);
      playerModel.position.y = -newBox.min.y + 0.4;
      player.add(playerModel);
      modelReady = true;
    },
    undefined,
    ()=>{ createFallback(); modelReady = true; }
  );
}catch(e){ createFallback(); modelReady = true; }
setTimeout(()=>{ if(!modelReady){ createFallback(); modelReady=true; } }, 2000);

// ================== OBSTACLES ==================
const obstacles = [];
const coins = [];
const obstaclePool = [];
const coinPool = [];

function makeDrone(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.5, 0),
    new THREE.MeshStandardMaterial({color:0x220033, emissive:0xff3366, emissiveIntensity:0.9, metalness:0.8, roughness:0.3})
  );
  g.add(body);
  // rotors
  for(let i=0;i<4;i++){
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(0.25, 0.04, 6, 12),
      new THREE.MeshBasicMaterial({color:0xff3366})
    );
    const a = (i/4)*Math.PI*2;
    r.position.set(Math.cos(a)*0.6, 0.1, Math.sin(a)*0.6);
    r.rotation.x = Math.PI/2;
    g.add(r);
  }
  g.userData.type = 'drone';
  g.userData.radius = 0.7;
  return g;
}

function makeBarrier(){
  const g = new THREE.Group();
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.2, 0.3),
    new THREE.MeshStandardMaterial({color:0x1a0033, emissive:0xcc44ff, emissiveIntensity:0.7, metalness:0.6, roughness:0.4})
  );
  g.add(bar);
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.1, 0.32),
    new THREE.MeshBasicMaterial({color:0x00ffcc})
  );
  stripe.position.y = 0.3;
  g.add(stripe);
  g.userData.type = 'barrier';
  g.userData.radius = 0.9;
  return g;
}

function makeCoin(){
  const g = new THREE.Group();
  const chip = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 0.08),
    new THREE.MeshStandardMaterial({color:0x00ffcc, emissive:0x00ffcc, emissiveIntensity:1.2, metalness:0.9, roughness:0.2, transparent:true, opacity:0.9})
  );
  g.add(chip);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.3, 0.38, 16),
    new THREE.MeshBasicMaterial({color:0x00ffcc, side:THREE.DoubleSide, transparent:true, opacity:0.6})
  );
  ring.position.z = 0.05;
  g.add(ring);
  g.userData.type = 'coin';
  g.userData.radius = 0.5;
  g.userData.collected = false;
  return g;
}

function getObstacle(){
  for(const o of obstaclePool) if(!o.userData.active) return o;
  const o = Math.random()<0.5 ? makeDrone() : makeBarrier();
  o.userData.active = false;
  obstaclePool.push(o);
  scene.add(o);
  return o;
}
function getCoin(){
  for(const c of coinPool) if(!c.userData.active) return c;
  const c = makeCoin();
  c.userData.active = false;
  coinPool.push(c);
  scene.add(c);
  return c;
}

function spawnRow(z){
  // decide pattern
  const pattern = Math.random();
  const lanes = [0,1,2];
  if(pattern < 0.4){
    // single obstacle
    const lane = lanes[Math.floor(Math.random()*3)];
    const o = getObstacle();
    o.position.set(LANES[lane], o.userData.type==='drone'?1.5:0.6, z);
    o.userData.active = true;
    o.userData.lane = lane;
    obstacles.push(o);
  } else if(pattern < 0.75){
    // two obstacles, one lane free
    const free = Math.floor(Math.random()*3);
    for(let i=0;i<3;i++){
      if(i===free) continue;
      if(Math.random()<0.7){
        const o = getObstacle();
        o.position.set(LANES[i], o.userData.type==='drone'?1.5:0.6, z);
        o.userData.active = true;
        o.userData.lane = i;
        obstacles.push(o);
      }
    }
  } else {
    // one obstacle + coin line
    const obsLane = Math.floor(Math.random()*3);
    const o = getObstacle();
    o.position.set(LANES[obsLane], o.userData.type==='drone'?1.5:0.6, z);
    o.userData.active = true;
    o.userData.lane = obsLane;
    obstacles.push(o);
    const coinLane = lanes.filter(l=>l!==obsLane)[Math.floor(Math.random()*2)];
    for(let k=0;k<3;k++){
      const c = getCoin();
      c.position.set(LANES[coinLane], 1.2, z - k*1.5);
      c.userData.active = true;
      c.userData.collected = false;
      coins.push(c);
    }
  }
  // scattered coins
  if(Math.random()<0.3){
    const cl = Math.floor(Math.random()*3);
    for(let k=0;k<2;k++){
      const c = getCoin();
      c.position.set(LANES[cl], 1.2, z - 5 - k*2);
      c.userData.active = true;
      c.userData.collected = false;
      coins.push(c);
    }
  }
}

let nextSpawnZ = -30;

// ================== PARTICLES ==================
const particles = [];
function spawnParticles(pos, color, count=20){
  for(let i=0;i<count;i++){
    const p = new THREE.Mesh(
      new THREE.BoxGeometry(0.1,0.1,0.1),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:1})
    );
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3((Math.random()-0.5)*6, Math.random()*6, (Math.random()-0.5)*6);
    p.userData.life = 1;
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.userData.life -= dt*1.5;
    if(p.userData.life<=0){
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      particles.splice(i,1);
      continue;
    }
    p.userData.vel.y -= 12*dt;
    p.position.addScaledVector(p.userData.vel, dt);
    p.material.opacity = p.userData.life;
    p.rotation.x += dt*5;
    p.rotation.y += dt*5;
  }
}

// ================== INPUT ==================
function changeLane(dir){
  if(!state.running) return;
  state.targetLane = Math.max(0, Math.min(2, state.targetLane + dir));
}
function jump(){
  if(!state.running) return;
  if(state.onGround){
    state.vy = JUMP_V;
    state.onGround = false;
  }
}

addEventListener('keydown', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') changeLane(-1);
  else if(e.code==='ArrowRight'||e.code==='KeyD') changeLane(1);
  else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); jump(); }
});

let touchStartX=0, touchStartY=0, touchStartTime=0;
addEventListener('touchstart', e=>{
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchStartTime = performance.now();
}, {passive:true});
addEventListener('touchend', e=>{
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = performance.now() - touchStartTime;
  if(dt>500) return;
  if(Math.abs(dx) > Math.abs(dy)){
    if(Math.abs(dx) > 30) changeLane(dx>0?1:-1);
  } else {
    if(dy < -30) jump();
  }
}, {passive:true});

// ================== UI ==================
const scoreEl = document.getElementById('scoreVal');
const chipsEl = document.getElementById('chipsVal');
const speedEl = document.getElementById('speedVal');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalChipsEl = document.getElementById('finalChips');
const bestScoreEl = document.getElementById('bestScore');
const loadingEl = document.getElementById('loading');

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

function startGame(){
  state.running = true;
  state.lane = 1; state.targetLane = 1;
  state.vy = 0; state.onGround = true;
  state.speed = BASE_SPEED;
  state.distance = 0; state.chips = 0;
  player.position.set(LANES[1], 0, 0);
  // clear
  obstacles.forEach(o=>{ o.userData.active=false; o.position.y=-100; });
  coins.forEach(c=>{ c.userData.active=false; c.position.y=-100; });
  obstacles.length = 0; coins.length = 0;
  nextSpawnZ = -30;
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
}

function gameOver(){
  state.running = false;
  spawnParticles(player.position.clone().add(new THREE.Vector3(0,1,0)), 0xff3366, 40);
  spawnParticles(player.position.clone().add(new THREE.Vector3(0,1,0)), 0xcc44ff, 30);
  if(state.distance > state.best){
    state.best = Math.floor(state.distance);
    localStorage.setItem('null_exe_best', state.best);
  }
  finalScoreEl.textContent = Math.floor(state.distance);
  finalChipsEl.textContent = state.chips;
  bestScoreEl.textContent = state.best;
  setTimeout(()=>gameOverScreen.classList.remove('hidden'), 600);
}

// ================== GAME LOOP ==================
const clock = new THREE.Clock();
let elapsed = 0;

function update(dt){
  elapsed += dt;

  if(state.running){
    // speed grow
    state.speed = Math.min(MAX_SPEED, state.speed + SPEED_GROW*dt);
    const dz = state.speed * dt;
    state.distance += dz;

    // lane lerp
    const targetX = LANES[state.targetLane];
    player.position.x += (targetX - player.position.x) * Math.min(1, dt*10);

    // jump physics
    if(!state.onGround){
      state.vy -= GRAVITY*dt;
      player.position.y += state.vy*dt;
      if(player.position.y <= playerBaseY){
        player.position.y = playerBaseY;
        state.vy = 0;
        state.onGround = true;
      }
    }

    // board hover bob
    board.position.y = 0.3 + Math.sin(elapsed*4)*0.05;
    boardStrip.position.y = 0.38 + Math.sin(elapsed*4)*0.05;
    boardLight.intensity = 1.8 + Math.sin(elapsed*6)*0.4;

    // trail
    const tp = trail.geometry.attributes.position.array;
    // shift
    for(let i=TRAIL_N-1;i>0;i--){
      tp[i*3] = tp[(i-1)*3];
      tp[i*3+1] = tp[(i-1)*3+1];
      tp[i*3+2] = tp[(i-1)*3+2];
    }
    tp[0] = player.position.x;
    tp[1] = player.position.y + 0.3;
    tp[2] = player.position.z + 1.0;
    trail.geometry.attributes.position.needsUpdate = true;

    // move segments
    for(const s of segments){
      s.position.z += dz;
      if(s.position.z > SEG_LEN){
        s.position.z -= SEG_LEN * VISIBLE_SEGS;
      }
    }
    // move buildings
    buildGroup.position.z += dz*0.3;
    if(buildGroup.position.z > 50) buildGroup.position.z -= 200;

    // move obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.position.z += dz;
      if(o.userData.type==='drone'){
        o.rotation.y += dt*3;
        o.position.y = 1.5 + Math.sin(elapsed*3 + o.position.z)*0.2;
      }
      if(o.position.z > 8){
        o.userData.active = false;
        o.position.y = -100;
        obstacles.splice(i,1);
        continue;
      }
      // collision
      const dx = o.position.x - player.position.x;
      const dy = o.position.y - (player.position.y + 1.0);
      const dzc = o.position.z - player.position.z;
      const r = o.userData.radius + 0.5;
      if(Math.abs(dx)<r && Math.abs(dy)<1.2 && Math.abs(dzc)<1.2){
        spawnParticles(player.position.clone().add(new THREE.Vector3(0,1,0)), 0xff3366, 30);
        gameOver();
        return;
      }
    }

    // move coins
    for(let i=coins.length-1;i>=0;i--){
      const c = coins[i];
      c.position.z += dz;
      c.rotation.y += dt*3;
      c.rotation.x += dt*1.5;
      if(c.position.z > 8){
        c.userData.active = false;
        c.position.y = -100;
        coins.splice(i,1);
        continue;
      }
      if(!c.userData.collected){
        const dx = c.position.x - player.position.x;
        const dy = c.position.y - (player.position.y + 1.0);
        const dzc = c.position.z - player.position.z;
        if(Math.abs(dx)<1 && Math.abs(dy)<1.2 && Math.abs(dzc)<1.2){
          c.userData.collected = true;
          c.userData.active = false;
          c.position.y = -100;
          coins.splice(i,1);
          state.chips++;
          spawnParticles(c.position.clone(), 0x00ffcc, 15);
        }
      }
    }

    // spawn
    nextSpawnZ += dz;
    while(nextSpawnZ > -120){
      nextSpawnZ -= (8 + Math.random()*6);
      spawnRow(nextSpawnZ);
    }

    // HUD
    scoreEl.textContent = Math.floor(state.distance);
    chipsEl.textContent = state.chips;
    speedEl.textContent = (state.speed/BASE_SPEED).toFixed(1)+'x';
  }

  updateParticles(dt);

  // camera shake on low health? skip
  camera.position.x += (player.position.x*0.3 - camera.position.x)*Math.min(1,dt*3);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// init
setTimeout(()=>{
  loadingEl.style.display='none';
  animate();
}, 300);
</script>
