<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL.EXE — Endless Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #0a0a2e;
            color: #00ffcc;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px #cc44ff, 0 0 20px #cc44ff;
            z-index: 10;
            pointer-events: none;
        }

        #score {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #overlay.hidden {
            display: none;
        }

        .title {
            font-size: 72px;
            color: #cc44ff;
            text-shadow: 0 0 20px #cc44ff, 0 0 40px #cc44ff;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        .subtitle {
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            background: transparent;
            border: 2px solid #cc44ff;
            color: #cc44ff;
            cursor: pointer;
            text-shadow: 0 0 10px #cc44ff;
            box-shadow: 0 0 20px #cc44ff;
            transition: all 0.3s;
            letter-spacing: 3px;
        }

        .btn:hover {
            background: #cc44ff;
            color: #0a0a2e;
            box-shadow: 0 0 40px #cc44ff;
        }

        .instructions {
            margin-top: 30px;
            font-size: 16px;
            color: #00ffcc;
            text-align: center;
            line-height: 1.8;
            text-shadow: 0 0 5px #00ffcc;
        }

        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 46, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #gameOver.show {
            display: flex;
        }

        .final-score {
            font-size: 48px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="hud">
            <div>СЧЁТ: <span id="score">0</span></div>
            <div>СКОРОСТЬ: <span id="speed">1.0</span>x</div>
        </div>

        <div id="overlay">
            <div class="title">NULL.EXE</div>
            <div class="subtitle">ЦИФРОВОЙ МИР</div>
            <button class="btn" id="startBtn">ЗАПУСК</button>
            <div class="instructions">
                ← → — смена полосы<br>
                ↑ — прыжок<br>
                СВАЙПЫ — мобильное управление
            </div>
        </div>

        <div id="gameOver">
            <div class="title">СИСТЕМА СЛОМАНА</div>
            <div class="final-score">СЧЁТ: <span id="finalScore">0</span></div>
            <button class="btn" id="restartBtn">ПЕРЕЗАГРУЗКА</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2e);
        scene.fog = new THREE.Fog(0x0a0a2e, 10, 80);

        // Камера
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0x4444ff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xcc44ff, 1);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xcc44ff, 2, 10);
        pointLight.position.set(0, 0.5, 0);
        scene.add(pointLight);

        // Дорога
        const laneWidth = 3;
        const lanes = [-laneWidth, 0, laneWidth];
        const roadSegments = [];
        const segmentLength = 20;
        const numSegments = 5;

        function createRoadSegment(z) {
            const segment = new THREE.Group();
            
            // Полотно дороги
            const roadGeometry = new THREE.PlaneGeometry(laneWidth * 3, segmentLength);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a3e,
                roughness: 0.8,
                metalness: 0.2
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = z;
            road.receiveShadow = true;
            segment.add(road);

            // Неоновые линии
            for (let i = -1; i <= 1; i++) {
                const lineGeometry = new THREE.PlaneGeometry(0.1, segmentLength);
                const lineMaterial = new THREE.MeshBasicMaterial({
                    color: 0xcc44ff,
                    transparent: true,
                    opacity: 0.8
                });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * laneWidth, 0.01, z);
                segment.add(line);
            }

            // Стены
            const wallGeometry = new THREE.BoxGeometry(0.5, 3, segmentLength);
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a4e,
                emissive: 0xcc44ff,
                emissiveIntensity: 0.3
            });

            const leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
            leftWall.position.set(-laneWidth * 1.75, 1.5, z);
            segment.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
            rightWall.position.set(laneWidth * 1.75, 1.5, z);
            segment.add(rightWall);

            // Неоновые барьеры на стенах
            for (let i = 0; i < 4; i++) {
                const barrierGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const barrierMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffcc,
                    transparent: true,
                    opacity: 0.9
                });

                const leftBarrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
                leftBarrier.position.set(-laneWidth * 1.75, 1 + i * 0.5, z - segmentLength / 2 + i * 5);
                segment.add(leftBarrier);

                const rightBarrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
                rightBarrier.position.set(laneWidth * 1.75, 1 + i * 0.5, z - segmentLength / 2 + i * 5);
                segment.add(rightBarrier);
            }

            segment.userData.z = z;
            return segment;
        }

        for (let i = 0; i < numSegments; i++) {
            const segment = createRoadSegment(-i * segmentLength);
            scene.add(segment);
            roadSegments.push(segment);
        }

        // Игрок
        let player;
        let playerBaseY = 1.0;
        const playerBaseYValue = 1.0;
        let currentLane = 1;
        let targetX = 0;
        let velocityY = 0;
        let isJumping = false;

        // Загрузка модели
        const loader = new GLTFLoader();
        loader.load(
            'player_game.glb',
            (gltf) => {
                player = gltf.scene;
                player.scale.set(1, 1, 1);
                player.position.set(0, playerBaseYValue, 0);
                player.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                    }
                });
                scene.add(player);
                initGame();
            },
            undefined,
            (error) => {
                console.warn('Модель не загружена, используем fallback');
                createFallbackPlayer();
                initGame();
            }
        );

        function createFallbackPlayer() {
            const group = new THREE.Group();

            // Ховерборд
            const boardGeometry = new THREE.BoxGeometry(1.5, 0.2, 2.5);
            const boardMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a3e,
                emissive: 0xcc44ff,
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.2
            });
            const board = new THREE.Mesh(boardGeometry, boardMaterial);
            board.position.y = -0.8;
            board.castShadow = true;
            group.add(board);

            // Капсула (тело)
            const bodyGeometry = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a4e,
                emissive: 0xcc44ff,
                emissiveIntensity: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.2;
            body.castShadow = true;
            group.add(body);

            // Свет снизу
            const glowGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xcc44ff,
                transparent: true,
                opacity: 0.6
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.y = -0.9;
            group.add(glow);

            player = group;
            player.position.set(0, playerBaseYValue, 0);
            scene.add(player);
        }

        // Препятствия и монеты
        const obstacles = [];
        const coins = [];
        const particles = [];

        function createObstacle(lane, z) {
            const type = Math.random() > 0.5 ? 'drone' : 'barrier';
            let obstacle;

            if (type === 'drone') {
                const geometry = new THREE.OctahedronGeometry(0.6);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xff0044,
                    emissive: 0xff0044,
                    emissiveIntensity: 0.8
                });
                obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.y = 1.5;
            } else {
                const geometry = new THREE.BoxGeometry(2, 2, 0.5);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xcc44ff,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.6
                });
                obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.y = 1;
            }

            obstacle.position.x = lanes[lane];
            obstacle.position.z = z;
            obstacle.userData.type = type;
            obstacle.userData.lane = lane;
            obstacle.castShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function createCoin(lane, z) {
            const geometry = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                emissive: 0x00ffcc,
                emissiveIntensity: 1,
                metalness: 1,
                roughness: 0
            });
            const coin = new THREE.Mesh(geometry, material);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(lanes[lane], 1.5, z);
            coin.castShadow = true;
            scene.add(coin);
            coins.push(coin);
        }

        function createParticle(position, color) {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 1
            });
            const particle = new THREE.Mesh(geometry, material);
            particle.position.copy(position);
            particle.userData.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.3,
                Math.random() * 0.3,
                (Math.random() - 0.5) * 0.3
            );
            particle.userData.life = 1;
            scene.add(particle);
            particles.push(particle);
        }

        // Игровая логика
        let score = 0;
        let speed = 0.3;
        let gameActive = false;
        let spawnTimer = 0;

        function initGame() {
            score = 0;
            speed = 0.3;
            currentLane = 1;
            targetX = 0;
            player.position.set(0, playerBaseYValue, 0);
            velocityY = 0;
            isJumping = false;
            gameActive = true;
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('speed').textContent = (speed / 0.3).toFixed(1);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('gameOver').classList.add('show');
        }

        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(player);

            // Проверка препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);

                if (playerBox.intersectsBox(obstacleBox)) {
                    // Создаём частицы
                    for (let j = 0; j < 20; j++) {
                        createParticle(obstacle.position.clone(), 0xff0044);
                    }
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                    gameOver();
                    return;
                }
            }

            // Проверка монет
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const coinBox = new THREE.Box3().setFromObject(coin);

                if (playerBox.intersectsBox(coinBox)) {
                    score += 10;
                    for (let j = 0; j < 15; j++) {
                        createParticle(coin.position.clone(), 0x00ffcc);
                    }
                    scene.remove(coin);
                    coins.splice(i, 1);
                    updateHUD();
                }
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.userData.velocity.y -= 0.01;
                p.userData.life -= delta * 2;
                p.material.opacity = p.userData.life;

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        // Управление
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (gameActive) {
                if (e.key === 'ArrowLeft' && currentLane > 0) {
                    currentLane--;
                    targetX = lanes[currentLane];
                }
                if (e.key === 'ArrowRight' && currentLane < 2) {
                    currentLane++;
                    targetX = lanes[currentLane];
                }
                if (e.key === 'ArrowUp' && !isJumping) {
                    velocityY = 0.3;
                    isJumping = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Свайпы
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            if (!gameActive) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 50 && currentLane < 2) {
                    currentLane++;
                    targetX = lanes[currentLane];
                } else if (diffX < -50 && currentLane > 0) {
                    currentLane--;
                    targetX = lanes[currentLane];
                }
            } else {
                if (diffY < -50 && !isJumping) {
                    velocityY = 0.3;
                    isJumping = true;
                }
            }
        });

        // Кнопки
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('overlay').classList.add('hidden');
            initGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOver').classList.remove('show');
            // Очищаем препятствия и монеты
            obstacles.forEach(o => scene.remove(o));
            obstacles.length = 0;
            coins.forEach(c => scene.remove(c));
            coins.length = 0;
            particles.forEach(p => scene.remove(p));
            particles.length = 0;
            initGame();
        });

        // Анимация
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameActive && player) {
                // Движение игрока
                player.position.x += (targetX - player.position.x) * 0.2;

                // Прыжок
                if (isJumping) {
                    velocityY -= 0.015;
                    player.position.y += velocityY;

                    if (player.position.y <= playerBaseYValue) {
                        player.position.y = playerBaseYValue;
                        velocityY = 0;
                        isJumping = false;
                    }
                }

                // Движение дороги
                roadSegments.forEach(segment => {
                    segment.position.z += speed;
                    if (segment.position.z > segmentLength) {
                        segment.position.z -= segmentLength * numSegments;
                    }
                });

                // Движение препятствий
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].position.z += speed;
                    if (obstacles[i].userData.type === 'drone') {
                        obstacles[i].rotation.y += 0.05;
                    }
                    if (obstacles[i].position.z > 10) {
                        scene.remove(obstacles[i]);
                        obstacles.splice(i, 1);
                    }
                }

                // Движение монет
                for (let i = coins.length - 1; i >= 0; i--) {
                    coins[i].position.z += speed;
                    coins[i].rotation.z += 0.05;
                    if (coins[i].position.z > 10) {
                        scene.remove(coins[i]);
                        coins.splice(i, 1);
                    }
                }

                // Спавн препятствий и монет
                spawnTimer += delta;
                if (spawnTimer > 1.5 / (speed / 0.3)) {
                    spawnTimer = 0;
                    const lane = Math.floor(Math.random() * 3);
                    if (Math.random() > 0.3) {
                        createObstacle(lane, -50);
                    } else {
                        createCoin(lane, -50);
                    }
                }

                // Увеличение скорости
                speed += delta * 0.01;

                // Очки
                score += delta * 10 * (speed / 0.3);
                updateHUD();

                // Проверка столкновений
                checkCollisions();

                // Свет под ховербордом
                pointLight.position.copy(player.position);
                pointLight.position.y -= 0.5;
            }

            updateParticles(delta);
            renderer.render(scene, camera);
        }

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
