```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL.EXE - Cyberpunk Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #0a0a2e;
            color: #00ffcc;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-size: 24px;
            text-shadow: 0 0 10px #cc44ff, 0 0 20px #cc44ff;
        }
        
        #score, #speed {
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;

        .overlay.hidden {

        .overlay h1 {

        .overlay h2 {

        .overlay p {

            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            text-shadow: 0 0 10px #cc44ff;

        #final-score {

        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="speed">SPEED: 0.0</div>
    </div>
    
    <div id="start-overlay" class="overlay">
        <h1>NULL.EXE</h1>
        <h2>CYBERPUNK RUNNER</h2>
        <p>Уворачивайся от дронов и барьеров</p>
        <p>Собирай голографические чипы</p>
        <div class="controls">
            <p>← → или A/D - смена полосы</p>
            <p>↑ или SPACE - прыжок</p>
            <p>Свайпы на мобильных</p>
        </div>
        <button class="btn" id="start-btn">START</button>
    </div>
    
    <div id="gameover-overlay" class="overlay hidden">
        <h1>SYSTEM CRASH</h1>
        <div id="final-score">0</div>
        <button class="btn" id="restart-btn">REBOOT</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Game state
        const gameState = {
            isRunning: false,
            score: 0,
            speed: 0.4,
            maxSpeed: 1.2,
            lanes: [-3, 0, 3],
            currentLane: 1,
            targetLane: 1,
            isJumping: false,
            jumpVelocity: 0,
            gravity: -0.015,
            jumpForce: 0.35,
            playerBaseY: 0.5,
            segmentLength: 20,
            segmentCount: 5,
            obstacles: [],
            coins: [],
            particles: [],
            segments: []
        };

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2e);
        scene.fog = new THREE.Fog(0x0a0a2e, 10, 60);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x4444ff, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xcc44ff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xcc44ff, 1, 10);
        pointLight.position.set(0, 0.5, 0);
        scene.add(pointLight);

        // Player
        let player;
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Load player model
        const loader = new GLTFLoader();
        loader.load(
            'player_game.glb',
            (gltf) => {
                player = gltf.scene;
                player.scale.set(1, 1, 1);
                player.position.set(0, gameState.playerBaseY, 0);
                playerGroup.add(player);
            },
            undefined,
            (error) => {
                // Fallback capsule
                const geometry = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x1a1a3e,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.3
                });
                player = new THREE.Mesh(geometry, material);
                player.position.set(0, gameState.playerBaseY, 0);
                player.castShadow = true;
                playerGroup.add(player);
            }
        );

        // Hoverboard
        const boardGeometry = new THREE.BoxGeometry(0.8, 0.1, 2);
        const boardMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a0a2e,
            emissive: 0xcc44ff,
            emissiveIntensity: 0.8
        });
        const hoverboard = new THREE.Mesh(boardGeometry, boardMaterial);
        hoverboard.position.y = -0.6;
        playerGroup.add(hoverboard);

        // Board glow
        const glowGeometry = new THREE.BoxGeometry(0.9, 0.05, 2.1);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xcc44ff,
            transparent: true,
            opacity: 0.5
        });
        const boardGlow = new THREE.Mesh(glowGeometry, glowMaterial);
        boardGlow.position.y = -0.65;
        playerGroup.add(boardGlow);

        // Road segments
        function createRoadSegment(z) {
            const segment = new THREE.Group();
            
            // Road surface
            const roadGeometry = new THREE.PlaneGeometry(10, gameState.segmentLength);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0a2e,
                emissive: 0x220033,
                emissiveIntensity: 0.2
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0;
            road.receiveShadow = true;
            segment.add(road);

            // Glowing lines
            for (let i = -1; i <= 1; i += 2) {
                const lineGeometry = new THREE.PlaneGeometry(0.1, gameState.segmentLength);
                const lineMaterial = new THREE.MeshBasicMaterial({
                    color: 0xcc44ff,
                    transparent: true,
                    opacity: 0.8
                });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.5, 0.01, 0);
                segment.add(line);
            }

            // Side walls
            for (let i = -1; i <= 1; i += 2) {
                const wallGeometry = new THREE.BoxGeometry(0.5, 3, gameState.segmentLength);
                const wallMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a3e,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.3
                });
                const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                wall.position.set(i * 5.5, 1.5, 0);
                segment.add(wall);

                // Neon barriers on walls
                const barrierGeometry = new THREE.BoxGeometry(0.1, 0.3, 2);
                const barrierMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffcc
                });
                for (let j = 0; j < 5; j++) {
                    const barrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
                    barrier.position.set(i * 5.2, 1, -gameState.segmentLength / 2 + j * 4 + 2);
                    segment.add(barrier);
                }
            }

            segment.position.z = z;
            scene.add(segment);
            gameState.segments.push(segment);
            return segment;
        }

        // Initialize road
        for (let i = 0; i < gameState.segmentCount; i++) {
            createRoadSegment(-i * gameState.segmentLength);
        }

        // Obstacles
        function createObstacle(lane, z) {
            const type = Math.random() > 0.5 ? 'drone' : 'barrier';
            let obstacle;

            if (type === 'drone') {
                const geometry = new THREE.SphereGeometry(0.5, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xff0044,
                    emissive: 0xff0044,
                    emissiveIntensity: 0.8
                });
                obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.set(gameState.lanes[lane], 1.5, z);
                
                // Drone propellers
                const propGeometry = new THREE.BoxGeometry(1.2, 0.05, 0.1);
                const propMaterial = new THREE.MeshBasicMaterial({ color: 0xff0044 });
                const prop1 = new THREE.Mesh(propGeometry, propMaterial);
                prop1.position.y = 0.3;
                obstacle.add(prop1);
                const prop2 = new THREE.Mesh(propGeometry, propMaterial);
                prop2.position.y = 0.3;
                prop2.rotation.y = Math.PI / 2;
                obstacle.add(prop2);
            } else {
                const geometry = new THREE.BoxGeometry(2, 1.5, 0.5);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x8800ff,
                    emissive: 0x8800ff,
                    emissiveIntensity: 0.6
                });
                obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.set(gameState.lanes[lane], 0.75, z);
            }

            obstacle.userData = { type: 'obstacle', lane: lane };
            scene.add(obstacle);
            gameState.obstacles.push(obstacle);
        }

        // Coins
        function createCoin(lane, z) {
            const geometry = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.8
            });
            const coin = new THREE.Mesh(geometry, material);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(gameState.lanes[lane], 1, z);
            coin.userData = { type: 'coin', lane: lane };
            scene.add(coin);
            gameState.coins.push(coin);
        }

        // Particles
        function createParticles(position, color) {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const geometry = new THREE.SphereGeometry(0.05, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.3,
                        (Math.random() - 0.5) * 0.3
                    ),
                    life: 1
                };
                scene.add(particle);
                gameState.particles.push(particle);
            }
        }

        // Generate obstacles and coins
        let lastObstacleZ = -30;
        function generateContent() {
            const spawnZ = -gameState.segmentLength * (gameState.segmentCount - 1);
            
            if (lastObstacleZ > spawnZ + 15) {
                const lane = Math.floor(Math.random() * 3);
                createObstacle(lane, spawnZ);
                lastObstacleZ = spawnZ;

                // Sometimes add coin
                if (Math.random() > 0.5) {
                    let coinLane = Math.floor(Math.random() * 3);
                    while (coinLane === lane) {
                        coinLane = Math.floor(Math.random() * 3);
                    }
                    createCoin(coinLane, spawnZ - 5);
                }
            }
        }

        // Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (!gameState.isRunning) return;
            
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && gameState.targetLane > 0) {
                gameState.targetLane--;
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && gameState.targetLane < 2) {
                gameState.targetLane++;
            }
            if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') && !gameState.isJumping) {
                gameState.isJumping = true;
                gameState.jumpVelocity = gameState.jumpForce;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            if (!gameState.isRunning) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && gameState.targetLane < 2) {
                    gameState.targetLane++;
                } else if (diffX < -30 && gameState.targetLane > 0) {
                    gameState.targetLane--;
                }
            } else {
                if (diffY < -30 && !gameState.isJumping) {
                    gameState.isJumping = true;
                    gameState.jumpVelocity = gameState.jumpForce;
                }
            }
        });

        // Collision detection
        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(playerGroup);
            
            // Check obstacles
            for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
                const obstacle = gameState.obstacles[i];
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);
                
                if (playerBox.intersectsBox(obstacleBox)) {
                    createParticles(playerGroup.position.clone(), 0xff0044);
                    gameOver();
                    return;
                }
            }

            // Check coins
            for (let i = gameState.coins.length - 1; i >= 0; i--) {
                const coin = gameState.coins[i];
                const coinBox = new THREE.Box3().setFromObject(coin);
                
                if (playerBox.intersectsBox(coinBox)) {
                    createParticles(coin.position.clone(), 0x00ffcc);
                    scene.remove(coin);
                    gameState.coins.splice(i, 1);
                    gameState.score += 10;
                    updateHUD();
                }
            }
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('score').textContent = `SCORE: ${gameState.score}`;
            document.getElementById('speed').textContent = `SPEED: ${gameState.speed.toFixed(2)}`;
        }

        // Game over
        function gameOver() {
            gameState.isRunning = false;
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('gameover-overlay').classList.remove('hidden');
        }

        // Reset game
        function resetGame() {
            gameState.score = 0;
            gameState.speed = 0.4;
            gameState.currentLane = 1;
            gameState.targetLane = 1;
            gameState.isJumping = false;
            gameState.jumpVelocity = 0;
            playerGroup.position.set(0, gameState.playerBaseY, 0);

            // Clear obstacles and coins
            gameState.obstacles.forEach(obs => scene.remove(obs));
            gameState.obstacles = [];
            gameState.coins.forEach(coin => scene.remove(coin));
            gameState.coins = [];
            gameState.particles.forEach(p => scene.remove(p));
            gameState.particles = [];

            lastObstacleZ = -30;
            updateHUD();
        }

        // Start game
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-overlay').classList.add('hidden');
            gameState.isRunning = true;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('gameover-overlay').classList.add('hidden');
            resetGame();
            gameState.isRunning = true;
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (gameState.isRunning) {
                // Move player to target lane
                const targetX = gameState.lanes[gameState.targetLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.15;

                // Jump physics
                if (gameState.isJumping) {
                    gameState.jumpVelocity += gameState.gravity;
                    playerGroup.position.y += gameState.jumpVelocity;

                    if (playerGroup.position.y <= gameState.playerBaseY) {
                        playerGroup.position.y = gameState.playerBaseY;
                        gameState.isJumping = false;
                        gameState.jumpVelocity = 0;
                    }
                }

                // Hover effect
                hoverboard.position.y = -0.6 + Math.sin(Date.now() * 0.005) * 0.05;
                boardGlow.material.opacity = 0.5 + Math.sin(Date.now() * 0.003) * 0.2;

                // Move segments
                gameState.segments.forEach(segment => {
                    segment.position.z += gameState.speed;
                    if (segment.position.z > gameState.segmentLength) {
                        segment.position.z -= gameState.segmentLength * gameState.segmentCount;
                    }
                });

                // Move obstacles
                for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
                    const obstacle = gameState.obstacles[i];
                    obstacle.position.z += gameState.speed;
                    
                    // Rotate drones
                    if (obstacle.userData.type === 'drone') {
                        obstacle.rotation.y += 0.1;
                    }

                    if (obstacle.position.z > 10) {
                        scene.remove(obstacle);
                        gameState.obstacles.splice(i, 1);
                    }
                }

                // Move coins
                for (let i = gameState.coins.length - 1; i >= 0; i--) {
                    const coin = gameState.coins[i];
                    coin.position.z += gameState.speed;
                    coin.rotation.z += 0.05;

                    if (coin.position.z > 10) {
                        scene.remove(coin);
                        gameState.coins.splice(i, 1);
                    }
                }

                // Update particles
                for (let i = gameState.particles.length - 1; i >= 0; i--) {
                    const particle = gameState.particles[i];
                    particle.position.add(particle.userData.velocity);
                    particle.userData.velocity.y -= 0.01;
                    particle.userData.life -= 0.02;
                    particle.material.opacity = particle.userData.life;

                    if (particle.userData.life <= 0) {
                        scene.remove(particle);
                        gameState.particles.splice(i, 1);
                    }
                }

                // Generate content
                generateContent();

                // Check collisions
                checkCollisions();

                // Increase speed
                if (gameState.speed < gameState.maxSpeed) {
                    gameState.speed += 0.0001;
                }

                // Update score
                gameState.score += Math.floor(gameState.speed * 2);
                updateHUD();

                // Update point light position
                pointLight.position.copy(playerGroup.position);
            }

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
