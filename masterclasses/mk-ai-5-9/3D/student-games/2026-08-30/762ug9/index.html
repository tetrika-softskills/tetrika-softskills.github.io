<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL.EXE - Endless Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #0a0a2e;
            color: #cc44ff;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px #cc44ff, 0 0 20px #cc44ff;
            z-index: 10;
            pointer-events: none;
        }
        
        #score {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }
        
        #speed {
            color: #cc44ff;
            margin-top: 10px;
            font-size: 18px;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .title {
            font-size: 72px;
            color: #cc44ff;
            text-shadow: 0 0 20px #cc44ff, 0 0 40px #cc44ff, 0 0 60px #cc44ff;
            margin-bottom: 20px;
            letter-spacing: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .subtitle {
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 40px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            background: transparent;
            border: 2px solid #cc44ff;
            color: #cc44ff;
            cursor: pointer;
            text-shadow: 0 0 10px #cc44ff;
            box-shadow: 0 0 20px rgba(204, 68, 255, 0.5);
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        
        .btn:hover {
            background: rgba(204, 68, 255, 0.2);
            box-shadow: 0 0 30px rgba(204, 68, 255, 0.8);
            transform: scale(1.05);
        }
        
        .instructions {
            margin-top: 30px;
            color: #00ffcc;
            text-align: center;
            line-height: 1.8;
            font-size: 16px;
        }
        
        .game-over-score {
            font-size: 48px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin: 20px 0;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: #cc44ff;
            text-shadow: 0 0 20px #cc44ff;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="speed">SPEED: 1.0x</div>
    </div>
    
    <div id="loading">LOADING NULL.EXE...</div>
    
    <div id="start-screen" class="overlay">
        <div class="title">NULL.EXE</div>
        <div class="subtitle">DIGITAL RUNNER</div>
        <button class="btn" id="start-btn">START</button>
        <div class="instructions">
            ← → или A/D - смена полосы<br>
            ↑ или W или SPACE - прыжок<br>
            Свайпы на мобильных
        </div>
    </div>
    
    <div id="game-over-screen" class="overlay hidden">
        <div class="title">GAME OVER</div>
        <div class="game-over-score" id="final-score">0</div>
        <button class="btn" id="restart-btn">RESTART</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Game State
        const gameState = {
            isRunning: false,
            score: 0,
            speed: 0.5,
            maxSpeed: 2.0,
            currentLane: 0,
            targetLane: 0,
            isJumping: false,
            jumpVelocity: 0,
            gravity: -0.015,
            jumpForce: 0.25,
            playerBaseY: 0.5,
            lanes: [-3, 0, 3],
            segmentLength: 20,
            visibleSegments: 5,
            obstacles: [],
            coins: [],
            particles: [],
            segments: [],
            time: 0
        };

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2e);
        scene.fog = new THREE.Fog(0x0a0a2e, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 8);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x4444ff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xcc44ff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const playerLight = new THREE.PointLight(0xcc44ff, 1, 5);
        playerLight.position.set(0, 0.5, 0);
        scene.add(playerLight);

        // Player
        let player;
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Hoverboard
        const boardGeometry = new THREE.BoxGeometry(1.5, 0.1, 2.5);
        const boardMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a3e,
            emissive: 0xcc44ff,
            emissiveIntensity: 0.5,
            metalness: 0.8,
            roughness: 0.2
        });
        const board = new THREE.Mesh(boardGeometry, boardMaterial);
        board.position.y = gameState.playerBaseY;
        board.castShadow = true;
        playerGroup.add(board);

        // Fallback player (capsule)
        const playerGeometry = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
        const playerMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4e,
            emissive: 0xcc44ff,
            emissiveIntensity: 0.3,
            metalness: 0.6,
            roughness: 0.3
        });
        const fallbackPlayer = new THREE.Mesh(playerGeometry, playerMaterial);
        fallbackPlayer.position.y = gameState.playerBaseY + 1.2;
        fallbackPlayer.castShadow = true;
        playerGroup.add(fallbackPlayer);
        player = playerGroup;

        // Load GLB model
        const loader = new GLTFLoader();
        loader.load('player_game.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(2.0, 2.0, 2.0);
            model.position.y = gameState.playerBaseY;
            
            playerGroup.remove(fallbackPlayer);
            playerGroup.add(model);
            player = playerGroup;
            
            document.getElementById('loading').style.display = 'none';
        }, undefined, (error) => {
            console.log('Using fallback player model');
            document.getElementById('loading').style.display = 'none';
        });

        // Road Segments
        function createRoadSegment(z) {
            const segment = new THREE.Group();
            
            // Road surface
            const roadGeometry = new THREE.PlaneGeometry(10, gameState.segmentLength);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0a2e,
                metalness: 0.5,
                roughness: 0.8
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = z;
            road.receiveShadow = true;
            segment.add(road);
            
            // Glowing lines
            for (let i = -1; i <= 1; i++) {
                const lineGeometry = new THREE.PlaneGeometry(0.1, gameState.segmentLength);
                const lineMaterial = new THREE.MeshBasicMaterial({
                    color: 0xcc44ff,
                    transparent: true,
                    opacity: 0.8
                });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 3, 0.01, z);
                segment.add(line);
            }
            
            // Side walls
            for (let side = -1; side <= 1; side += 2) {
                const wallGeometry = new THREE.BoxGeometry(0.5, 3, gameState.segmentLength);
                const wallMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a3e,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.3
                });
                const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                wall.position.set(side * 5.5, 1.5, z);
                wall.castShadow = true;
                segment.add(wall);
                
                // Neon barriers
                const barrierGeometry = new THREE.BoxGeometry(0.2, 0.5, 2);
                const barrierMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffcc
                });
                for (let i = 0; i < 5; i++) {
                    const barrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
                    barrier.position.set(side * 5.5, 0.5, z - gameState.segmentLength / 2 + i * 4);
                    segment.add(barrier);
                }
            }
            
            scene.add(segment);
            return segment;
        }

        // Initialize road segments
        for (let i = 0; i < gameState.visibleSegments; i++) {
            const segment = createRoadSegment(-i * gameState.segmentLength);
            gameState.segments.push(segment);
        }

        // Obstacles
        function createObstacle(lane, z) {
            const type = Math.random() > 0.5 ? 'drone' : 'barrier';
            let obstacle;
            
            if (type === 'drone') {
                const droneGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                const droneMaterial = new THREE.MeshStandardMaterial({
                    color: 0xff4444,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.8,
                    metalness: 0.7,
                    roughness: 0.3
                });
                obstacle = new THREE.Mesh(droneGeometry, droneMaterial);
                obstacle.position.y = 1.5;
            } else {
                const barrierGeometry = new THREE.BoxGeometry(1.5, 2, 0.5);
                const barrierMaterial = new THREE.MeshStandardMaterial({
                    color: 0xcc44ff,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.6,
                    metalness: 0.6,
                    roughness: 0.4
                });
                obstacle = new THREE.Mesh(barrierGeometry, barrierMaterial);
                obstacle.position.y = 1;
            }
            
            obstacle.position.x = gameState.lanes[lane];
            obstacle.position.z = z;
            obstacle.castShadow = true;
            obstacle.userData = { type: 'obstacle', lane: lane };
            
            scene.add(obstacle);
            gameState.obstacles.push(obstacle);
            return obstacle;
        }

        // Coins
        function createCoin(lane, z) {
            const coinGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const coinMaterial = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.8,
                metalness: 0.9,
                roughness: 0.1,
                transparent: true,
                opacity: 0.8
            });
            const coin = new THREE.Mesh(coinGeometry, coinMaterial);
            coin.rotation.x = Math.PI / 2;
            coin.position.x = gameState.lanes[lane];
            coin.position.y = 1.5;
            coin.position.z = z;
            coin.userData = { type: 'coin', lane: lane };
            
            scene.add(coin);
            gameState.coins.push(coin);
            return coin;
        }

        // Particles
        function createParticles(position, color) {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const geometry = new THREE.SphereGeometry(0.05, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.2,
                        Math.random() * 0.2,
                        (Math.random() - 0.5) * 0.2
                    ),
                    life: 1.0
                };
                scene.add(particle);
                gameState.particles.push(particle);
            }
        }

        // Spawn obstacles and coins
        function spawnObjects() {
            const spawnZ = -gameState.visibleSegments * gameState.segmentLength;
            
            if (Math.random() < 0.3) {
                const lane = Math.floor(Math.random() * 3);
                createObstacle(lane, spawnZ);
            }
            
            if (Math.random() < 0.5) {
                const lane = Math.floor(Math.random() * 3);
                createCoin(lane, spawnZ - 5);
            }
        }

        // Controls
        const keys = {};
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (!gameState.isRunning) return;
            
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                if (gameState.targetLane > -1) gameState.targetLane--;
            }
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                if (gameState.targetLane < 1) gameState.targetLane++;
            }
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' || e.key === ' ') {
                if (!gameState.isJumping) {
                    gameState.isJumping = true;
                    gameState.jumpVelocity = gameState.jumpForce;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Touch controls
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            if (!gameState.isRunning) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 50 && gameState.targetLane < 1) {
                    gameState.targetLane++;
                } else if (diffX < -50 && gameState.targetLane > -1) {
                    gameState.targetLane--;
                }
            } else {
                if (diffY < -50 && !gameState.isJumping) {
                    gameState.isJumping = true;
                    gameState.jumpVelocity = gameState.jumpForce;
                }
            }
        });

        // Collision detection
        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(player);
            
            // Check obstacles
            for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
                const obstacle = gameState.obstacles[i];
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);
                
                if (playerBox.intersectsBox(obstacleBox)) {
                    createParticles(obstacle.position.clone(), 0xcc44ff);
                    gameOver();
                    return;
                }
            }
            
            // Check coins
            for (let i = gameState.coins.length - 1; i >= 0; i--) {
                const coin = gameState.coins[i];
                const coinBox = new THREE.Box3().setFromObject(coin);
                
                if (playerBox.intersectsBox(coinBox)) {
                    createParticles(coin.position.clone(), 0x00ffcc);
                    scene.remove(coin);
                    gameState.coins.splice(i, 1);
                    gameState.score += 10;
                }
            }
        }

        // Game Over
        function gameOver() {
            gameState.isRunning = false;
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Reset Game
        function resetGame() {
            gameState.score = 0;
            gameState.speed = 0.5;
            gameState.currentLane = 0;
            gameState.targetLane = 0;
            gameState.isJumping = false;
            gameState.jumpVelocity = 0;
            
            player.position.x = 0;
            player.position.y = gameState.playerBaseY;
            
            // Clear obstacles and coins
            gameState.obstacles.forEach(obs => scene.remove(obs));
            gameState.obstacles = [];
            gameState.coins.forEach(coin => scene.remove(coin));
            gameState.coins = [];
            gameState.particles.forEach(particle => scene.remove(particle));
            gameState.particles = [];
            
            document.getElementById('game-over-screen').classList.add('hidden');
            gameState.isRunning = true;
        }

        // UI Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            gameState.isRunning = true;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            resetGame();
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            if (gameState.isRunning) {
                gameState.time += 0.016;
                
                // Increase speed
                if (gameState.speed < gameState.maxSpeed) {
                    gameState.speed += 0.0001;
                }
                
                // Move player to target lane
                const targetX = gameState.lanes[gameState.targetLane];
                player.position.x += (targetX - player.position.x) * 0.1;
                
                // Jump physics
                if (gameState.isJumping) {
                    gameState.jumpVelocity += gameState.gravity;
                    player.position.y += gameState.jumpVelocity;
                    
                    if (player.position.y <= gameState.playerBaseY) {
                        player.position.y = gameState.playerBaseY;
                        gameState.isJumping = false;
                        gameState.jumpVelocity = 0;
                    }
                }
                
                // Hoverboard animation
                board.position.y = gameState.playerBaseY + Math.sin(gameState.time * 5) * 0.05;
                playerLight.position.copy(player.position);
                playerLight.position.y -= 0.5;
                
                // Move segments
                gameState.segments.forEach(segment => {
                    segment.position.z += gameState.speed;
                    
                    if (segment.position.z > gameState.segmentLength) {
                        segment.position.z -= gameState.visibleSegments * gameState.segmentLength;
                    }
                });
                
                // Move obstacles
                for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
                    const obstacle = gameState.obstacles[i];
                    obstacle.position.z += gameState.speed;
                    
                    if (obstacle.position.z > 10) {
                        scene.remove(obstacle);
                        gameState.obstacles.splice(i, 1);
                    }
                }
                
                // Move coins
                for (let i = gameState.coins.length - 1; i >= 0; i--) {
                    const coin = gameState.coins[i];
                    coin.position.z += gameState.speed;
                    coin.rotation.z += 0.05;
                    
                    if (coin.position.z > 10) {
                        scene.remove(coin);
                        gameState.coins.splice(i, 1);
                    }
                }
                
                // Update particles
                for (let i = gameState.particles.length - 1; i >= 0; i--) {
                    const particle = gameState.particles[i];
                    particle.position.add(particle.userData.velocity);
                    particle.userData.velocity.y -= 0.01;
                    particle.userData.life -= 0.02;
                    particle.material.opacity = particle.userData.life;
                    
                    if (particle.userData.life <= 0) {
                        scene.remove(particle);
                        gameState.particles.splice(i, 1);
                    }
                }
                
                // Spawn objects
                if (Math.random() < 0.02) {
                    spawnObjects();
                }
                
                // Check collisions
                checkCollisions();
                
                // Update score
                gameState.score += Math.floor(gameState.speed * 10);
                
                // Update HUD
                document.getElementById('score').textContent = `SCORE: ${gameState.score}`;
                document.getElementById('speed').textContent = `SPEED: ${gameState.speed.toFixed(1)}x`;
            }
            
            renderer.render(scene, camera);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
