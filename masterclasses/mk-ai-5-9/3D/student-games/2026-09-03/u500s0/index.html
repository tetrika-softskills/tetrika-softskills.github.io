<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>NULL.EXE // Endless Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a2e;
    font-family: 'Courier New', monospace;
    color: #00ffcc;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 18px 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    z-index: 10;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #cc44ff, 0 0 2px #00ffcc;
  }
  #hud .block {
    background: rgba(10, 10, 46, 0.55);
    border: 1px solid #cc44ff;
    padding: 8px 14px;
    box-shadow: 0 0 12px rgba(204, 68, 255, 0.4), inset 0 0 10px rgba(0, 255, 204, 0.1);
  }
  #hud .label { color: #cc44ff; font-size: 10px; opacity: 0.8; }
  #hud .value { color: #00ffcc; font-size: 20px; font-weight: bold; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: radial-gradient(ellipse at center, rgba(10,10,46,0.85) 0%, rgba(5,5,20,0.98) 100%);
    z-index: 20;
    text-align: center;
    transition: opacity 0.5s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #title {
    font-size: clamp(36px, 8vw, 80px);
    font-weight: 900;
    letter-spacing: 8px;
    color: #cc44ff;
    text-shadow:
      0 0 10px #cc44ff,
      0 0 25px #cc44ff,
      0 0 50px #00ffcc,
      2px 2px 0 #00ffcc;
    margin-bottom: 10px;
    animation: glitch 3s infinite;
  }
  #subtitle {
    font-size: 14px;
    color: #00ffcc;
    letter-spacing: 6px;
    margin-bottom: 40px;
    text-shadow: 0 0 8px #00ffcc;
  }
  #message {
    font-size: 18px;
    color: #00ffcc;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px #00ffcc;
    min-height: 24px;
  }
  #startBtn {
    background: transparent;
    border: 2px solid #cc44ff;
    color: #00ffcc;
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 4px;
    padding: 14px 40px;
    cursor: pointer;
    text-shadow: 0 0 8px #00ffcc;
    box-shadow: 0 0 20px rgba(204,68,255,0.5), inset 0 0 20px rgba(0,255,204,0.1);
    transition: all 0.2s ease;
  }
  #startBtn:hover {
    background: rgba(204,68,255,0.2);
    box-shadow: 0 0 30px rgba(204,68,255,0.9), inset 0 0 30px rgba(0,255,204,0.3);
    transform: scale(1.05);
  }
  #controls {
    margin-top: 30px;
    font-size: 11px;
    color: #cc44ff;
    letter-spacing: 2px;
    line-height: 1.8;
    opacity: 0.8;
  }
  #controls span { color: #00ffcc; }

  @keyframes glitch {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-2px, 1px); }
    40% { transform: translate(2px, -1px); }
    60% { transform: translate(-1px, -1px); }
    80% { transform: translate(1px, 2px); }
  }

  .scanlines::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 204, 0.03) 0px,
      rgba(0, 255, 204, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 15;
  }
</style>
</head>
<body class="scanlines">

<div id="hud">
  <div class="block">
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="block">
    <div class="label">SPEED</div>
    <div class="value" id="speed">0.0</div>
  </div>
  <div class="block">
    <div class="label">CHIPS</div>
    <div class="value" id="chips">0</div>
  </div>
</div>

<div id="overlay">
  <div id="title">NULL.EXE</div>
  <div id="subtitle">// DIGITAL RUNNER //</div>
  <div id="message">ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ...</div>
  <button id="startBtn">ЗАПУСК</button>
  <div id="controls">
    <span>←/→</span> или <span>A/D</span> — СМЕНА ПОЛОСЫ<br/>
    <span>SPACE</span> / <span>W</span> / <span>↑</span> — ПРЫЖОК<br/>
    МОБИЛЬНО: СВАЙПЫ
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============ CORE SETUP ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a2e);
scene.fog = new THREE.FogExp2(0x0a0a2e, 0.025);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 4.5, -8);
camera.lookAt(0, 1.5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ LIGHTING ============
const ambient = new THREE.AmbientLight(0x2233aa, 0.6);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xcc44ff, 1.2);
dirLight.position.set(-5, 10, 5);
scene.add(dirLight);

const boardLight = new THREE.PointLight(0xcc44ff, 2.5, 12, 2);
boardLight.position.set(0, 0.3, 0);
scene.add(boardLight);

const cyanLight = new THREE.PointLight(0x00ffcc, 1.5, 20, 2);
cyanLight.position.set(0, 5, 5);
scene.add(cyanLight);

// ============ MATERIALS ============
const matRoad = new THREE.MeshStandardMaterial({
  color: 0x0a0a1a, roughness: 0.8, metalness: 0.2,
  emissive: 0x110022, emissiveIntensity: 0.3
});
const matLine = new THREE.MeshBasicMaterial({ color: 0xcc44ff });
const matWall = new THREE.MeshStandardMaterial({
  color: 0x0a0a2e, roughness: 0.6, metalness: 0.5,
  emissive: 0x220044, emissiveIntensity: 0.4
});
const matBarrier = new THREE.MeshBasicMaterial({ color: 0xcc44ff });
const matObstacle = new THREE.MeshStandardMaterial({
  color: 0x330011, emissive: 0xff2244, emissiveIntensity: 1.2,
  roughness: 0.4, metalness: 0.8
});
const matObstaclePurple = new THREE.MeshStandardMaterial({
  color: 0x220033, emissive: 0xcc44ff, emissiveIntensity: 1.0,
  roughness: 0.4, metalness: 0.8
});
const matChip = new THREE.MeshBasicMaterial({
  color: 0x00ffcc, transparent: true, opacity: 0.9
});
const matBoard = new THREE.MeshStandardMaterial({
  color: 0x1a0a2e, emissive: 0xcc44ff, emissiveIntensity: 0.9,
  roughness: 0.3, metalness: 0.9
});

// ============ GAME STATE ============
const LANES = [-3, 0, 3];
const SEGMENT_LENGTH = 40;
const VISIBLE_SEGMENTS = 6;
const state = {
  running: false,
  gameOver: false,
  speed: 0,
  baseSpeed: 18,
  maxSpeed: 55,
  accel: 0.4,
  score: 0,
  chips: 0,
  lane: 1,
  targetX: 0,
  playerY: 0,
  vy: 0,
  jumping: false,
  gravity: -32,
  jumpForce: 13,
  distance: 0,
  time: 0
};

// ============ PLAYER ============
const player = new THREE.Group();
player.position.set(0, 0, 0);
scene.add(player);

let playerModel = null;
const playerBaseY = 0.0;
const PLAYER_HEIGHT = 2.0;

// Hoverboard
const board = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 0.15, 2.6),
  matBoard
);
board.position.y = 0.3;
player.add(board);

const boardGlow = new THREE.Mesh(
  new THREE.BoxGeometry(1.3, 0.05, 2.7),
  new THREE.MeshBasicMaterial({ color: 0xcc44ff, transparent: true, opacity: 0.5 })
);
boardGlow.position.y = 0.22;
player.add(boardGlow);

// Fallback capsule (used until GLB loads or as permanent fallback)
const fallbackBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 1.0, 6, 12),
  new THREE.MeshStandardMaterial({
    color: 0x110022, emissive: 0xcc44ff, emissiveIntensity: 0.5,
    roughness: 0.4, metalness: 0.7
  })
);
fallbackBody.position.y = 1.1;
player.add(fallbackBody);

// Try to load GLB
const loader = new GLTFLoader();
loader.load(
  'player_game.glb',
  (gltf) => {
    playerModel = gltf.scene;
    const box = new THREE.Box3().setFromObject(playerModel);
    const size = box.getSize(new THREE.Vector3());
    const scale = PLAYER_HEIGHT / size.y;
    playerModel.scale.setScalar(scale);
    const newBox = new THREE.Box3().setFromObject(playerModel);
    const center = newBox.getCenter(new THREE.Vector3());
    playerModel.position.x -= center.x;
    playerModel.position.z -= center.z;
    playerModel.position.y = 0.4 - newBox.min.y;
    playerModel.traverse(o => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.emissive = new THREE.Color(0xcc44ff);
        o.material.emissiveIntensity = 0.3;
      }
    });
    player.add(playerModel);
    fallbackBody.visible = false;
    console.log('[NULL.EXE] player_game.glb loaded');
  },
  undefined,
  (err) => {
    console.warn('[NULL.EXE] player_game.glb not found, using fallback capsule');
  }
);

// ============ ROAD SEGMENTS ============
const segments = [];
const segmentPool = [];

function createSegment() {
  const seg = new THREE.Group();
  seg.userData = {
    obstacles: [],
    chips: [],
    walls: [],
    lines: [],
    hasObstacles: false
  };

  // Road plane
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(10, SEGMENT_LENGTH),
    matRoad
  );
  road.rotation.x = -Math.PI / 2;
  road.position.z = SEGMENT_LENGTH / 2;
  seg.add(road);

  // Lane lines (2 dashed purple lines)
  for (let i = 0; i < 2; i++) {
    const x = LANES[i] + 1.5;
    for (let j = 0; j < 8; j++) {
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(0.12, 2.5),
        matLine
      );
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.02, j * 5 + 1);
      seg.add(line);
      seg.userData.lines.push(line);
    }
  }

  // Side barriers (neon walls)
  for (let side = -1; side <= 1; side += 2) {
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 2.5, SEGMENT_LENGTH),
      matWall
    );
    wall.position.set(side * 5.5, 1.25, SEGMENT_LENGTH / 2);
    seg.add(wall);
    seg.userData.walls.push(wall);

    // Neon barrier strip
    const barrier = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.2, SEGMENT_LENGTH),
      matBarrier
    );
    barrier.position.set(side * 5.5, 1.8, SEGMENT_LENGTH / 2);
    seg.add(barrier);
    seg.userData.walls.push(barrier);

    // Vertical neon posts
    for (let p = 0; p < 4; p++) {
      const post = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 2.5, 0.15),
        matBarrier
      );
      post.position.set(side * 5.5, 1.25, p * 10 + 5);
      seg.add(post);
      seg.userData.walls.push(post);
    }
  }

  return seg;
}

function populateSegment(seg, index) {
  // Clear old
  seg.userData.obstacles.forEach(o => seg.remove(o));
  seg.userData.chips.forEach(c => seg.remove(c));
  seg.userData.obstacles.length = 0;
  seg.userData.chips.length = 0;

  if (index < 2) return; // first segments empty

  // Obstacles
  const obstacleCount = Math.floor(1 + Math.random() * 2);
  const usedLanes = new Set();
  for (let i = 0; i < obstacleCount; i++) {
    let lane;
    do { lane = Math.floor(Math.random() * 3); } while (usedLanes.has(lane) && usedLanes.size < 2);
    usedLanes.add(lane);

    const zPos = 5 + Math.random() * (SEGMENT_LENGTH - 10);
    const isDrone = Math.random() < 0.5;

    let obs;
    if (isDrone) {
      // Drone: sphere + ring
      obs = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 12, 12),
        Math.random() < 0.5 ? matObstacle : matObstaclePurple
      );
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.8, 0.08, 8, 16),
        new THREE.MeshBasicMaterial({ color: 0xff2244 })
      );
      ring.rotation.x = Math.PI / 2;
      obs.add(core);
      obs.add(ring);
      obs.position.set(LANES[lane], 1.5, zPos);
      obs.userData.type = 'drone';
      obs.userData.radius = 0.8;
      obs.userData.baseY = 1.5;
    } else {
      // Barrier: low wall
      obs = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 1.4, 0.6),
        Math.random() < 0.5 ? matObstacle : matObstaclePurple
      );
      obs.position.set(LANES[lane], 0.7, zPos);
      obs.userData.type = 'barrier';
      obs.userData.radius = 1.0;
    }
    seg.add(obs);
    seg.userData.obstacles.push(obs);
  }

  // Chips line
  if (Math.random() < 0.7) {
    const chipLane = Math.floor(Math.random() * 3);
    if (!usedLanes.has(chipLane)) {
      const chipCount = 3 + Math.floor(Math.random() * 4);
      const startZ = 3 + Math.random() * 5;
      const elevated = Math.random() < 0.3;
      for (let i = 0; i < chipCount; i++) {
        const chip = new THREE.Group();
        const disc = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16),
          matChip
        );
        disc.rotation.x = Math.PI / 2;
        const inner = new THREE.Mesh(
          new THREE.RingGeometry(0.12, 0.22, 12),
          new THREE.MeshBasicMaterial({ color: 0xcc44ff, side: THREE.DoubleSide })
        );
        chip.add(disc);
        chip.add(inner);
        chip.position.set(LANES[chipLane], elevated ? 2.0 : 1.0, startZ + i * 1.5);
        chip.userData.type = 'chip';
        chip.userData.radius = 0.5;
        seg.add(chip);
        seg.userData.chips.push(chip);
      }
    }
  }
}

function initRoad() {
  for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
    const seg = createSegment();
    seg.position.z = i * SEGMENT_LENGTH;
    populateSegment(seg, i);
    scene.add(seg);
    segments.push(seg);
  }
}

function recycleSegment() {
  const seg = segments.shift();
  seg.userData.obstacles.forEach(o => seg.remove(o));
  seg.userData.chips.forEach(c => seg.remove(c));
  seg.userData.obstacles.length = 0;
  seg.userData.chips.length = 0;

  const lastZ = segments[segments.length - 1].position.z;
  seg.position.z = lastZ + SEGMENT_LENGTH;
  populateSegment(seg, VISIBLE_SEGMENTS);
  segments.push(seg);
}

// ============ PARTICLES ============
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.1, 6, 6);

function spawnParticles(pos, color, count = 20) {
  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(
      particleGeo,
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random() - 0.5) * 8,
      Math.random() * 6 + 2,
      (Math.random() - 0.5) * 8
    );
    p.userData.life = 1.0;
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.vel.y -= 15 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    p.userData.life -= dt * 1.5;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.setScalar(p.userData.life);
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ============ BACKGROUND STARS ============
const starGeo = new THREE.BufferGeometry();
const starCount = 400;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 200;
  starPos[i * 3 + 1] = Math.random() * 60 + 5;
  starPos[i * 3 + 2] = Math.random() * 200;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.3, transparent: true, opacity: 0.6 })
);
scene.add(stars);

// ============ INPUT ============
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!state.running && !state.gameOver) return;
  if (state.gameOver) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
  if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// Touch / swipe
let touchStartX = 0, touchStartY = 0;
addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
addEventListener('touchend', e => {
  if (!state.running || state.gameOver) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 30) changeLane(dx > 0 ? 1 : -1);
  } else {
    if (dy < -30) jump();
  }
}, { passive: true });

function changeLane(dir) {
  const newLane = Math.max(0, Math.min(2, state.lane + dir));
  if (newLane !== state.lane) {
    state.lane = newLane;
    state.targetX = LANES[state.lane];
  }
}

function jump() {
  if (!state.jumping) {
    state.jumping = true;
    state.vy = state.jumpForce;
  }
}

// ============ GAME FLOW ============
const overlay = document.getElementById('overlay');
const title = document.getElementById('title');
const message = document.getElementById('message');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');
const chipsEl = document.getElementById('chips');

function resetGame() {
  state.running = true;
  state.gameOver = false;
  state.speed = state.baseSpeed;
  state.score = 0;
  state.chips = 0;
  state.lane = 1;
  state.targetX = 0;
  state.playerY = 0;
  state.vy = 0;
  state.jumping = false;
  state.distance = 0;
  state.time = 0;
  player.position.set(0, 0, 0);

  // Reset segments
  segments.forEach((s, i) => {
    s.position.z = i * SEGMENT_LENGTH;
    populateSegment(s, i);
  });

  overlay.classList.add('hidden');
}

function gameOver() {
  state.running = false;
  state.gameOver = true;
  spawnParticles(player.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xff2244, 40);
  spawnParticles(player.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xcc44ff, 30);

  title.textContent = 'SYSTEM CRASH';
  title.style.color = '#ff2244';
  title.style.textShadow = '0 0 10px #ff2244, 0 0 25px #ff2244, 0 0 50px #cc44ff';
  message.innerHTML = `SCORE: <span style="color:#00ffcc">${Math.floor(state.score)}</span> &nbsp; CHIPS: <span style="color:#00ffcc">${state.chips}</span>`;
  startBtn.textContent = 'ПЕРЕЗАГРУЗКА';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click', () => {
  title.textContent = 'NULL.EXE';
  title.style.color = '#cc44ff';
  title.style.textShadow = '0 0 10px #cc44ff, 0 0 25px #cc44ff, 0 0 50px #00ffcc, 2px 2px 0 #00ffcc';
  resetGame();
});

// ============ COLLISIONS ============
function checkCollisions() {
  const px = player.position.x;
  const py = player.position.y;
  const pz = player.position.z;

  for (const seg of segments) {
    const segZ = seg.position.z;

    for (const obs of seg.userData.obstacles) {
      const oz = segZ + obs.position.z;
      const dz = oz - pz;
      if (Math.abs(dz) > 2) continue;
      const dx = obs.position.x - px;
      const dy = (obs.userData.baseY || obs.position.y) - (py + 1.0);
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (dist < obs.userData.radius + 0.6) {
        gameOver();
        return;
      }
    }

    for (let i = seg.userData.chips.length - 1; i >= 0; i--) {
      const chip = seg.userData.chips[i];
      const cz = segZ + chip.position.z;
      const dz = cz - pz;
      if (Math.abs(dz) > 1.5) continue;
      const dx = chip.position.x - px;
      const dy = chip.position.y - (py + 1.0);
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (dist < chip.userData.radius + 0.5) {
        spawnParticles(chip.position.clone().add(new THREE.Vector3(0, 0, segZ)), 0x00ffcc, 12);
        seg.remove(chip);
        seg.userData.chips.splice(i, 1);
        state.chips++;
        state.score += 50;
      }
    }
  }
}

// ============ MAIN LOOP ============
initRoad();

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (state.running) {
    state.time += dt;

    // Speed up
    state.speed = Math.min(state.maxSpeed, state.speed + state.accel * dt);

    // Move world
    const move = state.speed * dt;
    state.distance += move;
    state.score += move * 0.5;

    for (const seg of segments) {
      seg.position.z -= move;
    }

    // Recycle
    while (segments[0].position.z + SEGMENT_LENGTH < -5) {
      recycleSegment();
    }

    // Animate obstacles (drones bob)
    for (const seg of segments) {
      for (const obs of seg.userData.obstacles) {
        if (obs.userData.type === 'drone') {
          obs.position.y = obs.userData.baseY + Math.sin(elapsed * 3 + obs.position.z) * 0.3;
          obs.rotation.y += dt * 2;
        }
      }
      for (const chip of seg.userData.chips) {
        chip.rotation.y += dt * 3;
        chip.rotation.z = Math.sin(elapsed * 2 + chip.position.z) * 0.3;
      }
    }

    // Player lane movement (smooth)
    const dx = state.targetX - player.position.x;
    player.position.x += dx * Math.min(1, dt * 12);

    // Jump physics
    if (state.jumping) {
      state.vy += state.gravity * dt;
      state.playerY += state.vy * dt;
      if (state.playerY <= 0) {
        state.playerY = 0;
        state.vy = 0;
        state.jumping = false;
      }
    }
    player.position.y = state.playerY;

    // Hover bob
    const bob = Math.sin(elapsed * 4) * 0.08;
    board.position.y = 0.3 + bob;
    boardGlow.position.y = 0.22 + bob;
    board.rotation.z = -dx * 0.15;

    // Board light follow
    boardLight.position.set(player.position.x, 0.3 + state.playerY, 0);

    // Camera follow
    camera.position.x += (player.position.x * 0.3 - camera.position.x) * Math.min(1, dt * 3);
    camera.position.y = 4.5 + state.playerY * 0.3;

    // Stars parallax
    stars.position.z = (stars.position.z - move * 0.3) % 200;

    // Collisions
    checkCollisions();

    // HUD
    scoreEl.textContent = Math.floor(state.score);
    speedEl.textContent = state.speed.toFixed(1);
    chipsEl.textContent = state.chips;
  }

  // Animate particles always
  updateParticles(dt);

  // Animate lines pulse
  matLine.color.setHSL((elapsed * 0.1) % 1, 1, 0.6);

  renderer.render(scene, camera);
}

animate();
</script>
