<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NULL.EXE — Endless Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a2e;font-family:'Courier New',monospace;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;width:100%;padding:16px 20px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}

.hud-item span{color:#cc44ff}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(10,10,46,.93);z-index:100;transition:opacity .5s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:58px;color:#cc44ff;text-shadow:0 0 20px #cc44ff,0 0 40px #cc44ff,0 0 80px #cc44ff;margin-bottom:8px;letter-spacing:4px}
#overlay h2{font-size:20px;color:#00ffcc;text-shadow:0 0 10px #00ffcc;margin-bottom:30px;opacity:.8}

#overlay .subtitle kbd{display:inline-block;background:rgba(204,68,255,.15);border:1px solid #cc44ff;border-radius:3px;padding:2px 8px;margin:0 2px;color:#cc44ff;font-size:12px}

#finalScore{font-size:28px;color:#00ffcc;text-shadow:0 0 12px #00ffcc;margin:16px 0}
#lane-indicator{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:none;z-index:10}
.lane-dot{width:12px;height:12px;border-radius:50%;background:rgba(204,68,255,.3);border:1px solid #cc44ff;transition:all .2s}

</style>

<body>

<div id="hud">
  <div class="hud-item">SCORE: <span id="scoreVal">0</span></div>
  <div class="hud-item">SPEED: <span id="speedVal">1.0</span>x</div>
  <div class="hud-item">COINS: <span id="coinVal">0</span></div>
</div>

<div id="overlay">
  <h1>NULL.EXE</h1>
  <h2>// DIGITAL VOID RUNNER //</h2>
  <div class="subtitle">
    <kbd>A</kbd> <kbd>←</kbd> — влево &nbsp;&nbsp;|&nbsp;&nbsp; <kbd>D</kbd> <kbd>→</kbd> — вправо<br>
    <kbd>SPACE</kbd> <kbd>W</kbd> <kbd>↑</kbd> — прыжок &nbsp;&nbsp;|&nbsp;&nbsp; Свайпы на мобильных
  </div>
  <div id="finalScore" style="display:none"></div>
  <button id="startBtn">INITIALIZE</button>
</div>

<div id="lane-indicator">
  <div class="lane-dot" id="dot0"></div>
  <div class="lane-dot active" id="dot1"></div>
  <div class="lane-dot" id="dot2"></div>
</div>

<div id="controls-hint">← A | D → — полосы &nbsp;|&nbsp; SPACE — прыжок &nbsp;|&nbsp; Swipe</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ===== CONFIG ===== */
const C = {
  lanes: [-3, 0, 3],
  startSpeed: 0.25,
  maxSpeed: 1.0,
  speedInc: 0.00008,
  jumpForce: 0.26,
  gravity: 0.011,
  segLen: 40,
  viewDist: 220,
  recycleDist: -40,
  obsMinGap: 18,
  coinChance: 0.45,
  playerH: 2.0,
  baseY: 0.5,
  laneSwitchDuration: 0.18, // время плавного перехода между полосами (сек)
};

/* ===== STATE ===== */
let scene, camera, renderer, clock;
let player, hoverboard, playerModel = null;
let state = 'menu';
let score = 0, coins = 0, speed = C.startSpeed;
let curLane = 1;
let velY = 0, jumping = false;
let segs = [], obs = [], coinArr = [], parts = [];
let lastSpawnZ = 30;

/* ===== INPUT STATE ===== */
let laneTransitionTime = 0; // таймер перехода
let isTransitioning = false; // блокировка во время анимации
let inputBuffer = 0; // -1, 0, 1 — buffered input
let bufferTimeout = null;

let touchSX = 0, touchSY = 0, touchST = 0;

/* ===== INIT ===== */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a2e);
  scene.fog = new THREE.FogExp2(0x0a0a2e, 0.009);

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 400);
  camera.position.set(0, 5, -8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();
  setupLights();
  createPlayer();
  buildRoad(0, 320);
  setupControls();
  addEventListener('resize', onResize);
  animate();
}

function setupLights() {
  scene.add(new THREE.AmbientLight(0x1a1a6e, 0.7));

  const dir = new THREE.DirectionalLight(0xcc44ff, 0.9);
  dir.position.set(5, 20, 10);
  dir.castShadow = true;
  const s = dir.shadow;
  s.mapSize.set(1024, 1024);
  s.camera.near = 1; s.camera.far = 80;
  s.camera.left = -15; s.camera.right = 15;
  s.camera.top = 15; s.camera.bottom = -15;
  scene.add(dir);

  scene.add(new THREE.HemisphereLight(0x1a1a6e, 0x0a0a2e, 0.3));
}

/* ===== PLAYER ===== */
function createPlayer() {
  player = new THREE.Group();

  const bGeo = new THREE.BoxGeometry(1.2, 0.1, 2.4);
  const bMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, emissive: 0xcc44ff, emissiveIntensity: 0.9, metalness: 0.9, roughness: 0.2 });
  hoverboard = new THREE.Mesh(bGeo, bMat);
  player.add(hoverboard);

  const eMat = new THREE.MeshStandardMaterial({ color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 1.8, transparent: true, opacity: 0.55 });
  const edge = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.04, 2.5), eMat);
  edge.position.y = -0.04;
  player.add(edge);

  const bl = new THREE.PointLight(0xcc44ff, 2.5, 10);
  bl.position.set(0, -0.4, 0);
  player.add(bl);

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.32, 0.9, 8, 16),
    new THREE.MeshStandardMaterial({ color: 0x1a1a3e, emissive: 0x220044, emissiveIntensity: 0.3, metalness: 0.7, roughness: 0.3 })
  );
  body.position.y = 0.95;
  body.castShadow = true;
  body.name = 'fallbackBody';
  player.add(body);

  const visor = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.2, metalness: 1, roughness: 0, transparent: true, opacity: 0.85 })
  );
  visor.position.set(0, 1.4, 0.12);
  visor.rotation.x = Math.PI / 6;
  visor.name = 'fallbackVisor';
  player.add(visor);

  player.position.set(C.lanes[1], C.baseY, 0);
  scene.add(player);

  new GLTFLoader().load('player_game.glb', gltf => {
    playerModel = gltf.scene;
    const box = new THREE.Box3().setFromObject(playerModel);
    const sz = box.getSize(new THREE.Vector3());
    playerModel.scale.multiplyScalar(C.playerH / sz.y);
    playerModel.position.y = 0.15;
    playerModel.traverse(ch => {
      if (ch.isMesh) {
        ch.castShadow = true;
        if (ch.material) { ch.material.emissive = new THREE.Color(0x220044); ch.material.emissiveIntensity = 0.2; }
      }
    });
    const fb = player.getObjectByName('fallbackBody');
    const fv = player.getObjectByName('fallbackVisor');
    if (fb) player.remove(fb);
    if (fv) player.remove(fv);
    player.add(playerModel);
  }, undefined, () => {});
}

/* ===== ROAD ===== */
function buildSegment(z) {
  const g = new THREE.Group();
  g.userData.zStart = z;
  g.userData.zEnd = z + C.segLen;

  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(10, C.segLen),
    new THREE.MeshStandardMaterial({ color: 0x0d0d2a, metalness: 0.5, roughness: 0.8 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0, z + C.segLen / 2);
  road.receiveShadow = true;
  g.add(road);

  const lMat = new THREE.MeshStandardMaterial({ color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 1.5, transparent: true, opacity: 0.65 });
  for (let i = -1; i <= 1; i++) {
    const l = new THREE.Mesh(new THREE.PlaneGeometry(0.07, C.segLen), lMat);
    l.rotation.x = -Math.PI / 2;
    l.position.set(i * 3, 0.01, z + C.segLen / 2);
    g.add(l);
  }

  const dMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.0, transparent: true, opacity: 0.45 });
  for (let d = 0; d < C.segLen; d += 4) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 1.4), dMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(0, 0.015, z + d + 0.7);
    g.add(dash);
  }

  const wMat = new THREE.MeshStandardMaterial({ color: 0x0a0a2e, metalness: 0.8, roughness: 0.3 });
  const s1Mat = new THREE.MeshStandardMaterial({ color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 2.2, transparent: true, opacity: 0.9 });
  const s2Mat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.6, transparent: true, opacity: 0.7 });

  for (let side = -1; side <= 1; side += 2) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.5, C.segLen), wMat);
    w.position.set(side * 5.6, 1.75, z + C.segLen / 2);
    w.castShadow = true;
    g.add(w);

    const s1 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, C.segLen), s1Mat);
    s1.position.set(side * 5.42, 1.0, z + C.segLen / 2);
    g.add(s1);

    const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, C.segLen), s2Mat);
    s2.position.set(side * 5.42, 2.6, z + C.segLen / 2);
    g.add(s2);
  }

  scene.add(g);
  segs.push(g);
}

function buildRoad(fromZ, toZ) {
  let z = fromZ;
  while (z < toZ) { buildSegment(z); z += C.segLen; }
}

/* ===== OBSTACLES ===== */
function spawnObs(z) {
  const lane = Math.floor(Math.random() * 3);
  const isDrone = Math.random() > 0.45;
  const g = new THREE.Group();

  if (isDrone) {
    const b = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.55, 0),
      new THREE.MeshStandardMaterial({ color: 0x2a0a0a, emissive: 0xff2244, emissiveIntensity: 0.9, metalness: 0.9, roughness: 0.2 })
    );
    b.castShadow = true;
    g.add(b);

    for (let a = 0; a < 4; a++) {
      const arm = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.04, 0.04),
        new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xff2244, emissiveIntensity: 0.4 })
      );
      arm.rotation.y = (a * Math.PI) / 2;
      arm.position.y = 0.08;
      g.add(arm);
    }

    const dl = new THREE.PointLight(0xff2244, 1.2, 6);
    dl.position.y = -0.2;
    g.add(dl);

    g.position.set(C.lanes[lane], 1.2, z);
    g.userData.type = 'drone';
    g.userData.baseY = 1.2;
    g.userData.radius = 0.7;
  } else {
    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 1.6, 0.35),
      new THREE.MeshStandardMaterial({ color: 0x1a0a2e, emissive: 0xcc44ff, emissiveIntensity: 0.7, metalness: 0.8, roughness: 0.3 })
    );
    bar.castShadow = true;
    g.add(bar);

    const stMat = new THREE.MeshStandardMaterial({ color: 0xff2244, emissive: 0xff2244, emissiveIntensity: 1.6 });
    for (let s = -1; s <= 1; s++) {
      const st = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.4), stMat);
      st.position.y = s * 0.5;
      g.add(st);
    }

    g.position.set(C.lanes[lane], 0.8, z);
    g.userData.type = 'barrier';
    g.userData.radius = 1.0;
  }

  g.userData.lane = lane;
  g.userData.active = true;
  scene.add(g);
  obs.push(g);
}

function spawnCoin(z) {
  const lane = Math.floor(Math.random() * 3);
  const g = new THREE.Group();

  const chip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.32, 0.07, 6),
    new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.6, metalness: 1, roughness: 0, transparent: true, opacity: 0.85 })
  );
  chip.rotation.x = Math.PI / 2;
  g.add(chip);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.18, 0.025, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 2.0, transparent: true, opacity: 0.9 })
  );
  g.add(ring);

  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.45, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.12 })
  );
  g.add(glow);

  g.position.set(C.lanes[lane], 1.4, z);
  g.userData.active = true;
  g.userData.lane = lane;
  scene.add(g);
  coinArr.push(g);
}

function generateContent() {
  const pz = player.position.z;
  while (lastSpawnZ < pz + 180) {
    lastSpawnZ += C.obsMinGap + Math.random() * 12;
    if (Math.random() < 0.75) spawnObs(lastSpawnZ);
    if (Math.random() < C.coinChance) {
      const cz = lastSpawnZ + 6 + Math.random() * 6;
      const n = 1 + Math.floor(Math.random() * 3);
      for (let c = 0; c < n; c++) spawnCoin(cz + c * 2.2);
    }
  }
}

/* ===== PARTICLES ===== */
function emitParts(pos, color, count) {
  for (let i = 0; i < count; i++) {
    const r = 0.04 + Math.random() * 0.08;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(r, 4, 4),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    m.position.copy(pos);
    m.userData.vel = new THREE.Vector3((Math.random() - 0.5) * 0.3, Math.random() * 0.2 + 0.1, (Math.random() - 0.5) * 0.3);
    m.userData.life = 1;
    m.userData.decay = 0.018 + Math.random() * 0.025;
    scene.add(m);
    parts.push(m);
  }
}

function tickParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.position.add(p.userData.vel);
    p.userData.vel.y -= 0.004;
    p.userData.life -= p.userData.decay;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.multiplyScalar(0.97);
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      parts.splice(i, 1);
    }
  }
}

/* ===== COLLISION ===== */
function checkCollisions() {
  const px = player.position.x;
  const py = player.position.y;
  const pz = player.position.z;

  for (const o of obs) {
    if (!o.userData.active) continue;
    const dx = Math.abs(px - o.position.x);
    const dz = Math.abs(pz - o.position.z);
    const dy = Math.abs(py - o.position.y);
    const r = o.userData.radius || 0.8;
    if (dx < r && dz < r * 1.2 && dy < r * 1.3) {
      o.userData.active = false;
      emitParts(o.position.clone(), 0xff2244, 25);
      emitParts(o.position.clone(), 0xcc44ff, 15);
      gameOver();
      return;
    }
  }

  for (let i = coinArr.length - 1; i >= 0; i--) {
    const c = coinArr[i];
    if (!c.userData.active) continue;
    const dx = px - c.position.x;
    const dy = py + 0.8 - c.position.y;
    const dz = pz - c.position.z;
    if (dx * dx + dy * dy + dz * dz < 2.0) {
      c.userData.active = false;
      coins++;
      score += 50;
      emitParts(c.position.clone(), 0x00ffcc, 10);
      emitParts(c.position.clone(), 0xcc44ff, 6);
      scene.remove(c);
      coinArr.splice(i, 1);
    }
  }
}

/* ===== CLEANUP ===== */
function disposeGroup(g) {
  g.traverse(ch => {
    if (ch.geometry) ch.geometry.dispose();
    if (ch.material) {
      if (Array.isArray(ch.material)) ch.material.forEach(m => m.dispose());
      else ch.material.dispose();
    }
  });
  scene.remove(g);
}

function cleanup() {
  const pz = player.position.z;
  const behind = pz + C.recycleDist;
  const ahead = pz + C.viewDist;

  for (let i = segs.length - 1; i >= 0; i--) {
    if (segs[i].userData.zEnd < behind) { disposeGroup(segs[i]); segs.splice(i, 1); }
  }
  let maxZ = segs.length > 0 ? Math.max(...segs.map(s => s.userData.zEnd)) : 0;
  while (maxZ < ahead) { buildSegment(maxZ); maxZ += C.segLen; }

  for (let i = obs.length - 1; i >= 0; i--) {
    if (obs[i].position.z < behind) { disposeGroup(obs[i]); obs.splice(i, 1); }
  }
  for (let i = coinArr.length - 1; i >= 0; i--) {
    if (coinArr[i].position.z < behind) { disposeGroup(coinArr[i]); coinArr.splice(i, 1); }
  }
}

/* ===== CONTROLS ===== */
function setupControls() {
  // Keyboard
  addEventListener('keydown', e => {
    if (state !== 'playing') return;
    
    // Left: A or ArrowLeft
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      e.preventDefault();
      requestLaneChange(-1);
    }
    // Right: D or ArrowRight
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      e.preventDefault();
      requestLaneChange(1);
    }
    // Jump
    else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      jump();
    }
  });

  // Touch
  addEventListener('touchstart', e => {
    touchSX = e.touches[0].clientX;
    touchSY = e.touches[0].clientY;
    touchST = performance.now();
  }, { passive: true });

  addEventListener('touchend', e => {
    if (state !== 'playing') return;
    const dx = e.changedTouches[0].clientX - touchSX;
    const dy = e.changedTouches[0].clientY - touchSY;
    const dt = performance.now() - touchST;

    // Quick tap = jump
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20 && dt < 250) {
      jump();
      return;
    }

    // Swipe
    if (Math.abs(dx) > Math.abs(dy)) {
      // Horizontal swipe
      if (dx > 40) requestLaneChange(1);   // swipe RIGHT = move RIGHT
      else if (dx < -40) requestLaneChange(-1); // swipe LEFT = move LEFT
    } else {
      // Vertical swipe
      if (dy < -40) jump(); // swipe UP = jump
    }
  }, { passive: true });

  document.getElementById('startBtn').addEventListener('click', startGame);
}

/**
 * Запрос смены полосы с буферизацией ввода.
 * direction: -1 = влево, +1 = вправо
 * 
 * Логика:
 * - Если сейчас не переходим — начинаем переход немедленно
 * - Если переходим — буферизуем ввод, чтобы после завершения текущего
 *   перехода сразу начать следующий (защита от "залипания")
 */
function requestLaneChange(direction) {
  if (!isTransitioning) {
    // Можно начать переход сразу
    const newLane = curLane + direction;
    if (newLane >= 0 && newLane <= 2) {
      startLaneTransition(newLane);
    }
  } else {
    // Буферизуем — выполним после текущего перехода
    inputBuffer = direction;
    clearTimeout(bufferTimeout);
    bufferTimeout = setTimeout(() => { inputBuffer = 0; }, 300);
  }
}

function startLaneTransition(newLane) {
  curLane = newLane;
  isTransitioning = true;
  laneTransitionTime = 0;
  updateLaneIndicator();
}

function jump() {
  if (!jumping) {
    jumping = true;
    velY = C.jumpForce;
  }
}

function updateLaneIndicator() {
  for (let i = 0; i < 3; i++) {
    const dot = document.getElementById('dot' + i);
    if (dot) dot.classList.toggle('active', i === curLane);
  }
}

/* ===== GAME FLOW ===== */
function startGame() {
  obs.forEach(o => disposeGroup(o)); obs = [];
  coinArr.forEach(c => disposeGroup(c)); coinArr = [];
  parts.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); }); parts = [];
  segs.forEach(s => disposeGroup(s)); segs = [];

  state = 'playing';
  score = 0; coins = 0; speed = C.startSpeed;
  curLane = 1;
  velY = 0; jumping = false;
  lastSpawnZ = 30;
  isTransitioning = false;
  laneTransitionTime = 0;
  inputBuffer = 0;

  player.position.set(C.lanes[1], C.baseY, 0);
  player.rotation.set(0, 0, 0);

  buildRoad(-C.segLen, 320);
  updateLaneIndicator();

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('finalScore').style.display = 'none';
  document.getElementById('startBtn').textContent = 'INITIALIZE';
  document.querySelector('#overlay h2').textContent = '// DIGITAL VOID RUNNER //';
}

function gameOver() {
  state = 'gameover';
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.querySelector('h2').textContent = '// SYSTEM CRASHED //';
  const fs = document.getElementById('finalScore');
  fs.style.display = 'block';
  fs.textContent = `SCORE: ${score}  |  COINS: ${coins}`;
  document.getElementById('startBtn').textContent = 'REBOOT';
}

/* ===== ANIMATE ===== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // clamp delta
  const t = clock.getElapsedTime();

  if (state === 'playing') {
    // Forward movement
    player.position.z += speed;

    // Lane transition (smooth, time-based)
    const targetX = C.lanes[curLane];
    if (isTransitioning) {
      laneTransitionTime += dt;
      const progress = Math.min(laneTransitionTime / C.laneSwitchDuration, 1);
      // Smooth ease-out
      const eased = 1 - Math.pow(1 - progress, 3);
      player.position.x = THREE.MathUtils.lerp(player.position.x, targetX, eased * 0.3 + 0.05);
      
      if (progress >= 1 || Math.abs(player.position.x - targetX) < 0.01) {
        player.position.x = targetX;
        isTransitioning = false;
        
        // Process buffered input
        if (inputBuffer !== 0) {
          const newLane = curLane + inputBuffer;
          if (newLane >= 0 && newLane <= 2) {
            startLaneTransition(newLane);
          }
          inputBuffer = 0;
        }
      }
    } else {
      // Snap to target if close
      player.position.x += (targetX - player.position.x) * 0.2;
    }

    // Jump physics
    if (jumping) {
      velY -= C.gravity;
      player.position.y += velY;
      if (player.position.y <= C.baseY) {
        player.position.y = C.baseY;
        jumping = false;
        velY = 0;
      }
    }

    // Hoverboard bob
    hoverboard.position.y = Math.sin(t * 3.5) * 0.04;
    hoverboard.rotation.z = Math.sin(t * 2.5) * 0.025;

    // Tilt during lane change
    const tiltTarget = (targetX - player.position.x) * 0.15;
    player.rotation.z += (tiltTarget - player.rotation.z) * 0.12;

    // Speed up
    speed = Math.min(C.maxSpeed, speed + C.speedInc);
    score += Math.floor(speed * 2);

    generateContent();
    cleanup();
    checkCollisions();

    // Animate obstacles
    for (const o of obs) {
      if (!o.userData.active) continue;
      if (o.userData.type === 'drone') {
        o.rotation.y += 0.035;
        o.position.y = o.userData.baseY + Math.sin(t * 2.2 + o.position.z * 0.1) * 0.25;
      }
    }

    // Animate coins
    for (const c of coinArr) {
      if (!c.userData.active) continue;
      c.rotation.y += 0.05;
      c.position.y = 1.4 + Math.sin(t * 3 + c.position.z * 0.2) * 0.18;
    }

    // Camera
    const camX = player.position.x * 0.3;
    const camZ = player.position.z - 7.5;
    const camY = 4.5 + (player.position.y - C.baseY) * 0.3;
    camera.position.x += (camX - camera.position.x) * 0.06;
    camera.position.z += (camZ - camera.position.z) * 0.08;
    camera.position.y += (camY - camera.position.y) * 0.08;
    camera.lookAt(player.position.x * 0.4, 1.8, player.position.z + 12);

    // Shadow follow
    const dirLight = scene.children.find(c => c.isDirectionalLight);
    if (dirLight) {
      dirLight.position.set(player.position.x + 5, 20, player.position.z + 10);
      dirLight.target.position.set(player.position.x, 0, player.position.z);
      dirLight.target.updateMatrixWorld();
    }

    // HUD
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('speedVal').textContent = (speed / C.startSpeed).toFixed(1);
    document.getElementById('coinVal').textContent = coins;
  }

  tickParts();

  if (state === 'menu') {
    camera.position.set(Math.sin(t * 0.25) * 3, 4.5, -6 + Math.sin(t * 0.15) * 2);
    camera.lookAt(0, 1.2, 8);
  }

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

init();
</script>
