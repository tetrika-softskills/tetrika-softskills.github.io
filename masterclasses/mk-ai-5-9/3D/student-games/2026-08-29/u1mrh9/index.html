<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>NULL.EXE — Neon Runner</title>
<style>
  :root{
    --bg:#0a0a2e;
    --purple:#cc44ff;
    --cyan:#00ffcc;
    --red:#ff3366;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#e6e6ff;font-family:'Courier New',monospace}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* HUD */
  #hud{
    position:absolute;top:0;left:0;right:0;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;z-index:5;
    text-shadow:0 0 8px var(--purple),0 0 2px #fff;
  }
  .hud-box{
    background:rgba(10,10,46,0.55);
    border:1px solid rgba(204,68,255,0.45);
    box-shadow:0 0 12px rgba(204,68,255,0.35), inset 0 0 10px rgba(0,255,204,0.08);
    padding:8px 14px;border-radius:4px;
    letter-spacing:2px;font-size:14px;
  }
  .hud-box .label{font-size:10px;color:var(--cyan);opacity:.85}
  .hud-box .val{font-size:20px;color:#fff}
  #score .val{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
  #speed .val{color:var(--purple);text-shadow:0 0 10px var(--purple)}
  #coins .val{color:#ffe066;text-shadow:0 0 10px #ffcc33}

  /* Overlays */
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at center, rgba(10,10,46,0.85) 0%, rgba(10,10,46,0.98) 70%);
    z-index:10;transition:opacity .4s ease;text-align:center;padding:20px;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .title{
    font-size:clamp(36px,8vw,72px);letter-spacing:6px;
    color:#fff;
    text-shadow:0 0 8px var(--purple),0 0 20px var(--purple),0 0 40px var(--cyan);
    animation:flicker 3.2s infinite;
  }
  .subtitle{font-size:14px;letter-spacing:4px;color:var(--cyan);opacity:.85}
  .btn{
    pointer-events:auto;cursor:pointer;
    background:transparent;color:#fff;
    border:1px solid var(--purple);
    padding:12px 28px;letter-spacing:4px;font-family:inherit;font-size:16px;
    text-shadow:0 0 8px var(--purple);
    box-shadow:0 0 12px rgba(204,68,255,0.5), inset 0 0 12px rgba(204,68,255,0.2);
    transition:all .2s;
    border-radius:2px;
  }
  .btn:hover,.btn:active{
    background:rgba(204,68,255,0.15);
    box-shadow:0 0 20px var(--purple), inset 0 0 18px rgba(0,255,204,0.3);
    color:var(--cyan);
  }
  .hint{font-size:12px;letter-spacing:2px;color:#aab;opacity:.8;max-width:420px;line-height:1.6}
  .stats{font-size:14px;letter-spacing:2px;color:#fff}
  .stats span{color:var(--cyan)}
  @keyframes flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}
    20%,24%,55%{opacity:.55}
  }
  .scanlines{
    position:absolute;inset:0;pointer-events:none;z-index:4;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.15) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay;opacity:.4;
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
  }
  #flash{position:absolute;inset:0;background:rgba(255,51,102,0.0);pointer-events:none;z-index:6;transition:background .08s}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-box" id="score"><div class="label">SCORE</div><div class="val">0</div></div>
    <div class="hud-box" id="coins"><div class="label">CHIPS</div><div class="val">0</div></div>
    <div class="hud-box" id="speed"><div class="label">SPEED</div><div class="val">0.0</div></div>
  </div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div id="flash"></div>

  <div class="overlay" id="startOverlay">
    <div class="title">NULL.EXE</div>
    <div class="subtitle">// NEON RUNNER v1.0</div>
    <div class="hint">← → или A/D — смена полосы<br>↑ / W / SPACE — прыжок<br>На мобильном — свайпы</div>
    <button class="btn" id="startBtn">[ EXECUTE ]</button>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <div class="title" style="color:var(--red);text-shadow:0 0 8px var(--red),0 0 20px var(--red)">SYSTEM CRASH</div>
    <div class="stats">SCORE: <span id="finalScore">0</span></div>
    <div class="stats">CHIPS: <span id="finalCoins">0</span></div>
    <div class="stats">BEST: <span id="bestScore">0</span></div>
    <button class="btn" id="restartBtn">[ REBOOT ]</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============ CONFIG ============
const CFG = {
  lanes: [-2.2, 0, 2.2],
  startSpeed: 18,
  maxSpeed: 55,
  speedGrowth: 0.35,
  jumpVel: 12,
  gravity: 32,
  segLen: 40,
  segCount: 6,
  spawnDist: 140,
  despawnDist: -20,
  playerBaseY: 0.45,
  modelPath: 'player_game.glb',
  modelHeight: 2.0,
};

// ============ STATE ============
const state = {
  running:false,
  speed: CFG.startSpeed,
  distance: 0,
  score: 0,
  coins: 0,
  best: parseInt(localStorage.getItem('null_exe_best')||'0',10),
  lane: 1,
  targetX: 0,
  vy: 0,
  onGround: true,
  invuln: 0,
};

// ============ RENDERER / SCENE ============
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.insertBefore(renderer.domElement, app.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a2e);
scene.fog = new THREE.Fog(0x0a0a2e, 18, 85);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth/window.innerHeight, 0.1, 300);
camera.position.set(0, 4.2, 7.2);
camera.lookAt(0, 1.2, -6);

// ============ LIGHTS ============
const ambient = new THREE.AmbientLight(0x3344aa, 0.55);
scene.add(ambient);

const dir = new THREE.DirectionalLight(0xcc44ff, 0.9);
dir.position.set(-6, 10, 4);
scene.add(dir);

const hemi = new THREE.HemisphereLight(0x2233aa, 0x110022, 0.35);
scene.add(hemi);

// ============ MATERIALS ============
const matRoad = new THREE.MeshStandardMaterial({color:0x0a0a20, roughness:0.85, metalness:0.2});
const matLine = new THREE.MeshBasicMaterial({color:0xcc44ff});
const matWall = new THREE.MeshStandardMaterial({color:0x0a0a2e, roughness:0.6, metalness:0.5});
const matBarrier = new THREE.MeshBasicMaterial({color:0x00ffcc});
const matDrone = new THREE.MeshStandardMaterial({color:0x220033, emissive:0xcc44ff, emissiveIntensity:1.2, roughness:0.3, metalness:0.8});
const matBarrierObs = new THREE.MeshStandardMaterial({color:0x330011, emissive:0xff3366, emissiveIntensity:1.3, roughness:0.4, metalness:0.6});
const matChip = new THREE.MeshStandardMaterial({color:0x00ffcc, emissive:0x00ffcc, emissiveIntensity:1.5, roughness:0.2, metalness:0.9, transparent:true, opacity:0.9});
const matBoard = new THREE.MeshStandardMaterial({color:0x110022, emissive:0xcc44ff, emissiveIntensity:0.9, roughness:0.3, metalness:0.7});

// ============ ROAD SEGMENTS ============
const segments = [];
const segGroup = new THREE.Group();
scene.add(segGroup);

function buildSegment(zOffset){
  const g = new THREE.Group();
  // road
  const road = new THREE.Mesh(new THREE.PlaneGeometry(7, CFG.segLen), matRoad);
  road.rotation.x = -Math.PI/2;
  road.position.set(0, 0, -CFG.segLen/2);
  g.add(road);

  // center lines (dashed)
  for(let i=0;i<8;i++){
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 2.2), matLine);
    dash.rotation.x = -Math.PI/2;
    dash.position.set(-CFG.lanes[1]/2 - CFG.lanes[0]/2 + 0.0, 0.01, -i*5 - 1);
    g.add(dash);
    const dash2 = dash.clone();
    dash2.position.x = CFG.lanes[1]/2 + CFG.lanes[0]/2;
    g.add(dash2);
  }
  // edge lines
  for(const x of [-3.5, 3.5]){
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.12, CFG.segLen), matLine);
    edge.rotation.x = -Math.PI/2;
    edge.position.set(x, 0.012, -CFG.segLen/2);
    g.add(edge);
  }

  // walls with neon barriers
  for(const side of [-1,1]){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.2, CFG.segLen), matWall);
    wall.position.set(side*4.6, 1.6, -CFG.segLen/2);
    g.add(wall);
    // neon top bar
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.18, CFG.segLen), matBarrier);
    bar.position.set(side*4.3, 3.1, -CFG.segLen/2);
    g.add(bar);
    // vertical neon pillars
    for(let i=0;i<4;i++){
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 3.2, 0.15), matBarrier);
      p.position.set(side*4.3, 1.6, -i*(CFG.segLen/4) - 2);
      g.add(p);
    }
  }

  g.position.z = zOffset;
  g.userData.obstacles = [];
  g.userData.coins = [];
  segGroup.add(g);
  return g;
}

for(let i=0;i<CFG.segCount;i++){
  segments.push(buildSegment(-i*CFG.segLen));
}

// ============ OBSTACLES / COINS POOLS ============
function makeDrone(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), matDrone);
  body.scale.set(1, 0.6, 1.4);
  g.add(body);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.06, 8, 24), matDrone);
  ring.rotation.x = Math.PI/2;
  g.add(ring);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), new THREE.MeshBasicMaterial({color:0xff3366}));
  eye.position.set(0,0,-0.4);
  g.add(eye);
  g.userData.type = 'drone';
  g.userData.radius = 0.7;
  return g;
}
function makeBarrier(){
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.1, 0.5), matBarrierObs);
  g.add(b);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 0.52), new THREE.MeshBasicMaterial({color:0xff3366}));
  stripe.position.y = 0.25;
  g.add(stripe);
  g.userData.type = 'barrier';
  g.userData.radius = 0.9;
  return g;
}
function makeChip(){
  const g = new THREE.Group();
  const chip = new THREE.Mesh(new THREE.OctahedronGeometry(0.32, 0), matChip);
  g.add(chip);
  const glow = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.5, 20), new THREE.MeshBasicMaterial({color:0x00ffcc, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
  g.add(glow);
  g.userData.type = 'chip';
  g.userData.radius = 0.45;
  g.userData.baseY = 1.1;
  return g;
}

// ============ PLAYER ============
const player = new THREE.Group();
scene.add(player);

// hoverboard
const board = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.12, 2.2), matBoard);
board.position.y = 0.15;
player.add(board);
const boardGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.4), new THREE.MeshBasicMaterial({color:0xcc44ff, transparent:true, opacity:0.35}));
boardGlow.rotation.x = -Math.PI/2;
boardGlow.position.y = 0.02;
player.add(boardGlow);

// underglow light
const underLight = new THREE.PointLight(0xcc44ff, 2.5, 6, 2);
underLight.position.set(0, 0.1, 0);
player.add(underLight);

// fallback capsule (used until model loads or if load fails)
let playerModel = null;
const fallback = new THREE.Group();
const capsuleBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.35, 0.9, 6, 14),
  new THREE.MeshStandardMaterial({color:0x110022, emissive:0x440066, emissiveIntensity:0.6, roughness:0.4, metalness:0.6})
);
capsuleBody.position.y = 0.95;
fallback.add(capsuleBody);
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.18, 0.2),
  new THREE.MeshBasicMaterial({color:0x00ffcc})
);
visor.position.set(0, 1.25, -0.3);
fallback.add(visor);
player.add(fallback);

// Try load GLB
const loader = new GLTFLoader();
loader.load(CFG.modelPath,
  (gltf)=>{
    const m = gltf.scene;
    // normalize height
    const box = new THREE.Box3().setFromObject(m);
    const size = new THREE.Vector3(); box.getSize(size);
    const scale = CFG.modelHeight / size.y;
    m.scale.setScalar(scale);
    // recompute and center
    const box2 = new THREE.Box3().setFromObject(m);
    const center = new THREE.Vector3(); box2.getCenter(center);
    m.position.sub(center);
    m.position.y += CFG.modelHeight/2;
    // apply emissive tint
    m.traverse(o=>{
      if(o.isMesh){
        o.material = o.material.clone();
        if(!o.material.emissive) o.material.emissive = new THREE.Color(0x440066);
        o.material.emissiveIntensity = Math.max(o.material.emissiveIntensity||0, 0.4);
      }
    });
    player.remove(fallback);
    player.add(m);
    playerModel = m;
  },
  undefined,
  (err)=>{ console.warn('GLB not loaded, using fallback capsule.'); }
);

player.position.set(CFG.lanes[1], CFG.playerBaseY, 0);

// ============ BACKGROUND GRID / STARS ============
const grid = new THREE.GridHelper(400, 80, 0xcc44ff, 0x330044);
grid.position.y = -0.02;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// distant neon skyline
const skyline = new THREE.Group();
for(let i=0;i<60;i++){
  const h = 4 + Math.random()*18;
  const w = 1 + Math.random()*2.5;
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, w),
    new THREE.MeshStandardMaterial({
      color:0x0a0a2e,
      emissive: Math.random()<0.5 ? 0xcc44ff : 0x00ffcc,
      emissiveIntensity: 0.35 + Math.random()*0.4,
      roughness:0.7, metalness:0.4
    })
  );
  const side = Math.random()<0.5?-1:1;
  b.position.set(side*(12 + Math.random()*40), h/2, -Math.random()*200);
  skyline.add(b);
}
scene.add(skyline);

// floating particles (ambient)
const ambientParticles = (()=>{
  const N = 260;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const col = new Float32Array(N*3);
  const c1 = new THREE.Color(0xcc44ff), c2 = new THREE.Color(0x00ffcc);
  for(let i=0;i<N;i++){
    pos[i*3]   = (Math.random()-0.5)*60;
    pos[i*3+1] = Math.random()*14;
    pos[i*3+2] = -Math.random()*120;
    const c = Math.random()<0.5?c1:c2;
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const m = new THREE.PointsMaterial({size:0.12, vertexColors:true, transparent:true, opacity:0.85, depthWrite:false, blending:THREE.AdditiveBlending});
  const p = new THREE.Points(g,m);
  scene.add(p);
  return p;
})();

// ============ COLLISION PARTICLES ============
const particleSystems = [];
function spawnBurst(pos, color, count=24){
  const N = count;
  const g = new THREE.BufferGeometry();
  const positions = new Float32Array(N*3);
  const velocities = [];
  for(let i=0;i<N;i++){
    positions[i*3]=pos.x; positions[i*3+1]=pos.y; positions[i*3+2]=pos.z;
    velocities.push(new THREE.Vector3(
      (Math.random()-0.5)*6,
      Math.random()*5+1,
      (Math.random()-0.5)*6 - 2
    ));
  }
  g.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const m = new THREE.PointsMaterial({color, size:0.22, transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending});
  const p = new THREE.Points(g,m);
  p.userData = {vel:velocities, life:1.0};
  scene.add(p);
  particleSystems.push(p);
}

// ============ SPAWNING ============
let nextSpawnZ = -40;
function spawnInSegment(seg){
  // decide pattern
  const r = Math.random();
  const usedLanes = new Set();
  if(r < 0.55){
    // obstacles in 1-2 lanes
    const count = Math.random()<0.55 ? 1 : 2;
    for(let i=0;i<count;i++){
      let lane;
      do { lane = Math.floor(Math.random()*3); } while(usedLanes.has(lane));
      usedLanes.add(lane);
      const obs = Math.random()<0.55 ? makeDrone() : makeBarrier();
      obs.position.set(CFG.lanes[lane], obs.userData.type==='drone'?1.4:0.55, -Math.random()*CFG.segLen*0.8 - 4);
      seg.add(obs);
      seg.userData.obstacles.push(obs);
    }
  } else {
    // coin line
    const lane = Math.floor(Math.random()*3);
    const n = 4 + Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const c = makeChip();
      c.position.set(CFG.lanes[lane], c.userData.baseY, -i*2.2 - 4);
      seg.add(c);
      seg.userData.coins.push(c);
    }
  }
  // occasional coin scatter in free lanes
  if(Math.random()<0.4){
    for(let l=0;l<3;l++){
      if(usedLanes.has(l)) continue;
      if(Math.random()<0.35){
        const c = makeChip();
        c.position.set(CFG.lanes[l], c.userData.baseY, -Math.random()*CFG.segLen*0.7 - 6);
        seg.add(c);
        seg.userData.coins.push(c);
      }
    }
  }
}

function recycleSegment(seg){
  // remove obstacles/coins
  for(const o of seg.userData.obstacles) seg.remove(o);
  for(const c of seg.userData.coins) seg.remove(c);
  seg.userData.obstacles.length = 0;
  seg.userData.coins.length = 0;
  // move to front
  let minZ = Infinity;
  for(const s of segments){ if(s.position.z < minZ) minZ = s.position.z; }
  seg.position.z = minZ - CFG.segLen;
  spawnInSegment(seg);
}

// initial populate
for(const s of segments) spawnInSegment(s);

// ============ INPUT ============
function switchLane(dir){
  state.lane = Math.max(0, Math.min(2, state.lane + dir));
  state.targetX = CFG.lanes[state.lane];
}
function jump(){
  if(state.onGround){
    state.vy = CFG.jumpVel;
    state.onGround = false;
  }
}

window.addEventListener('keydown', e=>{
  if(!state.running) return;
  if(e.code==='ArrowLeft'||e.code==='KeyA') switchLane(-1);
  else if(e.code==='ArrowRight'||e.code==='KeyD') switchLane(1);
  else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') jump();
});

// swipe
let touchStart = null;
window.addEventListener('touchstart', e=>{
  const t = e.changedTouches[0];
  touchStart = {x:t.clientX, y:t.clientY};
},{passive:true});
window.addEventListener('touchend', e=>{
  if(!touchStart || !state.running) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(Math.max(ax,ay) < 24){ touchStart=null; return; }
  if(ax > ay){
    if(dx > 0) switchLane(1); else switchLane(-1);
  } else {
    if(dy < 0) jump();
  }
  touchStart = null;
},{passive:true});

// ============ UI ============
const scoreEl = document.querySelector('#score .val');
const coinsEl = document.querySelector('#coins .val');
const speedEl = document.querySelector('#speed .val');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreEl = document.getElementById('finalScore');
const finalCoinsEl = document.getElementById('finalCoins');
const bestScoreEl = document.getElementById('bestScore');
const flashEl = document.getElementById('flash');

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

function startGame(){
  // reset
  state.running = true;
  state.speed = CFG.startSpeed;
  state.distance = 0;
  state.score = 0;
  state.coins = 0;
  state.lane = 1;
  state.targetX = CFG.lanes[1];
  state.vy = 0;
  state.onGround = true;
  state.invuln = 0;
  player.position.set(CFG.lanes[1], CFG.playerBaseY, 0);

  // reset segments
  for(let i=0;i<segments.length;i++){
    const s = segments[i];
    for(const o of s.userData.obstacles) s.remove(o);
    for(const c of s.userData.coins) s.remove(c);
    s.userData.obstacles.length = 0;
    s.userData.coins.length = 0;
    s.position.z = -i*CFG.segLen;
    spawnInSegment(s);
  }
  // clear particles
  for(const p of particleSystems) scene.remove(p);
  particleSystems.length = 0;

  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
}

function gameOver(){
  state.running = false;
  if(state.score > state.best){
    state.best = Math.floor(state.score);
    localStorage.setItem('null_exe_best', state.best);
  }
  finalScoreEl.textContent = Math.floor(state.score);
  finalCoinsEl.textContent = state.coins;
  bestScoreEl.textContent = state.best;
  gameOverOverlay.classList.remove('hidden');
  // crash flash
  flashEl.style.background = 'rgba(255,51,102,0.45)';
  setTimeout(()=>flashEl.style.background='rgba(255,51,102,0.0)', 120);
  spawnBurst(player.position.clone().add(new THREE.Vector3(0,1,0)), 0xff3366, 40);
  spawnBurst(player.position.clone().add(new THREE.Vector3(0,1,0)), 0xcc44ff, 30);
}

// ============ GAME LOOP ============
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function update(dt){
  if(state.running){
    // speed growth
    state.speed = Math.min(CFG.maxSpeed, state.speed + CFG.jumpVel*0 + CFG.speedGrowth*dt*2);
    const dz = state.speed * dt;
    state.distance += dz;
    state.score += dz * 1.2;

    // move world toward player (player stays at z=0)
    for(const s of segments){
      s.position.z += dz;
      // recycle
      if(s.position.z > CFG.despawnDist + CFG.segLen){
        recycleSegment(s);
      }
    }
    // move obstacles/coins in world space? they are children of seg, so they move with seg.
    // Animate obstacles
    const t = performance.now()*0.001;
    for(const s of segments){
      for(const o of s.userData.obstacles){
        if(o.userData.type==='drone'){
          o.rotation.y += dt*2.5;
          o.position.y = 1.4 + Math.sin(t*3 + o.position.z*0.1)*0.25;
        }
      }
      for(const c of s.userData.coins){
        c.rotation.y += dt*3;
        c.rotation.x += dt*1.2;
        c.position.y = c.userData.baseY + Math.sin(t*4 + c.position.z*0.2)*0.12;
      }
    }

    // player lateral lerp
    player.position.x += (state.targetX - player.position.x) * Math.min(1, dt*12);
    // jump physics
    if(!state.onGround){
      state.vy -= CFG.gravity * dt;
      player.position.y += state.vy * dt;
      if(player.position.y <= CFG.playerBaseY){
        player.position.y = CFG.playerBaseY;
        state.vy = 0;
        state.onGround = true;
      }
    }
    // tilt board based on lateral motion
    const lateral = state.targetX - player.position.x;
    board.rotation.z = -lateral * 0.6;
    board.rotation.x = state.onGround ? 0 : -state.vy*0.01;

    // invuln
    if(state.invuln > 0) state.invuln -= dt;

    // collisions
    if(state.invuln <= 0){
      const pp = player.position;
      for(const s of segments){
        for(const o of s.userData.obstacles){
          const wp = o.getWorldPosition(tmpV);
          const dx = wp.x - pp.x;
          const dy = wp.y - (pp.y + 0.8);
          const dz = wp.z - pp.z;
          const rr = o.userData.radius + 0.55;
          if(dx*dx + dz*dz < rr*rr && Math.abs(dy) < 1.1){
            spawnBurst(wp.clone(), 0xff3366, 28);
            spawnBurst(wp.clone(), 0xcc44ff, 20);
            gameOver();
            break;
          }
        }
        if(!state.running) break;
        for(let i=s.userData.coins.length-1;i>=0;i--){
          const c = s.userData.coins[i];
          const wp = c.getWorldPosition(tmpV);
          const dx = wp.x - pp.x;
          const dy = wp.y - (pp.y + 0.8);
          const dz = wp.z - pp.z;
          if(dx*dx + dz*dz < 0.9*0.9 && Math.abs(dy) < 1.2){
            s.remove(c);
            s.userData.coins.splice(i,1);
            state.coins++;
            state.score += 25;
            spawnBurst(wp.clone(), 0x00ffcc, 14);
            spawnBurst(wp.clone(), 0xcc44ff, 8);
          }
        }
      }
    }

    // HUD
    scoreEl.textContent = Math.floor(state.score);
    coinsEl.textContent = state.coins;
    speedEl.textContent = state.speed.toFixed(1);
  }

  // ambient animations always
  const t = performance.now()*0.0005;
  underLight.intensity = 2.2 + Math.sin(t*20)*0.4;
  boardGlow.material.opacity = 0.3 + Math.sin(t*14)*0.1;

  // ambient particles drift
  const posArr = ambientParticles.geometry.attributes.position.array;
  for(let i=0;i<posArr.length;i+=3){
    posArr[i+2] += (state.running? state.speed : 4) * 0.003;
    if(posArr[i+2] > 6){
      posArr[i+2] = -120;
      posArr[i] = (Math.random()-0.5)*60;
      posArr[i+1] = Math.random()*14;
    }
  }
  ambientParticles.geometry.attributes.position.needsUpdate = true;

  // collision particles
  for(let i=particleSystems.length-1;i>=0;i--){
    const p = particleSystems[i];
    const pa = p.geometry.attributes.position.array;
    const vel = p.userData.vel;
    p.userData.life -= dt*1.2;
    for(let j=0;j<vel.length;j++){
      vel[j].y -= 12*dt;
      pa[j*3]   += vel[j].x*dt;
      pa[j*3+1] += vel[j].y*dt;
      pa[j*3+2] += vel[j].z*dt;
    }
    p.geometry.attributes.position.needsUpdate = true;
    p.material.opacity = Math.max(0, p.userData.life);
    if(p.userData.life <= 0){
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      particleSystems.splice(i,1);
    }
  }

  // camera subtle follow
  camera.position.x += (player.position.x*0.35 - camera.position.x) * Math.min(1, dt*4);
  camera.position.y = 4.2 + (state.onGround?0:0.2);
  camera.lookAt(player.position.x*0.3, 1.2, -6);
}

function animate(){
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// ============ RESIZE ============
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
