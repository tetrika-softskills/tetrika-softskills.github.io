<body>
  <div id="info">
    <span id="score">🏆 0000</span>

  </div>

  <div id="overlay">
    <h1>NULL.EXE</h1>
    <h2>⟡ neon drift ⟡</h2>
    <div class="sub">hoverboard · cyberpunk</div>
    <div id="final-score"></div>

  <!-- Three.js + GLTFLoader from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a2e);
    scene.fog = new THREE.FogExp2(0x0a0a2e, 0.018);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 5, 11);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // --- LIGHTS ---
    const ambient = new THREE.AmbientLight(0x2244aa, 0.7);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xcc44ff, 1.2);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    const d = 15;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 25;
    scene.add(dirLight);

    const boardLight = new THREE.PointLight(0xcc44ff, 1.6, 12);
    boardLight.position.set(0, -0.5, 0);
    scene.add(boardLight);

    const fillLight = new THREE.PointLight(0x00ffcc, 0.6, 20);
    fillLight.position.set(-4, 3, 6);
    scene.add(fillLight);

    // --- GLOBALS ---
    const LANE_COUNT = 3;
    const LANE_WIDTH = 1.6;
    const SEGMENT_LENGTH = 12;
    const MAX_SPEED = 14;
    const MIN_SPEED = 4.5;
    let currentSpeed = 5.0;
    let score = 0;
    let gameActive = false;

    // --- PLAYER ---
    const playerGroup = new THREE.Group();
    let playerMesh = null;
    const playerBaseY = 0.85;
    let currentLane = 1; // 0,1,2
    let targetX = 0;
    let verticalVelocity = 0;
    let isGrounded = true;
    const GRAVITY = -22;
    const JUMP_SPEED = 8.5;

    // --- WORLD CONTAINERS ---
    const segments = [];
    const obstacles = [];
    const coins = [];
    let segmentCount = 6;
    let worldOffset = 0;

    // --- UI ELEMENTS ---
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed-indicator');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('final-score');
    const startBtn = document.getElementById('start-btn');

    // --- HELPER FUNCTIONS ---
    function createRoadSegment(zPos) {
      const group = new THREE.Group();

      // Road base
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x0d0d2b, roughness: 0.7, metalness: 0.2 });
      const road = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.15, SEGMENT_LENGTH), roadMat);
      road.position.y = -0.1;
      road.receiveShadow = true;
      group.add(road);

      // Neon lane lines (purple)
      const lineMat = new THREE.MeshStandardMaterial({ 
        color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 1.4 
      });
      for (let i = -1; i <= 1; i++) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, SEGMENT_LENGTH - 0.8), lineMat);
        line.position.set(i * LANE_WIDTH, 0.1, 0);
        group.add(line);
      }

      // Side barriers (cyan glow)
      const barrierMat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x00ffcc,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.7
      });
      for (let side = -1; side <= 1; side+=2) {
        const barrier = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, SEGMENT_LENGTH), barrierMat);
        barrier.position.set(side * 3.3, 0.3, 0);
        group.add(barrier);
        // glowing pillar
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), 
          new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 2 }));
        pillar.position.set(side * 3.3, 0.4, SEGMENT_LENGTH/2 - 0.5);
        group.add(pillar);
        const pillar2 = pillar.clone();
        pillar2.position.z = -SEGMENT_LENGTH/2 + 0.5;
        group.add(pillar2);
      }

      group.position.z = zPos;
      return group;
    }

    function spawnObstacle(zPos, lane) {
      const type = Math.random() > 0.6 ? 'drone' : 'barrier';
      const group = new THREE.Group();
      let mesh;
      if (type === 'drone') {
        const geo = new THREE.CylinderGeometry(0.45, 0.45, 0.6, 6);
        const mat = new THREE.MeshStandardMaterial({ 
          color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 1.8,
          metalness: 0.9, roughness: 0.3
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 1.1;
        // rotor
        const rotor = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.8), 
          new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.2 }));
        rotor.position.y = 1.35;
        group.add(rotor);
        group.userData.isDrone = true;
      } else {
        const geo = new THREE.BoxGeometry(1.2, 1.0, 0.8);
        const mat = new THREE.MeshStandardMaterial({ 
          color: 0xff3366, emissive: 0xff3366, emissiveIntensity: 0.9,
          metalness: 0.6, roughness: 0.4
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.5;
        group.userData.isDrone = false;
      }
      group.add(mesh);
      const xPos = (lane - 1) * LANE_WIDTH;
      group.position.set(xPos, 0.0, zPos);
      return group;
    }

    function spawnCoin(zPos, lane) {
      const group = new THREE.Group();
      const geo = new THREE.OctahedronGeometry(0.35, 0);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x00ffcc,
        emissiveIntensity: 1.8,
        metalness: 0.3,
        roughness: 0.2
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = 1.2;
      group.add(mesh);
      // glow ring
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.45, 0.55, 16),
        new THREE.MeshStandardMaterial({ color: 0xcc44ff, emissive: 0xcc44ff, emissiveIntensity: 1.2, side: THREE.DoubleSide, transparent: true, opacity: 0.7 }));
      ring.rotation.x = Math.PI/2;
      ring.position.y = 1.2;
      group.add(ring);
      
      const xPos = (lane - 1) * LANE_WIDTH;
      group.position.set(xPos, 0.0, zPos);
      return group;
    }

    function buildInitialWorld() {
      for (let i = 0; i < segmentCount; i++) {
        const z = i * SEGMENT_LENGTH;
        const seg = createRoadSegment(z);
        scene.add(seg);
        segments.push(seg);
        // obstacles & coins
        if (i > 1 && i < segmentCount-1) {
          if (Math.random() < 0.4) {
            const lane = Math.floor(Math.random() * 3);
            const obs = spawnObstacle(z + 2, lane);
            scene.add(obs);
            obstacles.push(obs);
          }
          if (Math.random() < 0.45) {
            const lane = Math.floor(Math.random() * 3);
            const coin = spawnCoin(z + 4, lane);
            scene.add(coin);
            coins.push(coin);
          }
        }
      }
    }

    function recycleSegment() {
      const firstSeg = segments.shift();
      const lastZ = segments[segments.length-1].position.z;
      const newZ = lastZ + SEGMENT_LENGTH;
      firstSeg.position.z = newZ;
      segments.push(firstSeg);
      // clear old obstacles/coins in this segment
      const oldObs = obstacles.filter(o => o.position.z < worldOffset - 5);
      oldObs.forEach(o => { scene.remove(o); });
      obstacles.splice(0, oldObs.length);
      
      const oldCoins = coins.filter(c => c.position.z < worldOffset - 5);
      oldCoins.forEach(c => { scene.remove(c); });
      coins.splice(0, oldCoins.length);

      // spawn new obstacles/coins in the new segment
      if (Math.random() < 0.35) {
        const lane = Math.floor(Math.random() * 3);
        const obs = spawnObstacle(newZ + 2, lane);
        scene.add(obs);
        obstacles.push(obs);
      }
      if (Math.random() < 0.4) {
        const lane = Math.floor(Math.random() * 3);
        const coin = spawnCoin(newZ + 4, lane);
        scene.add(coin);
        coins.push(coin);
      }
    }

    // --- PLAYER MODEL LOAD (fallback capsule) ---
    function createFallbackPlayer() {
      const group = new THREE.Group();
      // hoverboard
      const boardGeo = new THREE.BoxGeometry(1.0, 0.12, 1.8);
      const boardMat = new THREE.MeshStandardMaterial({ color: 0x111122, emissive: 0xcc44ff, emissiveIntensity: 0.8, metalness: 0.9, roughness: 0.3 });
      const board = new THREE.Mesh(boardGeo, boardMat);
      board.position.y = 0.0;
      board.castShadow = true;
      group.add(board);
      // capsule body (simple)
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x334466, emissive: 0x112244, emissiveIntensity: 0.3 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.8, 8), bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      group.add(body);
      // helmet glow
      const helm = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), 
        new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.7 }));
      helm.position.y = 0.9;
      group.add(helm);
      return group;
    }

    function loadPlayerModel() {
      const loader = new GLTFLoader();
      loader.load(
        'player_game.glb',
        (gltf) => {
          const model = gltf.scene;
          model.scale.set(0.8, 0.8, 0.8);
          model.position.y = 0.0;
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.material) {
                child.material.emissive = new THREE.Color(0xcc44ff);
                child.material.emissiveIntensity = 0.5;
              }
            }
          });
          playerGroup.add(model);
          playerMesh = model;
          playerGroup.position.y = playerBaseY;
        },
        undefined,
        () => {
          // fallback
          const fallback = createFallbackPlayer();
          playerGroup.add(fallback);
          playerMesh = fallback;
          playerGroup.position.y = playerBaseY;
        }
      );
      // in case of slow load, show fallback immediately
      setTimeout(() => {
        if (!playerMesh) {
          const fallback = createFallbackPlayer();
          playerGroup.add(fallback);
          playerMesh = fallback;
          playerGroup.position.y = playerBaseY;
        }
      }, 300);
    }

    // --- INIT PLAYER ---
    playerGroup.position.set(0, playerBaseY, 0);
    scene.add(playerGroup);
    loadPlayerModel();

    // --- PARTICLES (collision) ---
    const particleGeo = new THREE.BufferGeometry();
    const particleCount = 150;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particleMat = new THREE.PointsMaterial({ 
      size: 0.25, 
      vertexColors: true, 
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.9
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    particleSystem.visible = false;
    scene.add(particleSystem);

    let particleTimer = 0;
    function emitParticles(position, color1, color2) {
      const pos = particleSystem.geometry.attributes.position.array;
      const col = particleSystem.geometry.attributes.color.array;
      for (let i = 0; i < particleCount; i++) {
        pos[i*3] = position.x + (Math.random()-0.5)*1.8;
        pos[i*3+1] = position.y + (Math.random()-0.5)*1.8;
        pos[i*3+2] = position.z + (Math.random()-0.5)*1.8;
        const c = Math.random() > 0.5 ? color1 : color2;
        col[i*3] = c.r;
        col[i*3+1] = c.g;
        col[i*3+2] = c.b;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
      particleSystem.geometry.attributes.color.needsUpdate = true;
      particleSystem.visible = true;
      particleTimer = 0.6;
    }

    // --- COLLISION & GAME LOGIC ---
    function checkCollisions() {
      const px = playerGroup.position.x;
      const pz = playerGroup.position.z;
      const py = playerGroup.position.y;
      const playerRadius = 0.45;
      // obstacles
      for (let i = obstacles.length-1; i >= 0; i--) {
        const obs = obstacles[i];
        const dz = obs.position.z - pz;
        if (Math.abs(dz) < 0.9) {
          const dx = obs.position.x - px;
          if (Math.abs(dx) < 0.7) {
            // collision
            const color1 = new THREE.Color(0xcc44ff);
            const color2 = new THREE.Color(0x00ffcc);
            emitParticles(obs.position.clone().add(new THREE.Vector3(0,0.6,0)), color1, color2);
            gameOver();
            return;
          }
        }
      }
      // coins
      for (let i = coins.length-1; i >= 0; i--) {
        const coin = coins[i];
        const dz = coin.position.z - pz;
        if (Math.abs(dz) < 0.8) {
          const dx = coin.position.x - px;
          if (Math.abs(dx) < 0.6) {
            scene.remove(coin);
            coins.splice(i, 1);
            score += 10;
            const color1 = new THREE.Color(0x00ffcc);
            const color2 = new THREE.Color(0xcc44ff);
            emitParticles(coin.position.clone().add(new THREE.Vector3(0,0.8,0)), color1, color2);
          }
        }
      }
    }

    function gameOver() {
      gameActive = false;
      finalScoreEl.textContent = `☠ CRASH · ${String(score).padStart(4,'0')}`;
      overlay.classList.remove('hidden');
    }

    function resetGame() {
      // remove obstacles & coins
      obstacles.forEach(o => scene.remove(o));
      coins.forEach(c => scene.remove(c));
      obstacles.length = 0;
      coins.length = 0;
      // reset player
      playerGroup.position.set(0, playerBaseY, 0);
      currentLane = 1;
      targetX = 0;
      verticalVelocity = 0;
      isGrounded = true;
      score = 0;
      currentSpeed = MIN_SPEED;
      worldOffset = 0;
      // reset segments
      segments.forEach(s => scene.remove(s));
      segments.length = 0;
      buildInitialWorld();
      particleSystem.visible = false;
      updateUI();
    }

    function updateUI() {
      scoreEl.textContent = `🏆 ${String(score).padStart(4,'0')}`;
      const speedRatio = (currentSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED);
      const speedDisplay = (1 + speedRatio * 2).toFixed(1);
      speedEl.textContent = `⚡ ${speedDisplay}x`;
    }

    // --- KEYBOARD / TOUCH ---
    const keys = { left: false, right: false, up: false };
    document.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); moveLane(-1); }
      if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); moveLane(1); }
      if (e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
    });

    let touchStartX = 0;
    let touchStartY = 0;
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (!gameActive) return;
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });
    renderer.domElement.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!gameActive) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)*0.6) {
        moveLane(dx > 0 ? 1 : -1);
        touchStartX = t.clientX;
        touchStartY = t.clientY;
      } else if (dy < -40 && Math.abs(dy) > Math.abs(dx)*0.6) {
        jump();
        touchStartX = t.clientX;
        touchStartY = t.clientY;
      }
    }, { passive: false });

    function moveLane(dir) {
      if (!gameActive) return;
      const newLane = Math.min(2, Math.max(0, currentLane + dir));
      if (newLane !== currentLane) {
        currentLane = newLane;
        targetX = (currentLane - 1) * LANE_WIDTH;
      }
    }

    function jump() {
      if (!gameActive) return;
      if (isGrounded) {
        verticalVelocity = JUMP_SPEED;
        isGrounded = false;
      }
    }

    // --- GAME LOOP ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.03);

      if (gameActive) {
        // speed increase
        if (currentSpeed < MAX_SPEED) currentSpeed += delta * 0.3;
        // move world
        const moveZ = currentSpeed * delta;
        worldOffset += moveZ;
        segments.forEach(seg => seg.position.z -= moveZ);
        obstacles.forEach(obs => obs.position.z -= moveZ);
        coins.forEach(coin => {
          coin.position.z -= moveZ;
          coin.rotation.y += delta * 3;
        });

        // recycle segments
        if (segments.length > 0 && segments[0].position.z < -SEGMENT_LENGTH) {
          recycleSegment();
        }

        // player movement
        playerGroup.position.x += (targetX - playerGroup.position.x) * 0.12;
        // gravity
        if (!isGrounded) {
          verticalVelocity += GRAVITY * delta;
          playerGroup.position.y += verticalVelocity * delta;
          if (playerGroup.position.y <= playerBaseY) {
            playerGroup.position.y = playerBaseY;
            verticalVelocity = 0;
            isGrounded = true;
          }
        }
        // hover bob
        if (isGrounded) {
          playerGroup.position.y = playerBaseY + Math.sin(Date.now() * 0.006) * 0.04;
        }
        // board light follows
        boardLight.position.copy(playerGroup.position);
        boardLight.position.y -= 0.4;

        // collision & coins
        checkCollisions();

        // update score per frame (distance)
        score += Math.floor(moveZ * 0.8);
        updateUI();

        // particle timer
        if (particleTimer > 0) {
          particleTimer -= delta;
          if (particleTimer <= 0) particleSystem.visible = false;
        }

        // camera follow (smooth)
        const targetCamY = 4.5 + (currentSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED) * 1.5;
        camera.position.y += (targetCamY - camera.position.y) * 0.02;
        camera.position.z = 11 + (currentSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED) * 1.2;
        camera.lookAt(playerGroup.position.x * 0.3, 2.2, playerGroup.position.z - 4);
      }

      renderer.render(scene, camera);
    }
    animate();

    // --- START / RESET ---
    startBtn.addEventListener('click', () => {
      resetGame();
      gameActive = true;
      overlay.classList.add('hidden');
      updateUI();
    });

    // handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // initial build
    buildInitialWorld();
    updateUI();
    overlay.classList.remove('hidden');
    finalScoreEl.textContent = '';
  </script>
</body>
</html>
