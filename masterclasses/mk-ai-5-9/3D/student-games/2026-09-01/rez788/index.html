<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>NULL.EXE — Endless Runner</title>
<style>
  :root {
    --bg: #0a0a2e;
    --purple: #cc44ff;
    --cyan: #00ffcc;
    --red: #ff2266;
    --text: #e6e6ff;
    --dim: #8a8ac8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 22px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .hud-block {
    background: rgba(10, 10, 46, 0.55);
    border: 1px solid rgba(204, 68, 255, 0.45);
    padding: 10px 16px;
    border-radius: 4px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(204, 68, 255, 0.25), inset 0 0 14px rgba(0, 255, 204, 0.06);
  }
  .hud-label { color: var(--dim); font-size: 10px; }
  .hud-value { color: var(--cyan); font-size: 22px; text-shadow: 0 0 8px var(--cyan); }
  .hud-value.purple { color: var(--purple); text-shadow: 0 0 8px var(--purple); }

  /* Overlays */
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,10,46,0.85) 0%, rgba(10,10,46,0.98) 70%);
    z-index: 10;
    text-align: center;
    padding: 20px;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(42px, 9vw, 96px);
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--purple);
    text-shadow:
      0 0 10px var(--purple),
      0 0 24px rgba(204,68,255,0.6),
      0 0 48px rgba(0,255,204,0.3);
    margin-bottom: 8px;
    animation: flicker 3.2s infinite;
  }
  .subtitle {
    color: var(--cyan);
    letter-spacing: 4px;
    font-size: 14px;
    margin-bottom: 32px;
    text-shadow: 0 0 10px var(--cyan);
  }
  .subtitle::before, .subtitle::after { content: " // "; color: var(--dim); }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.55; }
  }
  .btn {
    background: transparent;
    color: var(--cyan);
    border: 2px solid var(--cyan);
    padding: 14px 40px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s ease;
    box-shadow: 0 0 14px rgba(0,255,204,0.35), inset 0 0 14px rgba(0,255,204,0.1);
    margin-top: 12px;
  }
  .btn:hover, .btn:active {
    background: rgba(0,255,204,0.12);
    color: #fff;
    box-shadow: 0 0 28px rgba(0,255,204,0.7), inset 0 0 20px rgba(204,68,255,0.25);
    transform: translateY(-1px);
  }
  .hint {
    margin-top: 26px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 2px;
    line-height: 1.8;
  }
  .hint b { color: var(--purple); }
  .final-score {
    font-size: 54px;
    color: var(--cyan);
    text-shadow: 0 0 14px var(--cyan);
    margin: 10px 0 6px;
  }
  .final-best {
    color: var(--purple);
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 18px;
  }
  .glitch-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
    opacity: 0.35;
    pointer-events: none;
  }
  .glitch-line.top { top: 18%; }
  .glitch-line.bot { bottom: 22%; }

  #mobile-controls {
    position: fixed; bottom: 20px; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 4;
    pointer-events: none;
  }
  .touch-btn {
    pointer-events: auto;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: rgba(10,10,46,0.5);
    border: 1px solid var(--purple);
    color: var(--cyan);
    font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 18px rgba(204,68,255,0.3);
  }
  @media (hover: none) and (pointer: coarse) {
    #mobile-controls { display: flex; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="hud-block">
    <div class="hud-label">SCORE</div>
    <div class="hud-value" id="score">0000</div>
  </div>
  <div class="hud-block" style="text-align:center;">
    <div class="hud-label">NULL.EXE</div>
    <div class="hud-value purple" id="speed">00.0</div>
  </div>
  <div class="hud-block" style="text-align:right;">
    <div class="hud-label">CHIPS</div>
    <div class="hud-value" id="chips">0</div>
  </div>
</div>

<div id="start" class="overlay">
  <div class="glitch-line top"></div>
  <div class="title">NULL.EXE</div>
  <div class="subtitle">SYSTEM BREACH INITIATED</div>
  <button class="btn" id="startBtn">JACK IN</button>
  <div class="hint">
    <b>A / D</b> or <b>← →</b> — смена полосы<br>
    <b>SPACE / W / ↑</b> — прыжок<br>
    <b>Свайпы</b> на мобильном
  </div>
  <div class="glitch-line bot"></div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="title" style="color: var(--red); text-shadow: 0 0 10px var(--red), 0 0 24px rgba(255,34,102,0.6);">DISCONNECT</div>
  <div class="subtitle">CONNECTION TERMINATED</div>
  <div class="final-score" id="finalScore">0000</div>
  <div class="final-best">BEST: <span id="bestScore">0000</span></div>
  <button class="btn" id="restartBtn">REBOOT</button>
</div>

<div id="mobile-controls">
  <div class="touch-btn" id="btnLeft">◀</div>
  <div class="touch-btn" id="btnJump">▲</div>
  <div class="touch-btn" id="btnRight">▶</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- CORE ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a2e);
scene.fog = new THREE.Fog(0x0a0a2e, 10, 55);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4.2, 7.5);
camera.lookAt(0, 1.2, -4);

// ---------- LIGHTS ----------
const ambient = new THREE.AmbientLight(0x2233aa, 0.55);
scene.add(ambient);

const dir = new THREE.DirectionalLight(0xcc44ff, 1.1);
dir.position.set(-4, 8, 4);
scene.add(dir);

const hemi = new THREE.HemisphereLight(0x3322aa, 0x0a0a2e, 0.35);
scene.add(hemi);

// ---------- LANE CONFIG ----------
const LANE_X = [-2.2, 0, 2.2];
const SEG_LENGTH = 20;
const VISIBLE_SEGMENTS = 6;

// ---------- ROAD ----------
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a18,
  roughness: 0.7,
  metalness: 0.3,
  emissive: 0x110022,
  emissiveIntensity: 0.3,
});

const laneLineMat = new THREE.MeshBasicMaterial({ color: 0xcc44ff, transparent: true, opacity: 0.9 });
const edgeLineMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.9 });

const wallMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a1e,
  emissive: 0x220033,
  emissiveIntensity: 0.6,
  roughness: 0.6,
  metalness: 0.4,
});
const neonBarMat = new THREE.MeshBasicMaterial({ color: 0xcc44ff });

function createSegment() {
  const seg = new THREE.Group();

  // road plane
  const road = new THREE.Mesh(new THREE.PlaneGeometry(7, SEG_LENGTH), roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0;
  seg.add(road);

  // lane dividers (dashed)
  for (let i = -1; i <= 1; i += 2) {
    const x = i * (2.2 / 2 + 2.2 / 2); // between lanes
    const xLane = i * 2.2;
    for (let z = -SEG_LENGTH / 2; z < SEG_LENGTH / 2; z += 2.4) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 1.2), laneLineMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(xLane, 0.01, z);
      seg.add(dash);
    }
  }

  // side neon edges
  for (const side of [-1, 1]) {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.12, SEG_LENGTH), edgeLineMat);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(side * 3.5, 0.01, 0);
    seg.add(edge);

    // wall
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.2, SEG_LENGTH), wallMat);
    wall.position.set(side * 4.2, 1.6, 0);
    seg.add(wall);

    // neon bars on wall
    for (let z = -SEG_LENGTH / 2 + 1; z < SEG_LENGTH / 2; z += 2.5) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.6), neonBarMat);
      bar.position.set(side * 3.88, 2.2, z);
      seg.add(bar);
      const bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.6), edgeLineMat);
      bar2.position.set(side * 3.88, 0.9, z);
      seg.add(bar2);
    }
  }

  seg.userData.z = 0;
  return seg;
}

const segments = [];
for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
  const s = createSegment();
  s.position.z = -i * SEG_LENGTH;
  roadGroup.add(s);
  segments.push(s);
}

// ---------- SKY / DISTANT ELEMENTS ----------
// distant grid floor
const gridHelper = new THREE.GridHelper(200, 80, 0xcc44ff, 0x220044);
gridHelper.position.y = -0.5;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.35;
scene.add(gridHelper);

// floating particles (stars)
const starGeo = new THREE.BufferGeometry();
const starCount = 400;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 120;
  starPos[i * 3 + 1] = Math.random() * 40 + 2;
  starPos[i * 3 + 2] = (Math.random() - 0.5) * 200;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.18, transparent: true, opacity: 0.8 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- PLAYER ----------
const player = new THREE.Group();
scene.add(player);

const playerBaseY = 0.35;
player.position.set(0, playerBaseY, 0);

let playerModel = null;
let playerReady = false;

// Hoverboard (always visible under character)
const boardGroup = new THREE.Group();
const board = new THREE.Mesh(
  new THREE.BoxGeometry(1.3, 0.12, 2.4),
  new THREE.MeshStandardMaterial({
    color: 0x0a0a1a,
    emissive: 0xcc44ff,
    emissiveIntensity: 0.8,
    roughness: 0.3,
    metalness: 0.8,
  })
);
board.position.y = 0.05;
boardGroup.add(board);

// board glow edge
const boardGlow = new THREE.Mesh(
  new THREE.BoxGeometry(1.35, 0.03, 2.45),
  new THREE.MeshBasicMaterial({ color: 0xcc44ff, transparent: true, opacity: 0.9 })
);
boardGlow.position.y = 0.12;
boardGroup.add(boardGlow);

// point light under board
const boardLight = new THREE.PointLight(0xcc44ff, 2.2, 6, 2);
boardLight.position.set(0, -0.1, 0);
boardGroup.add(boardLight);

player.add(boardGroup);

// Fallback capsule character
const fallbackChar = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a3a,
  emissive: 0x220044,
  emissiveIntensity: 0.4,
  roughness: 0.5,
  metalness: 0.6,
});
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 6, 12), bodyMat);
body.position.y = 0.85;
fallbackChar.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.28, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x0a0a2e, emissive: 0x00ffcc, emissiveIntensity: 0.9, roughness: 0.3, metalness: 0.8 })
);
head.position.y = 1.65;
fallbackChar.add(head);

// visor
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.08, 0.1),
  new THREE.MeshBasicMaterial({ color: 0x00ffcc })
);
visor.position.set(0, 1.68, 0.25);
fallbackChar.add(visor);

fallbackChar.visible = true;
player.add(fallbackChar);

// Try loading GLB
const loader = new GLTFLoader();
loader.load(
  'player_game.glb',
  (gltf) => {
    playerModel = gltf.scene;
    // Scale to height 2.0
    const box = new THREE.Box3().setFromObject(playerModel);
    const h = box.max.y - box.min.y;
    const scale = 2.0 / Math.max(h, 0.001);
    playerModel.scale.setScalar(scale);
    // recompute and center
    const box2 = new THREE.Box3().setFromObject(playerModel);
    const cy = (box2.max.y + box2.min.y) / 2;
    playerModel.position.y = -cy + 0.25;
    // apply emissive tint
    playerModel.traverse((o) => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.emissive = new THREE.Color(0x330055);
        o.material.emissiveIntensity = 0.35;
      }
    });
    player.add(playerModel);
    fallbackChar.visible = false;
    playerReady = true;
  },
  undefined,
  () => {
    // fallback already in place
    playerReady = true;
  }
);

// ---------- OBSTACLES & CHIPS ----------
const obstacles = [];
const chips = [];

const obstacleMatPurple = new THREE.MeshStandardMaterial({
  color: 0x1a0022,
  emissive: 0xcc44ff,
  emissiveIntensity: 1.1,
  roughness: 0.4,
  metalness: 0.6,
});
const obstacleMatRed = new THREE.MeshStandardMaterial({
  color: 0x220011,
  emissive: 0xff2266,
  emissiveIntensity: 1.1,
  roughness: 0.4,
  metalness: 0.6,
});

function createBarrier() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 0.4), obstacleMatPurple);
  base.position.y = 0.6;
  g.add(base);
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.1, 0.5), new THREE.MeshBasicMaterial({ color: 0xcc44ff }));
  top.position.y = 1.25;
  g.add(top);
  g.userData.type = 'barrier';
  g.userData.radius = 0.85;
  return g;
}

function createDrone() {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), obstacleMatRed);
  g.add(core);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.7, 0.05, 8, 24),
    new THREE.MeshBasicMaterial({ color: 0xff2266 })
  );
  ring.rotation.x = Math.PI / 2;
  g.add(ring);
  const light = new THREE.PointLight(0xff2266, 1.2, 4, 2);
  g.add(light);
  g.userData.type = 'drone';
  g.userData.radius = 0.7;
  g.userData.floatPhase = Math.random() * Math.PI * 2;
  return g;
}

function createChip() {
  const g = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.28, 0),
    new THREE.MeshStandardMaterial({
      color: 0x00ffcc,
      emissive: 0x00ffcc,
      emissiveIntensity: 1.2,
      roughness: 0.2,
      metalness: 0.9,
      transparent: true,
      opacity: 0.9,
    })
  );
  g.add(core);
  const halo = new THREE.Mesh(
    new THREE.RingGeometry(0.35, 0.45, 20),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
  );
  g.add(halo);
  g.userData.type = 'chip';
  g.userData.radius = 0.5;
  return g;
}

// ---------- PARTICLES ----------
const particlePool = [];
const activeParticles = [];

function createParticleMat(color) {
  return new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
}

function spawnParticles(pos, color, count = 18) {
  for (let i = 0; i < count; i++) {
    let p;
    if (particlePool.length) {
      p = particlePool.pop();
      p.material.color.set(color);
      p.material.opacity = 1;
      p.visible = true;
    } else {
      const geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
      const mat = createParticleMat(color);
      p = new THREE.Mesh(geo, mat);
      scene.add(p);
    }
    p.position.copy(pos);
    const speed = 4 + Math.random() * 5;
    const dir = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      Math.random() * 1.5 + 0.5,
      (Math.random() - 0.5) * 2
    ).normalize().multiplyScalar(speed);
    p.userData.vel = dir;
    p.userData.life = 0.8 + Math.random() * 0.4;
    p.userData.age = 0;
    activeParticles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = activeParticles.length - 1; i >= 0; i--) {
    const p = activeParticles[i];
    p.userData.age += dt;
    p.userData.vel.y -= 12 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    p.material.opacity = Math.max(0, 1 - p.userData.age / p.userData.life);
    p.rotation.x += dt * 6;
    p.rotation.y += dt * 4;
    if (p.userData.age >= p.userData.life) {
      p.visible = false;
      activeParticles.splice(i, 1);
      particlePool.push(p);
    }
  }
}

// ---------- GAME STATE ----------
const state = {
  running: false,
  speed: 14,
  baseSpeed: 14,
  maxSpeed: 42,
  distance: 0,
  score: 0,
  chips: 0,
  best: parseInt(localStorage.getItem('null_exe_best') || '0', 10),
  lane: 1,
  targetLaneX: 0,
  vy: 0,
  jumping: false,
  gravity: -28,
  jumpVel: 11,
  spawnTimer: 0,
  chipTimer: 0,
  time: 0,
};

// ---------- INPUT ----------
function moveLeft() {
  if (state.lane > 0) state.lane--;
  state.targetLaneX = LANE_X[state.lane];
}
function moveRight() {
  if (state.lane < 2) state.lane++;
  state.targetLaneX = LANE_X[state.lane];
}
function jump() {
  if (!state.jumping && state.running) {
    state.vy = state.jumpVel;
    state.jumping = true;
  }
}

window.addEventListener('keydown', (e) => {
  if (!state.running) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
});

// Touch swipes
let touchStart = null;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length > 0) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
renderer.domElement.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 24) { jump(); }
  else if (absX > absY) {
    if (dx > 0) moveRight(); else moveLeft();
  } else {
    if (dy < 0) jump();
  }
  touchStart = null;
}, { passive: true });

document.getElementById('btnLeft').addEventListener('click', moveLeft);
document.getElementById('btnRight').addEventListener('click', moveRight);
document.getElementById('btnJump').addEventListener('click', jump);

// ---------- SPAWNING ----------
function spawnRow(z) {
  // Decide pattern
  const r = Math.random();
  const freeLane = Math.floor(Math.random() * 3);
  if (r < 0.55) {
    // 2 obstacles, leave one lane free
    for (let i = 0; i < 3; i++) {
      if (i === freeLane) continue;
      const useDrone = Math.random() < 0.5;
      const obj = useDrone ? createDrone() : createBarrier();
      obj.position.set(LANE_X[i], useDrone ? 1.4 : 0, z);
      scene.add(obj);
      obstacles.push(obj);
    }
  } else if (r < 0.85) {
    // single obstacle
    const lane = Math.floor(Math.random() * 3);
    const useDrone = Math.random() < 0.5;
    const obj = useDrone ? createDrone() : createBarrier();
    obj.position.set(LANE_X[lane], useDrone ? 1.4 : 0, z);
    scene.add(obj);
    obstacles.push(obj);
  }
  // chips in free lane(s)
  if (Math.random() < 0.7) {
    const chipLane = freeLane;
    for (let k = 0; k < 3; k++) {
      const chip = createChip();
      chip.position.set(LANE_X[chipLane], 1.1, z - k * 1.6);
      scene.add(chip);
      chips.push(chip);
    }
  }
}

function recycleSegment() {
  // move farthest segment ahead
  segments.sort((a, b) => a.position.z - b.position.z);
  const far = segments[0];
  const lastZ = segments[segments.length - 1].position.z;
  far.position.z = lastZ - SEG_LENGTH;
  // spawn obstacles on this segment
  const baseZ = far.position.z;
  const rows = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < rows; i++) {
    spawnRow(baseZ - 4 - i * 6);
  }
}

function cleanupPassed() {
  const cutoff = player.position.z + 6;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].position.z > cutoff) {
      scene.remove(obstacles[i]);
      obstacles[i].traverse(o => { if (o.geometry) o.geometry.dispose(); });
      obstacles.splice(i, 1);
    }
  }
  for (let i = chips.length - 1; i >= 0; i--) {
    if (chips[i].position.z > cutoff) {
      scene.remove(chips[i]);
      chips[i].traverse(o => { if (o.geometry) o.geometry.dispose(); });
      chips.splice(i, 1);
    }
  }
}

// ---------- COLLISION ----------
const _tmpV = new THREE.Vector3();
function checkCollisions() {
  const pp = player.position;
  const playerY = pp.y + 1.0; // center of body
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    const dx = o.position.x - pp.x;
    const dz = o.position.z - pp.z;
    const r = o.userData.radius + 0.55;
    if (dx * dx + dz * dz < r * r) {
      // vertical check: if player is high enough (jumping over barrier)
      const oY = o.position.y + (o.userData.type === 'drone' ? 0 : 0.6);
      if (playerY > oY + 0.8) continue;
      // collision!
      spawnParticles(pp.clone().add(new THREE.Vector3(0, 1, 0)), 0xff2266, 28);
      spawnParticles(pp.clone().add(new THREE.Vector3(0, 1, 0)), 0xcc44ff, 18);
      gameOver();
      return;
    }
  }
  for (let i = chips.length - 1; i >= 0; i--) {
    const c = chips[i];
    const dx = c.position.x - pp.x;
    const dz = c.position.z - pp.z;
    const dy = c.position.y - playerY;
    if (dx * dx + dz * dz + dy * dy < 0.9 * 0.9) {
      spawnParticles(c.position.clone(), 0x00ffcc, 14);
      scene.remove(c);
      c.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      chips.splice(i, 1);
      state.chips++;
      state.score += 50;
    }
  }
}

// ---------- UI ----------
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');
const chipsEl = document.getElementById('chips');
const startEl = document.getElementById('start');
const gameoverEl = document.getElementById('gameover');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreEl = document.getElementById('bestScore');

function pad(n, w = 4) { return String(Math.floor(n)).padStart(w, '0'); }

function updateHUD() {
  scoreEl.textContent = pad(state.score);
  speedEl.textContent = state.speed.toFixed(1);
  chipsEl.textContent = pad(state.chips, 3);
}

function startGame() {
  // clear existing obstacles/chips
  for (const o of obstacles) { scene.remove(o); o.traverse(x => { if (x.geometry) x.geometry.dispose(); }); }
  for (const c of chips) { scene.remove(c); c.traverse(x => { if (x.geometry) x.geometry.dispose(); }); }
  obstacles.length = 0;
  chips.length = 0;
  for (const p of activeParticles) { p.visible = false; particlePool.push(p); }
  activeParticles.length = 0;

  // reset segments
  for (let i = 0; i < segments.length; i++) {
    segments[i].position.z = -i * SEG_LENGTH;
  }

  state.running = true;
  state.speed = state.baseSpeed;
  state.distance = 0;
  state.score = 0;
  state.chips = 0;
  state.lane = 1;
  state.targetLaneX = LANE_X[1];
  player.position.set(LANE_X[1], playerBaseY, 0);
  state.vy = 0;
  state.jumping = false;
  state.spawnTimer = 0;
  state.time = 0;

  // pre-spawn
  for (let i = 1; i <= 4; i++) {
    spawnRow(-i * 12 - 8);
  }

  startEl.classList.add('hidden');
  gameoverEl.classList.add('hidden');
}

function gameOver() {
  state.running = false;
  if (state.score > state.best) {
    state.best = state.score;
    localStorage.setItem('null_exe_best', String(state.best));
  }
  finalScoreEl.textContent = pad(state.score);
  bestScoreEl.textContent = pad(state.best);
  gameoverEl.classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ---------- RESIZE ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- MAIN LOOP ----------
const clock = new THREE.Clock();
let lastSegZ = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;

  // animate stars
  stars.rotation.y += dt * 0.01;

  // board hover effect
  boardGroup.position.y = Math.sin(state.time * 4) * 0.05;
  boardLight.intensity = 1.8 + Math.sin(state.time * 8) * 0.4;

  if (state.running) {
    // speed ramp
    state.speed = Math.min(state.maxSpeed, state.speed + dt * 0.35);
    const moveZ = state.speed * dt;

    // move world toward player (player stays near z=0, world moves +z)
    for (const s of segments) s.position.z += moveZ;
    for (const o of obstacles) o.position.z += moveZ;
    for (const c of chips) c.position.z += moveZ;

    state.distance += moveZ;
    state.score += Math.floor(moveZ * 2);

    // lateral movement (smooth)
    player.position.x += (state.targetLaneX - player.position.x) * Math.min(1, dt * 12);

    // jump physics
    if (state.jumping) {
      state.vy += state.gravity * dt;
      player.position.y += state.vy * dt;
      if (player.position.y <= playerBaseY) {
        player.position.y = playerBaseY;
        state.vy = 0;
        state.jumping = false;
      }
    }

    // recycle segments
    segments.sort((a, b) => a.position.z - b.position.z);
    const farthest = segments[segments.length - 1];
    // If the nearest segment is ahead of player, recycle the farthest behind
    const nearest = segments[0];
    if (nearest.position.z > -SEG_LENGTH * 0.5) {
      // move farthest back
      const far = segments[segments.length - 1];
      // actually we want to keep segments behind player; if front-most is past threshold, recycle back-most
    }
    // Simpler: if front-most segment (largest z) is behind player + margin, recycle back-most to front
    segments.sort((a, b) => b.position.z - a.position.z);
    const front = segments[0];
    if (front.position.z < 2) {
      const back = segments[segments.length - 1];
      back.position.z = front.position.z + SEG_LENGTH;
      // spawn content on this new segment
      const baseZ = back.position.z;
      const rows = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < rows; i++) {
        spawnRow(baseZ - 4 - i * 6);
      }
    }

    // animate obstacles
    for (const o of obstacles) {
      if (o.userData.type === 'drone') {
        o.userData.floatPhase += dt * 3;
        o.children[0].rotation.y += dt * 3;
        o.children[0].rotation.x += dt * 1.5;
        o.children[1].rotation.z += dt * 2;
        o.position.y = 1.4 + Math.sin(o.userData.floatPhase) * 0.25;
      }
    }
    // animate chips
    for (const c of chips) {
      c.rotation.y += dt * 2.5;
      c.children[0].rotation.x += dt * 1.2;
      c.children[1].lookAt(camera.position);
    }

    cleanupPassed();
    checkCollisions();

    // camera follow subtle
    camera.position.x += (player.position.x * 0.3 - camera.position.x) * Math.min(1, dt * 4);
    camera.position.y = 4.2 + (state.jumping ? 0.3 : 0);

    updateHUD();
  } else {
    // idle camera sway
    camera.position.x = Math.sin(state.time * 0.5) * 0.3;
  }

  updateParticles(dt);

  // grid scroll
  gridHelper.position.z = ((state.time * state.speed * 0.5) % 2.5);

  renderer.render(scene, camera);
}

// initial HUD
bestScoreEl.textContent = pad(state.best);
updateHUD();
animate();
</script>
