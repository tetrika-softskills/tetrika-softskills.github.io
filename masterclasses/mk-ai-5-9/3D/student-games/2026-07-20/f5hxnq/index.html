</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

// --- STATE ---
const state = {
    isPlaying: false,
    isGameOver: false,
    score: 0,
    coins: 0,
    speed: 15,
    maxSpeed: 45,
    lane: 0, // -1, 0, 1
    targetX: 0,
    isJumping: false,
    velocityY: 0,
    gravity: -45,
    jumpForce: 18,
    playerBaseY: 0,
    distance: 0,
    time: 0
};

const lanes = [-3.5, 0, 3.5];

// --- SCENE SETUP ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#b0d4f1');
scene.fog = new THREE.Fog('#e8f4ff', 15, 80);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 6, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
container.appendChild(renderer.domElement);

// --- LIGHTING ---
const hemiLight = new THREE.HemisphereLight('#b0d4f1', '#ffffff', 1.2);
scene.add(hemiLight);

const ambLight = new THREE.AmbientLight('#cceeff', 0.6);
scene.add(ambLight);

const dirLight = new THREE.DirectionalLight('#ffffff', 1.5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

// --- MATERIALS ---
const snowMaterial = new THREE.MeshStandardMaterial({ 
    color: '#f0f8ff', 
    roughness: 0.9, 
    metalness: 0.1 
});
const woodMaterial = new THREE.MeshStandardMaterial({ 
    color: '#5c4033', 
    roughness: 0.8 
});
const flagMaterial = new THREE.MeshStandardMaterial({ 
    color: '#ff3333', 
    roughness: 0.6,
    side: THREE.DoubleSide
});
const treeMaterial = new THREE.MeshStandardMaterial({ 
    color: '#2d5016', 
    roughness: 0.9 
});
const snowCapMaterial = new THREE.MeshStandardMaterial({ 
    color: '#ffffff', 
    roughness: 1.0 
});
const iceMaterial = new THREE.MeshStandardMaterial({ 
    color: '#66ccff', 
    roughness: 0.1, 
    metalness: 0.3, 
    transparent: true, 
    opacity: 0.8,
    emissive: '#66ccff',
    emissiveIntensity: 0.3
});
const rockMaterial = new THREE.MeshStandardMaterial({ 
    color: '#888888', 
    roughness: 0.9,
    metalness: 0.0
});
const coinMaterial = new THREE.MeshStandardMaterial({ 
    color: '#ffd700', 
    roughness: 0.3, 
    metalness: 1.0,
    emissive: '#ffaa00',
    emissiveIntensity: 0.4
});

// --- PLAYER ---
let player = null;
let mixer = null;
let action = null;
const particles = [];

function createFallbackPlayer() {
    const geometry = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
    const material = new THREE.MeshStandardMaterial({ color: '#ff6600', roughness: 0.4 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.position.y = 1.0;
    state.playerBaseY = 1.0;
    scene.add(mesh);
    player = mesh;
    hideLoading();
}

const loader = new GLTFLoader();
loader.load('player_game.glb', (gltf) => {
    const model = gltf.scene;
    
    const box = new THREE.Box3().setFromObject(model);
    const height = box.max.y - box.min.y;
    const scale = 2.0 / height;
    model.scale.setScalar(scale);
    
    const newBox = new THREE.Box3().setFromObject(model);
    state.playerBaseY = -newBox.min.y;
    model.position.y = state.playerBaseY;
    
    model.rotation.y = Math.PI;
    
    model.traverse((child) => {
        if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
        }
    });
    
    scene.add(model);
    player = model;
    
    if (gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        const clip = gltf.animations.find(a => a.name.toLowerCase().includes('run') || a.name.toLowerCase().includes('walk')) || gltf.animations[0];
        action = mixer.clipAction(clip);
        action.play();
    }
    
    hideLoading();
}, undefined, (err) => {
    console.warn('GLB load failed, using fallback', err);
    createFallbackPlayer();
});

function hideLoading() {
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
}

// --- ENVIRONMENT GENERATION ---
const segments = [];
const segmentLength = 20;
const numSegments = 12;
const flags = [];

function addSnowCap(mesh, yOffset, scaleMultiplier = 1.2) {
    const box = new THREE.Box3().setFromObject(mesh);
    const height = box.max.y - box.min.y;
    const capGeo = new THREE.CylinderGeometry(0.3 * scaleMultiplier, 0.4 * scaleMultiplier, 0.2, 6);
    const cap = new THREE.Mesh(capGeo, snowCapMaterial);
    cap.position.y = height / 2 + yOffset + 0.1;
    cap.castShadow = true;
    cap.receiveShadow = true;
    mesh.add(cap);
}

function createTree() {
    const group = new THREE.Group();
    const height = 2 + Math.random() * 3;
    const radius = 0.8 + Math.random() * 0.5;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 7), treeMaterial);
    cone.position.y = height / 2;
    cone.castShadow = true;
    cone.receiveShadow = true;
    
    const cap = new THREE.Mesh(new THREE.ConeGeometry(radius * 0.6, height * 0.3, 7), snowCapMaterial);
    cap.position.y = height * 0.8;
    cap.castShadow = true;
    
    group.add(cone);
    group.add(cap);
    
    group.rotation.y = Math.random() * Math.PI * 2;
    group.rotation.z = (Math.random() - 0.5) * 0.2;
    return group;
}

function createSegment(zPos) {
    const group = new THREE.Group();
    group.position.z = zPos;
    
    // Road
    const roadGeo = new THREE.PlaneGeometry(12, segmentLength);
    const road = new THREE.Mesh(roadGeo, snowMaterial);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    group.add(road);
    
    // Ski tracks
    const trackGeo = new THREE.PlaneGeometry(0.15, segmentLength);
    const trackMat = new THREE.MeshStandardMaterial({ color: '#d0e8f2', roughness: 0.5 });
    const track1 = new THREE.Mesh(trackGeo, trackMat);
    track1.rotation.x = -Math.PI / 2;
    track1.position.set(-1, 0.01, 0);
    group.add(track1);
    
    const track2 = new THREE.Mesh(trackGeo, trackMat);
    track2.rotation.x = -Math.PI / 2;
    track2.position.set(1, 0.01, 0);
    group.add(track2);
    
    // Fences
    const postGeo = new THREE.BoxGeometry(0.15, 1.2, 0.15);
    const flagGeo = new THREE.PlaneGeometry(0.6, 0.4);
    
    for (let side of [-1, 1]) {
        const x = side * 6.5;
        for (let i = 0; i < 5; i++) {
            const z = (i / 4) * segmentLength - segmentLength / 2;
            const post = new THREE.Mesh(postGeo, woodMaterial);
            post.position.set(x, 0.6, z);
            post.castShadow = true;
            post.receiveShadow = true;
            group.add(post);
            
            const flag = new THREE.Mesh(flagGeo, flagMaterial);
            flag.position.set(x + (side * 0.3), 1.1, z);
            flag.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
            flag.userData = { offset: Math.random() * 10, baseRot: flag.rotation.y };
            group.add(flag);
            flags.push(flag);
        }
    }
    
    // Trees
    const numTrees = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numTrees; i++) {
        const side = Math.random() > 0.5 ? 1 : -1;
        const x = side * (7.5 + Math.random() * 8);
        const z = (Math.random() - 0.5) * segmentLength;
        const tree = createTree();
        tree.position.set(x, 0, z);
        group.add(tree);
    }
    
    // Obstacles & Coins
    const laneIndices = [0, 1, 2];
    // Shuffle lanes
    for (let i = laneIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [laneIndices[i], laneIndices[j]] = [laneIndices[j], laneIndices[i]];
    }
    
    // 1-2 obstacles per segment
    const numObstacles = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < numObstacles; i++) {
        const lane = laneIndices[i];
        const x = lanes[lane];
        const z = (Math.random() - 0.5) * (segmentLength * 0.6);
        
        const type = Math.random();
        let obs;
        if (type < 0.4) {
            // Rock
            const geo = new THREE.DodecahedronGeometry(0.8, 0);
            obs = new THREE.Mesh(geo, rockMaterial);
            obs.position.y = 0.6;
            obs.rotation.set(Math.random(), Math.random(), Math.random());
        } else if (type < 0.7) {
            // Ice block
            const geo = new THREE.BoxGeometry(1.2, 1.5, 1.2);
            obs = new THREE.Mesh(geo, iceMaterial);
            obs.position.y = 0.75;
        } else {
            // Small tree
            obs = createTree();
            obs.scale.setScalar(0.6);
            obs.position.y = 0;
        }
        obs.position.x = x;
        obs.position.z = z;
        obs.castShadow = true;
        obs.receiveShadow = true;
        obs.userData = { isObstacle: true, hit: false };
        addSnowCap(obs, 0, 0.8);
        group.add(obs);
    }
    
    // Coins in remaining lanes
    for (let i = numObstacles; i < 3; i++) {
        if (Math.random() > 0.3) {
            const lane = laneIndices[i];
            const x = lanes[lane];
            const z = (Math.random() - 0.5) * (segmentLength * 0.6);
            
            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coin = new THREE.Mesh(coinGeo, coinMaterial);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(x, 1.0, z);
            coin.castShadow = true;
            coin.userData = { isCoin: true, collected: false, rotSpeed: 2 + Math.random() };
            group.add(coin);
        }
    }
    
    scene.add(group);
    segments.push(group);
}

// Initialize segments
for (let i = 0; i < numSegments; i++) {
    createSegment(-i * segmentLength);
}

// --- INPUT HANDLING ---
function switchLane(dir) {
    if (!state.isPlaying || state.isGameOver) return;
    state.lane = Math.max(-1, Math.min(1, state.lane + dir));
    state.targetX = lanes[state.lane + 1];
}

function jump() {
    if (!state.isPlaying || state.isGameOver) return;
    if (!state.isJumping && player) {
        state.isJumping = true;
        state.velocityY = state.jumpForce;
    }
}

function handleAction() {
    if (!state.isPlaying && !state.isGameOver) {
        startGame();
    } else if (state.isGameOver) {
        resetGame();
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchLane(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') switchLane(1);
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        if (!state.isPlaying || state.isGameOver) {
            handleAction();
        } else {
            jump();
        }
    }
});

let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, { passive: false });

window.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;
    
    if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) {
        handleAction();
        return;
    }
    
    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) switchLane(1);
        else if (diffX < -30) switchLane(-1);
    } else {
        if (diffY < -30) jump();
    }
}, { passive: false });

// --- GAME LOGIC ---
function startGame() {
    state.isPlaying = true;
    document.getElementById('start-screen').classList.add('hidden');
}

function resetGame() {
    state.isPlaying = true;
    state.isGameOver = false;
    state.score = 0;
    state.coins = 0;
    state.speed = 15;
    state.lane = 0;
    state.targetX = 0;
    state.isJumping = false;
    state.velocityY = 0;
    state.distance = 0;
    
    if (player) {
        player.position.set(0, state.playerBaseY, 0);
        player.rotation.set(0, Math.PI, 0);
    }
    
    // Reset segments
    segments.forEach((seg, i) => {
        scene.remove(seg);
        // Clear flags array reference
        seg.children.forEach(child => {
            if (child.type === 'Mesh' && child.material === flagMaterial) {
                const idx = flags.indexOf(child);
                if (idx > -1) flags.splice(idx, 1);
            }
        });
    });
    segments.length = 0;
    flags.length = 0;
    
    for (let i = 0; i < numSegments; i++) {
        createSegment(-i * segmentLength);
    }
    
    // Clear particles
    particles.forEach(p => scene.remove(p));
    particles.length = 0;
    
    document.getElementById('game-over-screen').classList.add('hidden');
    updateHUD();
}

function spawnExplosion(position) {
    for (let i = 0; i < 30; i++) {
        const geo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        const mat = new THREE.MeshBasicMaterial({ 
            color: Math.random() > 0.5 ? '#ffffff' : '#66ccff' 
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(position);
        mesh.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 12,
            Math.random() * 12 + 5,
            (Math.random() - 0.5) * 12
        );
        scene.add(mesh);
        particles.push(mesh);
    }
}

function updateHUD() {
    document.getElementById('score-display').textContent = Math.floor(state.score);
    document.getElementById('coin-display').textContent = state.coins;
    document.getElementById('speed-display').textContent = Math.floor(state.speed * 3.6);
}

const clock = new THREE.Clock();
const playerBox = new THREE.Box3();
const tempBox = new THREE.Box3();

function animate() {
    requestAnimationFrame(animate);
    
    const delta = Math.min(clock.getDelta(), 0.1);
    state.time += delta;
    
    if (player) {
        if (mixer && state.isPlaying && !state.isGameOver) {
            mixer.update(delta);
        }
        
        if (state.isPlaying && !state.isGameOver) {
            // Speed increase
            state.speed = Math.min(state.maxSpeed, state.speed + delta * 0.5);
            state.distance += state.speed * delta;
            state.score = state.distance + state.coins * 50;
            
            // Lane switching
            player.position.x = THREE.MathUtils.lerp(player.position.x, state.targetX, 8 * delta);
            const tilt = (player.position.x - state.targetX) * -0.15;
            player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, tilt, 8 * delta);
            
            // Jump physics
            if (state.isJumping) {
                state.velocityY += state.gravity * delta;
                player.position.y += state.velocityY * delta;
                if (player.position.y <= state.playerBaseY) {
                    player.position.y = state.playerBaseY;
                    state.isJumping = false;
                    state.velocityY = 0;
                }
            }
            
            // Move player forward (conceptually, we move segments backward relative to player, 
            // but actually we move player forward and camera follows, recycling segments)
            player.position.z -= state.speed * delta;
            
            // Update lights to follow player
            dirLight.position.set(player.position.x, player.position.y + 10, player.position.z + 5);
            dirLight.target = player;
            
            // Recycle segments
            segments.forEach(seg => {
                if (seg.position.z > player.position.z + 30) {
                    seg.position.z -= numSegments * segmentLength;
                    
                    // Regenerate contents
                    seg.children = seg.children.filter(child => {
                        if (child.userData.isObstacle || child.userData.isCoin) {
                            scene.remove(child); // Actually need to remove from scene if we detach, but they are children of seg
                            return false;
                        }
                        return true;
                    });
                    
                    // Re-add obstacles and coins
                    const laneIndices = [0, 1, 2];
                    for (let i = laneIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [laneIndices[i], laneIndices[j]] = [laneIndices[j], laneIndices[i]];
                    }
                    
                    const numObstacles = 1 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < numObstacles; i++) {
                        const lane = laneIndices[i];
                        const x = lanes[lane];
                        const z = (Math.random() - 0.5) * (segmentLength * 0.6);
                        
                        const type = Math.random();
                        let obs;
                        if (type < 0.4) {
                            const geo = new THREE.DodecahedronGeometry(0.8, 0);
                            obs = new THREE.Mesh(geo, rockMaterial);
                            obs.position.y = 0.6;
                            obs.rotation.set(Math.random(), Math.random(), Math.random());
                        } else if (type < 0.7) {
                            const geo = new THREE.BoxGeometry(1.2, 1.5, 1.2);
                            obs = new THREE.Mesh(geo, iceMaterial);
                            obs.position.y = 0.75;
                        } else {
                            obs = createTree();
                            obs.scale.setScalar(0.6);
                            obs.position.y = 0;
                        }
                        obs.position.x = x;
                        obs.position.z = z;
                        obs.castShadow = true;
                        obs.receiveShadow = true;
                        obs.userData = { isObstacle: true, hit: false };
                        addSnowCap(obs, 0, 0.8);
                        seg.add(obs);
                    }
                    
                    for (let i = numObstacles; i < 3; i++) {
                        if (Math.random() > 0.3) {
                            const lane = laneIndices[i];
                            const x = lanes[lane];
                            const z = (Math.random() - 0.5) * (segmentLength * 0.6);
                            
                            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
                            const coin = new THREE.Mesh(coinGeo, coinMaterial);
                            coin.rotation.x = Math.PI / 2;
                            coin.position.set(x, 1.0, z);
                            coin.castShadow = true;
                            coin.userData = { isCoin: true, collected: false, rotSpeed: 2 + Math.random() };
                            seg.add(coin);
                        }
                    }
                }
            });
            
            // Collision Detection
            playerBox.setFromObject(player);
            playerBox.expandByScalar(-0.3); // Forgiving hitbox
            
            segments.forEach(seg => {
                seg.children.forEach(child => {
                    if (child.userData.isObstacle && !child.userData.hit) {
                        tempBox.setFromObject(child);
                        if (playerBox.intersectsBox(tempBox)) {
                            child.userData.hit = true;
                            state.isGameOver = true;
                            state.isPlaying = false;
                            spawnExplosion(player.position.clone());
                            document.getElementById('final-score').textContent = Math.floor(state.score);
                            document.getElementById('final-coins').textContent = state.coins;
                            document.getElementById('game-over-screen').classList.remove('hidden');
                        }
                    } else if (child.userData.isCoin && !child.userData.collected) {
                        tempBox.setFromObject(child);
                        if (playerBox.intersectsBox(tempBox)) {
                            child.userData.collected = true;
                            child.visible = false;
                            state.coins++;
                            state.score += 50;
                        }
                    }
                    
                    // Animate coins
                    if (child.userData.isCoin && !child.userData.collected) {
                        child.rotation.y += child.userData.rotSpeed * delta;
                    }
                });
            });
            
            updateHUD();
        }
    }
    
    // Animate flags
    flags.forEach(flag => {
        flag.rotation.y = flag.userData.baseRot + Math.sin(state.time * 5 + flag.userData.offset) * 0.3;
    });
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.userData.velocity.y -= 30 * delta;
        p.position.addScaledVector(p.userData.velocity, delta);
        p.rotation.x += delta * 8;
        p.rotation.y += delta * 8;
        if (p.position.y < 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }
    
    // Camera follow
    if (player) {
        const targetCamPos = new THREE.Vector3(
            player.position.x * 0.6,
            player.position.y + 5.5,
            player.position.z + 9
        );
        camera.position.lerp(targetCamPos, 6 * delta);
        camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z - 8);
    }
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
