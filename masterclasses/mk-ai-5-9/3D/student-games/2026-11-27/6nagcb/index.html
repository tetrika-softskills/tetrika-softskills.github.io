<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL.EXE - Cyberpunk Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #0a0a2e;
            color: #00ffcc;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none;
        }

        .title {
            font-size: 4rem;
            color: #cc44ff;
            text-shadow: 0 0 20px #cc44ff, 0 0 40px #cc44ff;
            margin-bottom: 1rem;
            letter-spacing: 0.5rem;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        .subtitle {
            font-size: 1.5rem;
            color: #00ffcc;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px #00ffcc;
        }

        .btn {
            padding: 1rem 3rem;
            font-size: 1.5rem;
            background: transparent;
            border: 2px solid #cc44ff;
            color: #cc44ff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 10px #cc44ff;
        }

        .btn:hover {
            background: #cc44ff;
            color: #0a0a2e;
            box-shadow: 0 0 20px #cc44ff, 0 0 40px #cc44ff;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            z-index: 50;
            pointer-events: none;
        }

        #score {
            margin-bottom: 0.5rem;
        }

        #speed {
            font-size: 1rem;
            color: #cc44ff;
            text-shadow: 0 0 10px #cc44ff;
        }

        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.9rem;
            color: #00ffcc;
            opacity: 0.7;
            text-shadow: 0 0 5px #00ffcc;
            z-index: 50;
            pointer-events: none;
        }

        .final-score {
            font-size: 3rem;
            color: #cc44ff;
            text-shadow: 0 0 20px #cc44ff;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <div class="title">NULL.EXE</div>
        <div class="subtitle">CYBERPUNK RUNNER</div>
        <button class="btn" id="startBtn">START</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <div class="title">GAME OVER</div>
        <div class="final-score" id="finalScore">0</div>
        <button class="btn" id="restartBtn">RESTART</button>
    </div>

    <div id="hud" class="hidden">
        <div id="score">SCORE: 0</div>
        <div id="speed">SPEED: 1.0x</div>
    </div>

    <div class="controls-info">
        ← → : MOVE | SPACE : JUMP | SWIPE : MOBILE
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Game constants
        const LANE_WIDTH = 3;
        const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];
        const JUMP_FORCE = 0.35;
        const GRAVITY = 0.015;
        const INITIAL_SPEED = 0.3;
        const SPEED_INCREMENT = 0.0001;
        const OBSTACLE_SPAWN_DISTANCE = 80;
        const SEGMENT_LENGTH = 20;
        const VISIBLE_SEGMENTS = 5;

        // Game state
        let scene, camera, renderer;
        let player, playerModel;
        let playerBaseY = 0.5;
        let currentLane = 1;
        let targetX = 0;
        let velocityY = 0;
        let isJumping = false;
        let score = 0;
        let speed = INITIAL_SPEED;
        let gameRunning = false;
        let obstacles = [];
        let coins = [];
        let particles = [];
        let roadSegments = [];
        let lastObstacleZ = 0;
        let lastCoinZ = 0;

        // DOM elements
        const canvas = document.getElementById('gameCanvas');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreEl = document.getElementById('score');
        const speedEl = document.getElementById('speed');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Initialize Three.js
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a2e);
            scene.fog = new THREE.Fog(0x0a0a2e, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, -10);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x4444ff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xcc44ff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xcc44ff, 1, 10);
            pointLight.position.set(0, 0.5, 0);
            scene.add(pointLight);

            // Create player
            createPlayer();

            // Create initial road
            for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
                createRoadSegment(-i * SEGMENT_LENGTH);
            }

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            
            // Touch controls
            let touchStartX = 0;
            let touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            canvas.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 30) moveRight();
                    else if (dx < -30) moveLeft();
                } else {
                    if (dy < -30) jump();
                }
            });

            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);
        }

        function createPlayer() {
            const loader = new GLTFLoader();
            loader.load(
                'player_game.glb',
                (gltf) => {
                    playerModel = gltf.scene;
                    playerModel.scale.set(2.0, 2.0, 2.0);
                    playerModel.position.y = playerBaseY;
                    playerModel.position.z = -5;
                    playerModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    scene.add(playerModel);
                    player = playerModel;
                },
                undefined,
                () => {
                    // Fallback: create hoverboard with capsule
                    const group = new THREE.Group();
                    
                    // Hoverboard
                    const boardGeometry = new THREE.BoxGeometry(1.5, 0.1, 3);
                    const boardMaterial = new THREE.MeshStandardMaterial({
                        color: 0x1a1a2e,
                        emissive: 0xcc44ff,
                        emissiveIntensity: 0.5,
                        metalness: 0.8,
                        roughness: 0.2
                    });
                    const board = new THREE.Mesh(boardGeometry, boardMaterial);
                    board.position.y = -0.5;
                    board.castShadow = true;
                    group.add(board);

                    // Player capsule
                    const capsuleGeometry = new THREE.CapsuleGeometry(0.4, 1.2, 8, 16);
                    const capsuleMaterial = new THREE.MeshStandardMaterial({
                        color: 0x2a2a4e,
                        emissive: 0x00ffcc,
                        emissiveIntensity: 0.3,
                        metalness: 0.6,
                        roughness: 0.3
                    });
                    const capsule = new THREE.Mesh(capsuleGeometry, capsuleMaterial);
                    capsule.position.y = 0.5;
                    capsule.castShadow = true;
                    group.add(capsule);

                    group.position.y = playerBaseY;
                    group.position.z = -5;
                    scene.add(group);
                    player = group;
                }
            );
        }

        function createRoadSegment(z) {
            const segment = new THREE.Group();
            
            // Road
            const roadGeometry = new THREE.PlaneGeometry(12, SEGMENT_LENGTH);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.8,
                metalness: 0.2
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            segment.add(road);

            // Glowing lines
            for (let i = -1; i <= 1; i++) {
                const lineGeometry = new THREE.PlaneGeometry(0.1, SEGMENT_LENGTH);
                const lineMaterial = new THREE.MeshBasicMaterial({
                    color: 0xcc44ff,
                    transparent: true,
                    opacity: 0.8
                });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * LANE_WIDTH, 0.01, 0);
                segment.add(line);
            }

            // Walls
            for (let side = -1; side <= 1; side += 2) {
                const wallGeometry = new THREE.BoxGeometry(0.5, 3, SEGMENT_LENGTH);
                const wallMaterial = new THREE.MeshStandardMaterial({
                    color: 0x0a0a2e,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.3,
                    metalness: 0.9,
                    roughness: 0.1
                });
                const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                wall.position.set(side * 7, 1.5, 0);
                wall.castShadow = true;
                segment.add(wall);

                // Neon barrier
                const barrierGeometry = new THREE.BoxGeometry(0.2, 0.2, SEGMENT_LENGTH);
                const barrierMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffcc,
                    transparent: true,
                    opacity: 0.9
                });
                const barrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
                barrier.position.set(side * 6.8, 2.5, 0);
                segment.add(barrier);
            }

            segment.position.z = z;
            scene.add(segment);
            roadSegments.push(segment);
        }

        function createObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() > 0.5 ? 'drone' : 'barrier';
            
            let obstacle;
            
            if (type === 'drone') {
                const droneGeometry = new THREE.SphereGeometry(0.6, 16, 16);
                const droneMaterial = new THREE.MeshStandardMaterial({
                    color: 0xff0044,
                    emissive: 0xff0044,
                    emissiveIntensity: 0.8,
                    metalness: 0.7,
                    roughness: 0.3
                });
                obstacle = new THREE.Mesh(droneGeometry, droneMaterial);
                obstacle.position.y = 1.5;
            } else {
                const barrierGeometry = new THREE.BoxGeometry(2, 1.5, 0.5);
                const barrierMaterial = new THREE.MeshStandardMaterial({
                    color: 0xcc44ff,
                    emissive: 0xcc44ff,
                    emissiveIntensity: 0.6,
                    metalness: 0.8,
                    roughness: 0.2
                });
                obstacle = new THREE.Mesh(barrierGeometry, barrierMaterial);
                obstacle.position.y = 0.75;
            }

            obstacle.position.x = LANES[lane];
            obstacle.position.z = -OBSTACLE_SPAWN_DISTANCE;
            obstacle.castShadow = true;
            obstacle.userData = { type: 'obstacle', lane };
            
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function createCoin() {
            const lane = Math.floor(Math.random() * 3);
            
            const coinGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coinMaterial = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                emissive: 0x00ffcc,
                emissiveIntensity: 1,
                metalness: 1,
                roughness: 0,
                transparent: true,
                opacity: 0.8
            });
            const coin = new THREE.Mesh(coinGeometry, coinMaterial);
            coin.rotation.x = Math.PI / 2;
            coin.position.x = LANES[lane];
            coin.position.y = 1;
            coin.position.z = -OBSTACLE_SPAWN_DISTANCE;
            coin.castShadow = true;
            coin.userData = { type: 'coin', lane };
            
            scene.add(coin);
            coins.push(coin);
        }

        function createParticles(position, color) {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particleGeometry = new THREE.SphereGeometry(0.1, 8, 8);
                const particleMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.copy(position);
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.3,
                        (Math.random() - 0.5) * 0.3
                    ),
                    life: 1
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function moveLeft() {
            if (currentLane > 0) {
                currentLane--;
                targetX = LANES[currentLane];
            }
        }

        function moveRight() {
            if (currentLane < 2) {
                currentLane++;
                targetX = LANES[currentLane];
            }
        }

        function jump() {
            if (!isJumping) {
                velocityY = JUMP_FORCE;
                isJumping = true;
            }
        }

        function onKeyDown(event) {
            if (!gameRunning) return;
            
            switch(event.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft();
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight();
                    break;
                case 'Space':
                case 'ArrowUp':
                case 'KeyW':
                    jump();
                    break;
            }
        }

        function checkCollisions() {
            if (!player) return;

            const playerBox = new THREE.Box3().setFromObject(player);

            // Check obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);
                
                if (playerBox.intersectsBox(obstacleBox)) {
                    createParticles(obstacle.position.clone(), 0xff0044);
                    gameOver();
                    return;
                }
            }

            // Check coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const coinBox = new THREE.Box3().setFromObject(coin);
                
                if (playerBox.intersectsBox(coinBox)) {
                    createParticles(coin.position.clone(), 0x00ffcc);
                    scene.remove(coin);
                    coins.splice(i, 1);
                    score += 100;
                    updateHUD();
                }
            }
        }

        function updateHUD() {
            scoreEl.textContent = `SCORE: ${Math.floor(score)}`;
            speedEl.textContent = `SPEED: ${(speed / INITIAL_SPEED).toFixed(1)}x`;
        }

        function startGame() {
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameRunning = true;
            animate();
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.textContent = Math.floor(score);
            gameOverScreen.classList.remove('hidden');
            hud.classList.add('hidden');
        }

        function restartGame() {
            // Reset game state
            score = 0;
            speed = INITIAL_SPEED;
            currentLane = 1;
            targetX = 0;
            velocityY = 0;
            isJumping = false;
            
            if (player) {
                player.position.x = 0;
                player.position.y = playerBaseY;
            }

            // Remove all obstacles and coins
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(coin => scene.remove(coin));
            particles.forEach(particle => scene.remove(particle));
            obstacles = [];
            coins = [];
            particles = [];

            lastObstacleZ = 0;
            lastCoinZ = 0;

            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameRunning = true;
            updateHUD();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!gameRunning) return;
            
            requestAnimationFrame(animate);

            // Update speed
            speed += SPEED_INCREMENT;
            score += speed * 0.1;

            // Move player horizontally
            if (player) {
                player.position.x += (targetX - player.position.x) * 0.15;
                
                // Jump physics
                if (isJumping) {
                    velocityY -= GRAVITY;
                    player.position.y += velocityY;
                    
                    if (player.position.y <= playerBaseY) {
                        player.position.y = playerBaseY;
                        isJumping = false;
                        velocityY = 0;
                    }
                }
            }

            // Move road segments
            roadSegments.forEach(segment => {
                segment.position.z += speed;
                if (segment.position.z > SEGMENT_LENGTH) {
                    segment.position.z -= SEGMENT_LENGTH * VISIBLE_SEGMENTS;
                }
            });

            // Spawn obstacles
            lastObstacleZ -= speed;
            if (lastObstacleZ < -OBSTACLE_SPAWN_DISTANCE + 15) {
                createObstacle();
                lastObstacleZ = 0;
            }

            // Spawn coins
            lastCoinZ -= speed;
            if (lastCoinZ < -OBSTACLE_SPAWN_DISTANCE + 10) {
                createCoin();
                lastCoinZ = 0;
            }

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.position.z += speed;
                
                // Rotate drones
                if (obstacle.userData.type === 'obstacle' && obstacle.geometry.type === 'SphereGeometry') {
                    obstacle.rotation.y += 0.05;
                }
                
                if (obstacle.position.z > 10) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                }
            }

            // Move coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += speed;
                coin.rotation.y += 0.05;
                
                if (coin.position.z > 10) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.position.add(particle.userData.velocity);
                particle.userData.velocity.y -= 0.01;
                particle.userData.life -= 0.02;
                particle.material.opacity = particle.userData.life;
                
                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    particles.splice(i, 1);
                }
            }

            // Check collisions
            checkCollisions();

            // Update HUD
            updateHUD();

            renderer.render(scene, camera);
        }

        // Initialize and start
        init();
    </script>
</body>
</html>
