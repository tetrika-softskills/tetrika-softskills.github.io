```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CITY RUSH</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #87ceeb;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #loading-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        
        .hud-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .hud-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .hud-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
        }
        
        .coin-icon {
            width: 24px;
            height: 24px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #ffaa00;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.85), rgba(255, 69, 0, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.3s ease;
        }
        
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .title {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            line-height: 1;
        }
        
        .subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
        }
        
        .final-score {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 40px;
            border-radius: 16px;
        }
        
        .blink-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: blink 1.5s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @media (max-width: 768px) {
            .title { font-size: 3rem; }
            .subtitle { font-size: 1rem; }
            .hud-panel { padding: 8px 16px; }
            .hud-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка города...</div>
    </div>

    <div id="hud">
        <div class="hud-panel">
            <div>
                <div class="hud-label">Счет</div>
                <div class="hud-value" id="score-display">0</div>
            </div>
        </div>
        <div class="hud-panel">
            <div class="coin-icon"></div>
            <div class="hud-value" id="coin-display">0</div>
        </div>
        <div class="hud-panel">
            <div>
                <div class="hud-label">Скорость</div>
                <div class="hud-value"><span id="speed-display">0</span> <span style="font-size:0.8rem">km/h</span></div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <div class="title">CITY RUSH</div>
        <div class="subtitle" id="overlay-subtitle">Добро пожаловать в мегаполис</div>
        <div class="final-score hidden" id="final-score">Счет: 0</div>
        <div class="blink-text">Нажми ПРОБЕЛ или тапни для старта</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

        const state = {
            isPlaying: false,
            isGameOver: false,
            score: 0,
            coins: 0,
            speed: 15.0,
            maxSpeed: 35.0,
            lane: 1,
            targetX: 0,
            playerBaseY: 0,
            isJumping: false,
            velocityY: 0,
            gravity: -25.0,
            jumpForce: 12.0,
            distance: 0
        };

        const LANE_WIDTH = 3.5;
        const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];
        const SEGMENT_LENGTH = 40;
        const SEGMENT_COUNT = 6;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 30, 110);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff0dd, 1.5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);
        scene.add(dirLight.target);

        const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
        const whiteLineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
        const yellowDashMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.6, roughness: 0.5 });
        const curbMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.7 });
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
        
        function createBuildingMaterial() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d0d0d0';
            ctx.fillRect(0, 0, 64, 128);
            ctx.fillStyle = '#ffffff';
            for(let y=8; y<128; y+=24) {
                ctx.fillRect(4, y, 56, 8);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 3);
            return new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.8,
                emissive: 0x88ccff,
                emissiveMap: tex,
                emissiveIntensity: 0.6
            });
        }
        const buildingMat = createBuildingMaterial();
        const obstacleLowMat = new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.4, metalness: 0.1 });
        const obstacleHighMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4, metalness: 0.1 });
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.4, metalness: 0.8, roughness: 0.2 });
        const lampMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5 });
        const lampLightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa, emissiveIntensity: 1.0 });

        let player = new THREE.Group();
        let mixer = null;
        let playerLoaded = false;
        let fallbackActive = false;
        let loadTimeout;

        function createFallbackPlayer() {
            if (playerLoaded) return;
            fallbackActive = true;
            const geo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00aaff, roughness: 0.3, metalness: 0.5 });
            player = new THREE.Mesh(geo, mat);
            player.castShadow = true;
            player.receiveShadow = true;
            player.position.y = 1.0;
            state.playerBaseY = 1.0; 
            scene.add(player);
            playerLoaded = true;
            hideLoading();
        }

        loadTimeout = setTimeout(() => {
            if (!playerLoaded) {
                console.warn("Загрузка модели превысила таймаут. Используется запасной вариант.");
                createFallbackPlayer();
            }
        }, 1500);

        function initPlayer() {
            const loader = new GLTFLoader();
            loader.load('player_game.glb', (gltf) => {
                clearTimeout(loadTimeout);
                
                if (fallbackActive) {
                    scene.remove(player);
                    if (player.geometry) player.geometry.dispose();
                    if (player.material) player.material.dispose();
                    fallbackActive = false;
                }
                
                player = gltf.scene;
                player.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                const box = new THREE.Box3().setFromObject(player);
                const height = box.max.y - box.min.y;
                const scale = 2.0 / height;
                player.scale.setScalar(scale);
                player.updateMatrixWorld();
                
                const newBox = new THREE.Box3().setFromObject(player);
                state.playerBaseY = -newBox.min.y;
                
                if (!state.isJumping) {
                    player.position.y = state.playerBaseY;
                } else {
                    player.position.y = state.playerBaseY + (player.position.y - 1.0);
                    if (player.position.y < state.playerBaseY) {
                        player.position.y = state.playerBaseY;
                        state.isJumping = false;
                        state.velocityY = 0;
                    }
                }
                
                player.rotation.y = Math.PI; 
                scene.add(player);
                
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(player);
                    const clip = gltf.animations.find(a => a.name.toLowerCase().includes('run') || a.name.toLowerCase().includes('walk'));
                    if (clip) {
                        const action = mixer.clipAction(clip);
                        action.play();
                    }
                }
                
                playerLoaded = true;
                hideLoading();
            }, undefined, (error) => {
                clearTimeout(loadTimeout);
                console.warn("Ошибка загрузки модели, используется запасной вариант:", error);
                createFallbackPlayer();
            });
        }

        function hideLoading() {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        }

        const segments = [];
        const activeObstacles = [];
        const activeCoins = [];
        const particles = [];

        function createRoadSegment(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;

            const road = new THREE.Mesh(new THREE.PlaneGeometry(10.5, SEGMENT_LENGTH), asphaltMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            group.add(road);

            const leftLine = new THREE.Mesh(new THREE.PlaneGeometry(0.15, SEGMENT_LENGTH), whiteLineMat);
            leftLine.rotation.x = -Math.PI / 2;
            leftLine.position.set(-5.15, 0.01, 0);
            group.add(leftLine);

            const rightLine = new THREE.Mesh(new THREE.PlaneGeometry(0.15, SEGMENT_LENGTH), whiteLineMat);
            rightLine.rotation.x = -Math.PI / 2;
            rightLine.position.set(5.15, 0.01, 0);
            group.add(rightLine);

            for (let z = -SEGMENT_LENGTH/2 + 2; z < SEGMENT_LENGTH/2; z += 4) {
                const dash1 = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 2), yellowDashMat);
                dash1.rotation.x = -Math.PI / 2;
                dash1.position.set(-LANE_WIDTH/2, 0.01, z);
                group.add(dash1);

                const dash2 = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 2), yellowDashMat);
                dash2.rotation.x = -Math.PI / 2;
                dash2.position.set(LANE_WIDTH/2, 0.01, z);
                group.add(dash2);
            }

            const leftCurb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, SEGMENT_LENGTH), curbMat);
            leftCurb.position.set(-5.5, 0.1, 0);
            leftCurb.receiveShadow = true;
            leftCurb.castShadow = true;
            group.add(leftCurb);

            const rightCurb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, SEGMENT_LENGTH), curbMat);
            rightCurb.position.set(5.5, 0.1, 0);
            rightCurb.receiveShadow = true;
            rightCurb.castShadow = true;
            group.add(rightCurb);

            const leftSidewalk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, SEGMENT_LENGTH), sidewalkMat);
            leftSidewalk.position.set(-7.75, 0.075, 0);
            leftSidewalk.receiveShadow = true;
            group.add(leftSidewalk);

            const rightSidewalk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, SEGMENT_LENGTH), sidewalkMat);
            rightSidewalk.position.set(7.75, 0.075, 0);
            rightSidewalk.receiveShadow = true;
            group.add(rightSidewalk);

            const buildCount = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < buildCount; i++) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const width = 3 + Math.random() * 4;
                const depth = 3 + Math.random() * 4;
                const height = 8 + Math.random() * 20;
                const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), buildingMat);
                building.position.set(side * (10 + Math.random() * 5), height / 2, (Math.random() - 0.5) * SEGMENT_LENGTH * 0.8);
                building.castShadow = true;
                building.receiveShadow = true;
                group.add(building);
            }

            for (let z = -SEGMENT_LENGTH/2 + 5; z < SEGMENT_LENGTH/2; z += 20) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), lampMat);
                pole.position.set(-6.5, 3, z);
                pole.castShadow = true;
                group.add(pole);

                const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3), lampLightMat);
                lamp.position.set(-6.5, 6.2, z);
                group.add(lamp);

                const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), lampMat);
                pole2.position.set(6.5, 3, z + 10);
                pole2.castShadow = true;
                group.add(pole2);

                const lamp2 = new THREE.Mesh(new THREE.SphereGeometry(0.3), lampLightMat);
                lamp2.position.set(6.5, 6.2, z + 10);
                group.add(lamp2);
            }

            group.userData.obstacles = [];
            group.userData.coins = [];
            scene.add(group);
            return group;
        }

        function spawnObjects(segment) {
            segment.userData.obstacles.forEach(o => scene.remove(o));
            segment.userData.coins.forEach(c => scene.remove(c));
            segment.userData.obstacles = [];
            segment.userData.coins = [];

            const lane = Math.floor(Math.random() * 3);
            const isHigh = Math.random() > 0.5;
            const obsGeo = new THREE.BoxGeometry(2, isHigh ? 3.5 : 1.2, 1);
            const obsMat = isHigh ? obstacleHighMat : obstacleLowMat;
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(LANES[lane], (isHigh ? 3.5 : 1.2) / 2, segment.position.z + (Math.random() - 0.5) * 10);
            obs.castShadow = true;
            obs.receiveShadow = true;
            obs.userData.isLow = !isHigh;
            scene.add(obs);
            segment.userData.obstacles.push(obs);
            activeObstacles.push(obs);

            for (let i = 0; i < 3; i++) {
                if (i !== lane && Math.random() > 0.3) {
                    const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), coinMat);
                    coin.rotation.x = Math.PI / 2;
                    coin.position.set(LANES[i], 1.0, segment.position.z + (Math.random() - 0.5) * 20);
                    coin.castShadow = true;
                    scene.add(coin);
                    segment.userData.coins.push(coin);
                    activeCoins.push(coin);
                }
            }
        }

        function initWorld() {
            for (let i = 0; i < SEGMENT_COUNT; i++) {
                const z = -i * SEGMENT_LENGTH;
                const segment = createRoadSegment(z);
                if (i > 0) spawnObjects(segment);
                segments.push(segment);
            }
        }

        function spawnExplosion(position) {
            for (let i = 0; i < 30; i++) {
                const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400, emissiveIntensity: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);
                mesh.castShadow = true;
                scene.add(mesh);
                particles.push({
                    mesh,
                    velocity: new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 8 + 2, (Math.random() - 0.5) * 8),
                    life: 1.0 + Math.random() * 0.5
                });
            }
        }

        function changeLane(dir) {
            if (!state.isPlaying || state.isGameOver) return;
            const newLane = state.lane + dir;
            if (newLane >= 0 && newLane <= 2) {
                state.lane = newLane;
                state.targetX = LANES[state.lane];
            }
        }

        function jump() {
            if (!state.isPlaying || state.isGameOver) return;
            if (!state.isJumping) {
                state.isJumping = true;
                state.velocityY = state.jumpForce;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
            if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (!state.isPlaying || state.isGameOver) {
                    resetGame();
                } else {
                    jump();
                }
            }
        });

        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!state.isPlaying || state.isGameOver) {
                resetGame();
                return;
            }
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) changeLane(1);
                else if (dx < -30) changeLane(-1);
            } else {
                if (dy < -30) jump();
            }
        }, { passive: true });

        function resetGame() {
            state.isPlaying = true;
            state.isGameOver = false;
            state.score = 0;
            state.coins = 0;
            state.speed = 15.0;
            state.lane = 1;
            state.targetX = 0;
            state.isJumping = false;
            state.velocityY = 0;
            state.distance = 0;

            player.position.set(0, state.playerBaseY, 0);
            player.rotation.set(0, Math.PI, 0);
            
            activeObstacles.forEach(o => scene.remove(o));
            activeCoins.forEach(c => scene.remove(c));
            activeObstacles.length = 0;
            activeCoins.length = 0;
            
            segments.forEach((seg, i) => {
                seg.position.z = -i * SEGMENT_LENGTH;
                if (i > 0) spawnObjects(seg);
            });

            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('final-score').classList.add('hidden');
            updateHUD();
        }

        function triggerGameOver() {
            state.isPlaying = false;
            state.isGameOver = true;
            spawnExplosion(player.position.clone().add(new THREE.Vector3(0, 1, 0)));
            
            document.getElementById('overlay-subtitle').textContent = 'Игра окончена';
            document.getElementById('final-score').textContent = `Счет: ${Math.floor(state.score)} | Монеты: ${state.coins}`;
            document.getElementById('final-score').classList.remove('hidden');
            document.getElementById('overlay').classList.remove('hidden');
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = Math.floor(state.score);
            document.getElementById('coin-display').textContent = state.coins;
            document.getElementById('speed-display').textContent = Math.floor(state.speed * 3.6);
        }

        const clock = new THREE.Clock();
        const playerBox = new THREE.Box3();
        const obsBox = new THREE.Box3();

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = Math.min(clock.getDelta(), 0.1);
            
            if (mixer && state.isPlaying && !state.isGameOver) {
                mixer.update(dt);
            }

            if (state.isPlaying && !state.isGameOver) {
                state.speed = Math.min(state.speed + dt * 0.2, state.maxSpeed);
                state.distance += state.speed * dt;
                state.score += state.speed * dt * 0.1 + state.coins * 10;
                
                player.position.x += (state.targetX - player.position.x) * 10 * dt;
                player.rotation.z = (player.position.x - state.targetX) * 0.15;
                player.rotation.z = Math.max(-0.3, Math.min(0.3, player.rotation.z));

                if (state.isJumping) {
                    state.velocityY += state.gravity * dt;
                    player.position.y += state.velocityY * dt;
                    if (player.position.y <= state.playerBaseY) {
                        player.position.y = state.playerBaseY;
                        state.isJumping = false;
                        state.velocityY = 0;
                    }
                }

                player.position.z -= state.speed * dt;

                const camTargetX = player.position.x * 0.6;
                camera.position.x += (camTargetX - camera.position.x) * 5 * dt;
                camera.position.y += ((player.position.y + 4) - camera.position.y) * 5 * dt;
                camera.position.z = player.position.z + 9;
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 10);

                dirLight.position.set(player.position.x, player.position.y + 15, player.position.z + 10);
                dirLight.target.position.copy(player.position);
                dirLight.target.updateMatrixWorld();

                segments.forEach(seg => {
                    if (seg.position.z > player.position.z + 20) {
                        seg.position.z -= SEGMENT_COUNT * SEGMENT_LENGTH;
                        spawnObjects(seg);
                    }
                });

                playerBox.setFromObject(player);
                playerBox.expandByScalar(-0.2);

                for (let i = activeObstacles.length - 1; i >= 0; i--) {
                    const obs = activeObstacles[i];
                    if (obs.position.z > player.position.z + 10) continue;
                    
                    obsBox.setFromObject(obs);
                    if (playerBox.intersectsBox(obsBox)) {
                        if (obs.userData.isLow && player.position.y > state.playerBaseY + 1.5) {
                            // Jumped over
                        } else {
                            triggerGameOver();
                        }
                    }
                }

                for (let i = activeCoins.length - 1; i >= 0; i--) {
                    const coin = activeCoins[i];
                    coin.rotation.y += 3 * dt;
                    if (coin.position.z > player.position.z + 10) continue;
                    
                    const dist = player.position.distanceTo(coin.position);
                    if (dist < 1.5) {
                        state.coins++;
                        scene.remove(coin);
                        activeCoins.splice(i, 1);
                        segments.forEach(seg => {
                            const idx = seg.userData.coins.indexOf(coin);
                            if (idx > -1) seg.userData.coins.splice(idx, 1);
                        });
                        updateHUD();
                    }
                }

                updateHUD();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.velocity.y += state.gravity * dt;
                p.mesh.position.addScaledVector(p.velocity, dt);
                p.mesh.rotation.x += 5 * dt;
                p.mesh.rotation.y += 5 * dt;
                p.life -= dt;
                p.mesh.scale.setScalar(p.life);
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initPlayer();
        initWorld();
        animate();
    </script>
</body>
</html>
